
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7568ff">
<title>Axion — 실시간 채팅</title>
<style>
:root {
  --bg:#101117;
  --panel:#191a23;
  --bubble:#292b38;
  --accent:#7568ff;
  --text:#f5f5ff;
  --muted:#9b9db0;
  --border:#30313f;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}
.app {
  max-width:900px;
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
}
header {
  display:flex;
  align-items:center;
  gap:12px;
  padding:17px;
  background:#171820;
  border-bottom:1px solid var(--border);
}
.logo {
  width:45px;
  height:45px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#9185ff,#5847e8);
  font-size:25px;
  font-weight:900;
  box-shadow:0 4px 18px #7568ff40;
}
.brand { flex:1; }
.brand h1 {
  margin:0;
  font-size:21px;
  letter-spacing:.5px;
}
.brand p {
  margin:3px 0 0;
  color:var(--muted);
  font-size:12px;
}
.online {
  padding:7px 11px;
  border:1px solid var(--border);
  border-radius:20px;
  font-size:11px;
  color:#b7b0ff;
}
#notice {
  display:none;
  padding:10px 14px;
  background:#49351f;
  color:#ffe1a1;
  font-size:13px;
  overflow-wrap:anywhere;
}
#messages {
  flex:1;
  overflow-y:auto;
  padding:18px 14px;
  scroll-behavior:smooth;
}
.empty {
  margin-top:25vh;
  text-align:center;
  color:var(--muted);
  line-height:1.8;
}
.message {
  display:flex;
  align-items:flex-end;
  gap:9px;
  margin-bottom:17px;
}
.message.mine { flex-direction:row-reverse; }
.avatar {
  flex-shrink:0;
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#5146a5;
  font-weight:700;
}
.mine .avatar { background:#326b60; }
.body { max-width:78%; min-width:0; }
.meta {
  display:flex;
  gap:8px;
  margin:0 3px 5px;
  color:var(--muted);
  font-size:12px;
}
.mine .meta { justify-content:flex-end; }
.bubble {
  padding:11px 13px;
  background:var(--bubble);
  border-radius:15px 15px 15px 4px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.5;
  touch-action:pan-y;
}
.mine .bubble {
  background:#5147a6;
  border-radius:15px 15px 4px 15px;
}
.quote {
  display:block;
  padding:7px 9px;
  margin-bottom:8px;
  background:#14151d80;
  border-left:3px solid #aaa1ff;
  border-radius:5px;
  color:#e0dcff;
  font-size:12px;
}
.quote strong {
  display:block;
  margin-bottom:3px;
}
.composer {
  padding:12px;
  background:#171820;
  border-top:1px solid var(--border);
}
#replyPreview {
  display:none;
  align-items:center;
  gap:10px;
  padding:10px;
  margin-bottom:10px;
  background:#292a38;
  border-left:3px solid var(--accent);
  border-radius:8px;
}
#replyPreview.show { display:flex; }
.reply-info { flex:1; min-width:0; }
#replyName {
  font-size:12px;
  font-weight:700;
  color:#bdb5ff;
}
#replyText {
  margin-top:3px;
  font-size:12px;
  color:var(--muted);
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
#cancelReply {
  border:0;
  background:none;
  color:var(--muted);
  font-size:24px;
}
form { display:flex; gap:8px; }
input {
  min-width:0;
  padding:12px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#242530;
  color:white;
  outline:none;
  font:inherit;
}
input:focus { border-color:var(--accent); }
#name { width:120px; }
#message { flex:1; }
#send {
  padding:0 18px;
  border:0;
  border-radius:11px;
  background:var(--accent);
  color:white;
  font-weight:700;
  cursor:pointer;
}
#send:disabled { opacity:.5; cursor:not-allowed; }
.hint {
  margin:9px 3px 0;
  color:var(--muted);
  font-size:11px;
}
@media(max-width:520px) {
  header { padding:13px; }
  .online { display:none; }
  #messages { padding:14px 9px; }
  form { flex-wrap:wrap; }
  #name { width:100%; }
  #message { flex:1; }
  #send { min-height:44px; }
  .body { max-width:84%; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">A</div>
    <div class="brand">
      <h1>Axion</h1>
      <p>Connect. Chat. Together.</p>
    </div>
    <div class="online" id="status">연결 중...</div>
  </header>

  <div id="notice"></div>

  <main id="messages">
    <div class="empty">Axion에 오신 것을 환영합니다.<br>메시지를 불러오는 중...</div>
  </main>

  <section class="composer">
    <div id="replyPreview">
      <div class="reply-info">
        <div id="replyName">답장</div>
        <div id="replyText"></div>
      </div>
      <button id="cancelReply" type="button" aria-label="답장 취소">×</button>
    </div>

    <form id="form">
      <input id="name" maxlength="24" placeholder="닉네임" required>
      <input id="message" maxlength="1500" placeholder="Axion에 메시지 보내기..." required>
      <button id="send" type="submit" disabled>전송</button>
    </form>

    <div class="hint">
      모바일: 메시지를 왼쪽으로 밀어 답장 · PC: 마우스 오른쪽 클릭
    </div>
  </section>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase, ref, push, set, query,
  orderByChild, limitToLast, onChildAdded,
  onValue, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAf-nM5PJRUo2q7TvX2LeZNKxh8A021bck",
  authDomain: "chat-27c50.firebaseapp.com",
  databaseURL: "https://chat-27c50-default-rtdb.firebaseio.com",
  projectId: "chat-27c50",
  storageBucket: "chat-27c50.firebasestorage.app",
  messagingSenderId: "811770063187",
  appId: "1:811770063187:web:ba17f4f49ebb682c9cd9a6"
};

const $ = id => document.getElementById(id);
const messages = $("messages");
const nameInput = $("name");
const messageInput = $("message");
const sendButton = $("send");

nameInput.value = localStorage.getItem("axionName") || "";

let replyTo = null;
const rendered = new Set();

function showNotice(text) {
  $("notice").textContent = text;
  $("notice").style.display = "block";
}

function startReply(message) {
  replyTo = {
    id: message.id,
    name: message.name,
    text: message.text
  };
  $("replyName").textContent = message.name + "님에게 답장";
  $("replyText").textContent = message.text;
  $("replyPreview").classList.add("show");
  messageInput.focus();
}

function cancelReply() {
  replyTo = null;
  $("replyPreview").classList.remove("show");
}
$("cancelReply").addEventListener("click", cancelReply);

function addText(parent, tag, text, className = "") {
  const element = document.createElement(tag);
  element.textContent = text;
  if (className) element.className = className;
  parent.appendChild(element);
  return element;
}

function formatTime(timestamp) {
  if (!timestamp) return "";
  return new Date(timestamp).toLocaleTimeString("ko-KR", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function renderMessage(id, data) {
  if (rendered.has(id)) return;
  rendered.add(id);

  const empty = messages.querySelector(".empty");
  if (empty) empty.remove();

  const item = {
    id,
    name: data.name || "익명",
    text: data.text || ""
  };

  const row = document.createElement("article");
  row.className = "message";
  if (item.name === nameInput.value.trim()) {
    row.classList.add("mine");
  }

  addText(row, "div", item.name.slice(0, 1), "avatar");

  const body = document.createElement("div");
  body.className = "body";

  const meta = document.createElement("div");
  meta.className = "meta";
  addText(meta, "span", item.name);
  addText(meta, "span", formatTime(data.createdAt));
  body.appendChild(meta);

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (data.replyTo && data.replyTo.text) {
    const quote = document.createElement("div");
    quote.className = "quote";
    addText(quote, "strong", data.replyTo.name + "에게 답장");
    addText(quote, "span", data.replyTo.text);
    bubble.appendChild(quote);
  }

  addText(bubble, "span", item.text);
  body.appendChild(bubble);
  row.appendChild(body);
  messages.appendChild(row);

  // PC: 오른쪽 클릭으로 답장
  row.addEventListener("contextmenu", event => {
    event.preventDefault();
    startReply(item);
  });

  // 모바일: 왼쪽으로 밀어서 답장
  let startX = 0;
  let startY = 0;

  bubble.addEventListener("touchstart", event => {
    if (event.touches.length !== 1) return;
    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;
  }, { passive: true });

  bubble.addEventListener("touchend", event => {
    if (!event.changedTouches.length) return;

    const dx = event.changedTouches[0].clientX - startX;
    const dy = event.changedTouches[0].clientY - startY;

    if (dx < -55 && Math.abs(dx) > Math.abs(dy) * 1.25) {
      startReply(item);
    }
  }, { passive: true });

  // PC: 왼쪽 드래그로 답장
  let mouseStart = null;

  bubble.addEventListener("pointerdown", event => {
    if (event.pointerType === "mouse" && event.button === 0) {
      mouseStart = event.clientX;
    }
  });

  bubble.addEventListener("pointerup", event => {
    if (mouseStart === null) return;
    const dx = event.clientX - mouseStart;
    mouseStart = null;
    if (dx < -65) startReply(item);
  });

  messages.scrollTop = messages.scrollHeight;
}

try {
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const messageQuery = query(
    ref(db, "messages"),
    orderByChild("createdAt"),
    limitToLast(200)
  );

  onValue(ref(db, ".info/connected"), snapshot => {
    const connected = snapshot.val() === true;
    $("status").textContent = connected ? "실시간 연결됨" : "연결 중...";
    sendButton.disabled = !connected;
  });

  onChildAdded(messageQuery, snapshot => {
    renderMessage(snapshot.key, snapshot.val() || {});
  }, error => {
    showNotice("메시지를 불러오지 못했습니다: " + error.message);
  });

  $("form").addEventListener("submit", async event => {
    event.preventDefault();

    const name = nameInput.value.trim().slice(0, 24);
    const text = messageInput.value.trim();

    if (!name || !text || sendButton.disabled) return;

    nameInput.value = name;
    localStorage.setItem("axionName", name);
    sendButton.disabled = true;

    try {
      const newMessage = push(ref(db, "messages"));

      await set(newMessage, {
        name,
        text,
        createdAt: serverTimestamp(),
        replyTo: replyTo ? { ...replyTo } : null
      });

      messageInput.value = "";
      cancelReply();
      messageInput.focus();
    } catch (error) {
      showNotice("전송 실패: " + error.message);
    } finally {
      sendButton.disabled = false;
    }
  });

} catch (error) {
  $("status").textContent = "연결 오류";
  showNotice("Firebase 설정을 확인하세요: " + error.message);
}
</script>
</body>
</html>
