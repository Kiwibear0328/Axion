
<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axion Chat</title>

<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

:root {
  font-family: Pretendard, system-ui, sans-serif;
  --accent: #8257f5;
  --pink: #ed83d0;
  --line: rgba(133, 115, 205, .19);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  font-family: Pretendard, system-ui, sans-serif;
  transition: background .3s, color .3s;
}

body.dark {
  color: #f4f0ff;
  background:
    radial-gradient(ellipse at 0% 0%, #39203d 0%, transparent 38%),
    radial-gradient(ellipse at 100% 100%, #17264c 0%, transparent 40%),
    #171627;
}

body.light {
  color: #292641;
  background:
    radial-gradient(ellipse at 0% 0%, #ffdeef 0%, transparent 42%),
    radial-gradient(ellipse at 100% 0%, #dce8ff 0%, transparent 40%),
    radial-gradient(ellipse at 80% 100%, #e6d8ff 0%, transparent 40%),
    #f9f8ff;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  gap: 18px;
  padding: 14px 2%;
}

.sidebar, .chat {
  border: 1px solid var(--line);
  border-radius: 28px;
  overflow: hidden;
  min-height: 0;
  backdrop-filter: blur(24px);
}

.dark .sidebar, .dark .chat {
  background: rgba(28, 26, 45, .94);
}

.light .sidebar, .light .chat {
  background: rgba(255, 255, 255, .88);
  box-shadow: 0 15px 50px rgba(116, 95, 190, .08);
}

.sidebar {
  width: 298px;
  flex: 0 0 298px;
  padding: 28px 18px 18px;
  display: flex;
  flex-direction: column;
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 0 8px;
}

.brand-logo, .avatar, .channel-icon, .send {
  background: linear-gradient(135deg, #7961ff, #ed83d0);
  color: white;
}

.brand-logo {
  width: 49px;
  height: 49px;
  border-radius: 17px;
  display: grid;
  place-items: center;
  font-size: 25px;
  font-weight: 900;
  box-shadow: 0 8px 24px #9063e833;
}

.brand-name { font-size: 26px; font-weight: 850; letter-spacing: -.8px; }
.brand-sub { color: #9994b6; font-size: 11px; margin-top: 4px; }

.side-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 36px 8px 15px;
  font-size: 12px;
  letter-spacing: 1.3px;
  color: #9994b6;
  font-weight: 850;
}

.icon-btn {
  border: 0;
  cursor: pointer;
  border-radius: 13px;
  padding: 10px;
  color: #8566f7;
  background: rgba(133, 102, 247, .12);
  font-size: 19px;
  font-weight: 700;
}

.channels { display: flex; flex-direction: column; gap: 7px; }

.channel {
  width: 100%;
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 11px;
  border: 0;
  border-radius: 17px;
  text-align: left;
  cursor: pointer;
  color: inherit;
  background: transparent;
  font: inherit;
}

.channel.active {
  background: linear-gradient(110deg, rgba(126, 92, 245, .16), rgba(236, 123, 207, .12));
  color: #8760f5;
}

.dark .channel.active {
  background: linear-gradient(110deg, rgba(126, 92, 245, .22), rgba(236, 123, 207, .16));
  color: #c4a8ff;
}

.channel-icon {
  flex: 0 0 39px;
  height: 39px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  font-size: 18px;
  background: rgba(135, 100, 245, .12);
  color: #8760f5;
}

.channel-name { font-weight: 750; flex: 1; }
.channel-dot { color: #b5b3cc; font-size: 12px; }

.profile {
  margin-top: auto;
  padding: 15px 8px 0;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 11px;
}

.avatar {
  width: 43px;
  height: 43px;
  flex: 0 0 43px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  font-size: 18px;
  font-weight: 800;
}

.profile-info { flex: 1; min-width: 0; }
.profile-name { font-weight: 800; font-size: 14px; overflow-wrap: anywhere; }
.online { color: #36bb93; font-size: 12px; margin-top: 4px; }

.chat {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.chat-head {
  min-height: 91px;
  padding: 20px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--line);
}

.chat-title {
  display: flex;
  align-items: center;
  gap: 13px;
  min-width: 0;
}

.chat-title h2 { margin: 0; font-size: 20px; font-weight: 850; }
.chat-title p { margin: 5px 0 0; font-size: 13px; color: #9994b6; }

.head-actions { display: flex; align-items: center; gap: 10px; }

.live {
  border-radius: 99px;
  background: #e8fff5;
  color: #23b58a;
  font-size: 12px;
  font-weight: 800;
  padding: 10px 14px;
  white-space: nowrap;
}

.messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.day-divider {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: #9994b6;
  margin: 8px 0 4px;
}

.day-divider::before, .day-divider::after {
  content: "";
  width: 60px;
  height: 1px;
  background: var(--line);
}

.msg {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  max-width: 100%;
  animation: appear .18s ease-out;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg-main { min-width: 0; max-width: min(700px, 90%); }
.meta { display: flex; gap: 9px; align-items: center; margin: 2px 0 7px; font-size: 12px; }
.meta .name { font-weight: 800; }
.time { color: #9994b6; }

.bubble {
  display: inline-block;
  max-width: 100%;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  padding: 12px 15px;
  line-height: 1.55;
  border-radius: 5px 16px 16px 16px;
  font-size: 14px;
}

.dark .bubble { background: #302d49; }
.light .bubble { background: #f1effb; }

.reply-preview {
  border-left: 3px solid #9878ff;
  padding: 7px 10px;
  margin-bottom: 6px;
  border-radius: 5px;
  background: rgba(135, 100, 245, .10);
  font-size: 12px;
  color: #9994b6;
  cursor: pointer;
}

.mention {
  color: #9471ff;
  font-weight: 850;
}

.msg-tools {
  display: flex;
  gap: 6px;
  margin-top: 5px;
  flex-wrap: wrap;
}

.tool-btn {
  font-family: inherit;
  font-size: 11px;
  border: 1px solid var(--line);
  color: #9477ed;
  background: transparent;
  padding: 5px 9px;
  border-radius: 8px;
  cursor: pointer;
}

.tool-btn:hover { background: rgba(135, 100, 245, .12); }
.tool-btn.danger { color: #ef7777; }

.composer-wrap {
  border-top: 1px solid var(--line);
  padding: 14px 22px 18px;
}

.replying {
  display: none;
  padding: 9px 12px;
  margin-bottom: 9px;
  border-radius: 10px;
  background: rgba(135, 100, 245, .10);
  font-size: 12px;
  color: #9477ed;
  align-items: center;
  gap: 8px;
}

.replying span { flex: 1; }
.replying button { border: 0; background: transparent; color: inherit; cursor: pointer; }

.composer {
  min-height: 72px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 11px 9px 16px;
  border: 1px solid rgba(142, 120, 216, .42);
  border-radius: 22px;
  transition: box-shadow .2s, border-color .2s;
}

.composer:focus-within {
  border-color: #9b7cff;
  box-shadow: 0 0 0 3px rgba(135, 100, 245, .09);
}

.light .composer { background: rgba(255,255,255,.65); }
.dark .composer { background: rgba(38, 35, 58, .7); }

#message {
  flex: 1;
  min-width: 0;
  background: transparent;
  color: inherit;
  border: 0;
  outline: 0;
  font: inherit;
  font-size: 14px;
}

#message::placeholder { color: #aaa6c6; }

.send {
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  border: 0;
  border-radius: 16px;
  font-size: 21px;
  cursor: pointer;
  box-shadow: 0 5px 16px rgba(143, 93, 240, .25);
}

.send:hover { filter: brightness(1.1); transform: translateY(-1px); }
.footer-hint { display: flex; justify-content: space-between; padding: 12px 5px 0; color: #a29dbf; font-size: 11px; }

.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(8, 7, 20, .65);
  backdrop-filter: blur(10px);
  display: none;
  place-items: center;
  padding: 20px;
}

.modal-box {
  width: min(410px, 100%);
  padding: 25px;
  border: 1px solid var(--line);
  border-radius: 23px;
  background: #211f35;
  color: #f4f0ff;
  box-shadow: 0 25px 100px #0004;
}

.modal-box h3 { margin: 0 0 9px; font-size: 21px; }
.modal-box p { color: #aaa5c5; font-size: 13px; line-height: 1.6; }
.modal-box input {
  width: 100%;
  padding: 12px;
  border: 1px solid #403b5d;
  border-radius: 11px;
  background: #171629;
  color: white;
  margin: 6px 0;
  font: inherit;
  outline: none;
}

.modal-box input:focus { border-color: #9878ff; }
.modal-actions { display: flex; gap: 8px; margin-top: 12px; }
.modal-actions button {
  flex: 1;
  padding: 11px;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  font: inherit;
  font-weight: 750;
}
.primary { color: white; background: linear-gradient(120deg, #7961ff, #e77dce); }
.secondary { color: #ded8fa; background: #393550; }
.error { color: #ff9999; font-size: 12px; margin-top: 9px; white-space: pre-wrap; }

#mention-list {
  position: absolute;
  display: none;
  left: 25px;
  bottom: 100%;
  width: min(300px, 80%);
  max-height: 190px;
  overflow: auto;
  background: #29263f;
  border: 1px solid #51476f;
  border-radius: 12px;
  padding: 5px;
  z-index: 10;
}
.mention-option { padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.mention-option:hover { background: #40365e; }

.mobile-back { display: none; }

@media(max-width:760px) {
  #app { padding: 0; gap: 0; }
  .sidebar { width: 78px; flex-basis: 78px; padding: 17px 9px; border-radius: 0; }
  .brand { justify-content: center; padding: 0; }
  .brand-logo { width: 47px; height: 47px; }
  .brand-copy, .side-label span:first-child, .channel-name, .channel-dot, .profile-info, .profile .icon-btn { display: none; }
  .side-label { justify-content: center; margin: 25px 0 12px; }
  .channel { justify-content: center; padding: 8px 0; }
  .channel-icon { flex-basis: 45px; height: 45px; }
  .profile { justify-content: center; padding: 13px 0 0; }
  .profile .avatar { width: 42px; }
  .chat { border-radius: 0; }
  .chat-head { padding: 15px; min-height: 76px; }
  .chat-title h2 { font-size: 17px; }
  .chat-title p { font-size: 11px; }
  .messages { padding: 17px 12px; }
  .composer-wrap { padding: 10px; }
  .composer { min-height: 60px; border-radius: 18px; }
  .send { width: 43px; height: 43px; flex-basis: 43px; }
  .footer-hint { font-size: 10px; }
  .live { padding: 8px 9px; font-size: 10px; }
  #theme-toggle { padding: 8px; }
  .head-actions { gap: 6px; }
}
</style>
</head>

<body class="dark">
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">A</div>
      <div class="brand-copy">
        <div class="brand-name">Axion</div>
        <div class="brand-sub">YOUR SPACE, YOUR PEOPLE</div>
      </div>
    </div>

    <div class="side-label">
      <span>CHANNELS</span>
      <button class="icon-btn" id="add-channel" title="채널 추가">+</button>
    </div>

    <div class="channels" id="channels">
      <button class="channel active" data-channel="general">
        <span class="channel-icon">✦</span>
        <span class="channel-name">잡담</span>
        <span class="channel-dot">●</span>
      </button>
    </div>

    <div class="profile">
      <div class="avatar" id="profile-avatar">A</div>
      <div class="profile-info">
        <div class="profile-name" id="profile-name">게스트</div>
        <div class="online">● 온라인</div>
      </div>
      <button class="icon-btn" id="edit-profile" title="닉네임 변경">✎</button>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-head">
      <div class="chat-title">
        <span class="channel-icon" id="current-icon">✦</span>
        <div>
          <h2 id="current-name">잡담</h2>
          <p id="current-description">편하게 이야기를 나눠 보세요.</p>
        </div>
      </div>
      <div class="head-actions">
        <button class="icon-btn" id="theme-toggle" title="테마 변경">☀️</button>
        <span class="live">● 실시간</span>
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="day-divider">대화 시작</div>
    </section>

    <div class="composer-wrap">
      <div class="replying" id="replying">
        <span id="replying-text">답장 작성 중</span>
        <button id="cancel-reply" title="답장 취소">✕</button>
      </div>

      <form class="composer" id="form" style="position:relative">
        <div id="mention-list"></div>
        <input id="message" maxlength="1000" placeholder="메시지를 입력하세요... (@로 멘션)" autocomplete="off">
        <button class="send" type="submit" title="보내기">➤</button>
      </form>

      <div class="footer-hint">
        <span>Enter 전송 · Shift + Enter 줄바꿈</span>
        <span>Axion Chat</span>
      </div>
    </div>
  </main>
</div>

<!-- 닉네임 입력 -->
<div class="modal" id="profile-modal">
  <div class="modal-box">
    <h3>Axion에 오신 것을 환영해요</h3>
    <p>채팅에서 사용할 닉네임을 입력하세요.</p>
    <input id="nickname-input" maxlength="20" placeholder="닉네임">
    <div class="modal-actions">
      <button class="primary" id="save-nickname">시작하기</button>
    </div>
    <div class="error" id="profile-error"></div>
  </div>
</div>

<!-- 채널 추가 -->
<div class="modal" id="channel-modal">
  <div class="modal-box">
    <h3>새 채널 만들기</h3>
    <p>친구들과 대화할 채널 이름을 정하세요.</p>
    <input id="channel-input" maxlength="30" placeholder="예: 게임 이야기">
    <div class="modal-actions">
      <button class="primary" id="create-channel">채널 만들기</button>
      <button class="secondary" data-close="channel-modal">취소</button>
    </div>
    <div class="error" id="channel-error"></div>
  </div>
</div>

<!-- 관리자 로그인 -->
<div class="modal" id="admin-modal">
  <div class="modal-box">
    <h3>관리자 로그인</h3>
    <p>관리자 Firebase 계정으로 로그인하세요.</p>
    <input id="admin-email" type="email" placeholder="이메일" autocomplete="username">
    <input id="admin-password" type="password" placeholder="비밀번호" autocomplete="current-password">
    <div class="modal-actions">
      <button class="primary" id="admin-login">로그인</button>
      <button class="secondary" data-close="admin-modal">취소</button>
    </div>
    <div class="error" id="admin-error"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getDatabase, ref, push, set, update, remove, onValue,
  onChildAdded, onChildRemoved, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAf-nM5PJRUo2q7TvX2LeZNKxh8A021bck",
  authDomain: "chat-27c50.firebaseapp.com",
  databaseURL: "https://chat-27c50-default-rtdb.firebaseio.com",
  projectId: "chat-27c50",
  storageBucket: "chat-27c50.firebasestorage.app",
  messagingSenderId: "811770063187",
  appId: "1:811770063187:web:ba17f4f49ebb682c9cd9a6"
};

// Firebase Authentication에서 관리자 계정을 만든 뒤,
// 그 계정의 UID를 아래 따옴표 안에 입력하세요.
const ADMIN_UID = "여기에_관리자_UID_입력";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
const icons = ["✦", "◈", "☾", "✧", "♧", "◇"];
let nickname = localStorage.getItem("axionNickname") || "";
let currentChannel = "general";
let isAdmin = false;
let replyTo = null;
let messagesUnsubscribe = [];
let channelsData = { general: { name: "잡담", description: "편하게 이야기를 나눠 보세요.", icon: "✦" } };
let rendered = new Map();

function openModal(id) { $(id).style.display = "grid"; }
function closeModal(id) { $(id).style.display = "none"; }

document.querySelectorAll("[data-close]").forEach(btn => {
  btn.addEventListener("click", () => closeModal(btn.dataset.close));
});

function showProfile() {
  $("profile-name").textContent = nickname || "게스트";
  $("profile-avatar").textContent = (nickname || "A").slice(0, 1);
}

function escapeMentionText(element, text) {
  const parts = text.split(/(@[^\s@]+)/g);
  for (const part of parts) {
    if (/^@.{1,}$/.test(part)) {
      const span = document.createElement("span");
      span.className = "mention";
      span.textContent = part;
      element.appendChild(span);
    } else {
      element.appendChild(document.createTextNode(part));
    }
  }
}

function clearMessageListeners() {
  messagesUnsubscribe.forEach(unsub => unsub());
  messagesUnsubscribe = [];
  rendered.clear();
}

function renderMessage(id, data) {
  if (rendered.has(id)) return;

  const row = document.createElement("article");
  row.className = "msg";
  row.dataset.id = id;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = (data.name || "?").slice(0, 1);

  const main = document.createElement("div");
  main.className = "msg-main";

  const meta = document.createElement("div");
  meta.className = "meta";

  const name = document.createElement("span");
  name.className = "name";
  name.textContent = data.name || "익명";

  const time = document.createElement("span");
  time.className = "time";
  time.textContent = data.createdAt
    ? new Date(data.createdAt).toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit"})
    : "방금";

  meta.append(name, time);
  main.append(meta);

  if (data.replyTo && data.replyText) {
    const preview = document.createElement("div");
    preview.className = "reply-preview";
    preview.textContent = "↩ " + data.replyName + ": " + data.replyText;
    main.append(preview);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  escapeMentionText(bubble, data.text || "");
  main.append(bubble);

  const tools = document.createElement("div");
  tools.className = "msg-tools";

  const replyBtn = document.createElement("button");
  replyBtn.className = "tool-btn";
  replyBtn.textContent = "↩ 답장";
  replyBtn.addEventListener("click", () => startReply(id, data));
  tools.append(replyBtn);

  if (isAdmin) {
    const deleteBtn = document.createElement("button");
    deleteBtn.className = "tool-btn danger";
    deleteBtn.textContent = "삭제";
    deleteBtn.addEventListener("click", async () => {
      if (!isAdmin) return alert("관리자 권한이 필요합니다.");
      if (!confirm("이 메시지를 삭제할까요?")) return;
      try {
        await remove(ref(db, `channelMessages/${currentChannel}/${id}`));
      } catch (e) {
        alert("삭제에 실패했습니다. Firebase 보안 규칙을 확인하세요.");
      }
    });
    tools.append(deleteBtn);
  }

  main.append(tools);
  row.append(avatar, main);

  // 메시지를 옆으로 밀어 답장
  let startX = 0, startY = 0;
  row.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  row.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy)) {
      startReply(id, data);
    }
  }, { passive: true });

  rendered.set(id, row);
  $("messages").append(row);
  $("messages").scrollTop = $("messages").scrollHeight;
}

function startReply(id, data) {
  replyTo = { id, name: data.name || "익명", text: data.text || "" };
  $("replying-text").textContent = `↩ ${replyTo.name}: ${replyTo.text.slice(0, 100)}`;
  $("replying").style.display = "flex";
  $("message").focus();
}

function cancelReply() {
  replyTo = null;
  $("replying").style.display = "none";
}

$("cancel-reply").addEventListener("click", cancelReply);

function loadMessages() {
  clearMessageListeners();
  $("messages").replaceChildren();

  const divider = document.createElement("div");
  divider.className = "day-divider";
  divider.textContent = "대화 시작";
  $("messages").append(divider);

  const path = ref(db, `channelMessages/${currentChannel}`);
  const unsub = onValue(path, snapshot => {
    $("messages").replaceChildren();
    rendered.clear();

    const dividerAgain = document.createElement("div");
    dividerAgain.className = "day-divider";
    dividerAgain.textContent = "대화 시작";
    $("messages").append(dividerAgain);

    const items = [];
    snapshot.forEach(child => items.push({ id: child.key, data: child.val() }));
    items.sort((a, b) => (a.data.createdAt || 0) - (b.data.createdAt || 0));
    items.slice(-200).forEach(item => renderMessage(item.id, item.data));
    $("messages").scrollTop = $("messages").scrollHeight;
  }, error => {
    console.error(error);
    showSystemMessage("메시지를 불러오지 못했습니다. Firebase 규칙을 확인하세요.");
  });

  messagesUnsubscribe.push(unsub);
}

function showSystemMessage(text) {
  const div = document.createElement("div");
  div.className = "day-divider";
  div.textContent = text;
  $("messages").append(div);
}

function setCurrentChannel(id) {
  currentChannel = id;
  const channel = channelsData[id];
  if (!channel) return;

  $("current-name").textContent = channel.name;
  $("current-description").textContent = channel.description || "편하게 이야기를 나눠 보세요.";
  $("current-icon").textContent = channel.icon || "✦";

  document.querySelectorAll(".channel").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.channel === id);
  });

  cancelReply();
  loadMessages();
}

function renderChannels() {
  const list = $("channels");
  list.replaceChildren();

  Object.entries(channelsData).forEach(([id, channel]) => {
    const btn = document.createElement("button");
    btn.className = "channel" + (id === currentChannel ? " active" : "");
    btn.dataset.channel = id;

    const icon = document.createElement("span");
    icon.className = "channel-icon";
    icon.textContent = channel.icon || "✦";

    const name = document.createElement("span");
    name.className = "channel-name";
    name.textContent = channel.name;

    const dot = document.createElement("span");
    dot.className = "channel-dot";
    dot.textContent = "●";

    btn.append(icon, name, dot);
    btn.addEventListener("click", () => setCurrentChannel(id));
    list.append(btn);
  });
}

onValue(ref(db, "channels"), snapshot => {
  const data = snapshot.val() || {};
  channelsData = {
    general: { name: "잡담", description: "편하게 이야기를 나눠 보세요.", icon: "✦" },
    ...data
  };
  renderChannels();

  if (!channelsData[currentChannel]) currentChannel = "general";
  setCurrentChannel(currentChannel);
}, error => {
  console.error(error);
});

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const input = $("message");
  const text = input.value.trim();
  if (!text || !nickname) return;

  try {
    const messageData = {
      name: nickname,
      text,
      createdAt: Date.now()
    };

    if (replyTo) {
      messageData.replyTo = replyTo.id;
      messageData.replyName = replyTo.name;
      messageData.replyText = replyTo.text;
    }

    await push(ref(db, `channelMessages/${currentChannel}`), messageData);
    input.value = "";
    cancelReply();
    $("mention-list").style.display = "none";
    input.focus();
  } catch (error) {
    alert("메시지를 보내지 못했습니다. Firebase Realtime Database 규칙을 확인하세요.");
    console.error(error);
  }
});

$("add-channel").addEventListener("click", () => {
  $("channel-error").textContent = "";
  $("channel-input").value = "";
  openModal("channel-modal");
});

$("create-channel").addEventListener("click", async () => {
  const name = $("channel-input").value.trim();
  if (!name) {
    $("channel-error").textContent = "채널 이름을 입력하세요.";
    return;
  }

  const id = "channel_" + Date.now().toString(36);
  try {
    await set(ref(db, "channels/" + id), {
      name,
      description: "편하게 이야기를 나눠 보세요.",
      icon: icons[Object.keys(channelsData).length % icons.length]
    });
    closeModal("channel-modal");
    setCurrentChannel(id);
  } catch (error) {
    $("channel-error").textContent = "채널을 만들 수 없습니다. Firebase 규칙을 확인하세요.";
  }
});

$("edit-profile").addEventListener("click", () => {
  $("nickname-input").value = nickname;
  $("profile-error").textContent = "";
  openModal("profile-modal");
});

$("save-nickname").addEventListener("click", () => {
  const name = $("nickname-input").value.trim();
  if (!name) {
    $("profile-error").textContent = "닉네임을 입력하세요.";
    return;
  }
  nickname = name.slice(0, 20);
  localStorage.setItem("axionNickname", nickname);
  showProfile();
  closeModal("profile-modal");
});

$("theme-toggle").addEventListener("click", () => {
  const light = document.body.classList.toggle("light");
  document.body.classList.toggle("dark", !light);
  $("theme-toggle").textContent = light ? "🌙" : "☀️";
  localStorage.setItem("axionTheme", light ? "light" : "dark");
});

const savedTheme = localStorage.getItem("axionTheme");
if (savedTheme === "light") {
  document.body.classList.remove("dark");
  document.body.classList.add("light");
  $("theme-toggle").textContent = "🌙";
}

$("admin-open")?.addEventListener("click", () => openModal("admin-modal"));

// 관리자 버튼은 프로필 편집 버튼을 길게 누르면 열립니다.
let holdTimer;
$("edit-profile").addEventListener("contextmenu", e => {
  e.preventDefault();
  openModal("admin-modal");
});

$("admin-login").addEventListener("click", async () => {
  $("admin-error").textContent = "";
  try {
    const credential = await signInWithEmailAndPassword(
      auth,
      $("admin-email").value.trim(),
      $("admin-password").value
    );

    if (credential.user.uid !== ADMIN_UID) {
      await signOut(auth);
      $("admin-error").textContent = "관리자 권한이 없는 계정입니다.";
      return;
    }

    isAdmin = true;
    closeModal("admin-modal");
    loadMessages();
  } catch (error) {
    $("admin-error").textContent = "로그인 실패: 이메일과 비밀번호를 확인하세요.";
  }
});

onAuthStateChanged(auth, user => {
  isAdmin = !!user && user.uid === ADMIN_UID;
  if (user && !isAdmin) signOut(auth);
  if (isAdmin) loadMessages();
});

$("messages").addEventListener("dblclick", async e => {
  if (!isAdmin) return;
  const row = e.target.closest(".msg");
  if (!row) return;
  if (!confirm("선택한 메시지를 삭제할까요?")) return;
  try {
    await remove(ref(db, `channelMessages/${currentChannel}/${row.dataset.id}`));
  } catch (error) {
    alert("메시지를 삭제하지 못했습니다.");
  }
});

$("message").addEventListener("input", () => {
  const match = $("message").value.match(/@([^\s@]*)$/);
  const list = $("mention-list");
  list.replaceChildren();

  if (!match) {
    list.style.display = "none";
    return;
  }

  const keyword = match[1].toLowerCase();
  const names = [...new Set(
    [...document.querySelectorAll(".msg .meta .name")]
      .map(el => el.textContent)
  )].filter(name => name.toLowerCase().includes(keyword));

  if (!names.length) {
    list.style.display = "none";
    return;
  }

  names.forEach(name => {
    const option = document.createElement("div");
    option.className = "mention-option";
    option.textContent = "@" + name;
    option.addEventListener("mousedown", e => e.preventDefault());
    option.addEventListener("click", () => {
      $("message").value = $("message").value.replace(/@([^\s@]*)$/, "@" + name + " ");
      list.style.display = "none";
      $("message").focus();
    });
    list.append(option);
  });

  list.style.display = "block";
});

$("message").addEventListener("keydown", e => {
  if (e.key === "Escape") $("mention-list").style.display = "none";
});

document.addEventListener("click", e => {
  if (e.target !== $("message") && !$("mention-list").contains(e.target)) {
    $("mention-list").style.display = "none";
  }
});

showProfile();
if (!nickname) openModal("profile-modal");
</script>
</body>
</html>
