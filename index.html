
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axion</title>
<style>
:root{color-scheme:dark;--bg:#0d1320;--panel:#141e2d;--line:#2a3950;--muted:#9aabc3;--blue:#3978f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#eef4ff;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;height:100dvh;display:grid;place-items:center}
.app{width:min(1000px,100%);height:min(780px,100dvh);background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.head h1{font-size:19px;margin:0}.head p{font-size:13px;color:var(--muted);margin:5px 0 0}.status{font-size:12px;color:#70e1b4}
.messages{padding:22px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px;align-items:flex-start}.avatar{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:#3479f6;font-weight:800;flex:none}
.meta{display:flex;gap:10px;align-items:center;font-size:12px;margin:0 0 5px}.name{font-weight:750}.time{color:var(--muted)}
.bubble{background:#202d40;padding:10px 13px;border-radius:4px 14px 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.mention-highlight{color:#9ec5ff;background:#244d86;border:1px solid #3978f6;border-radius:5px;padding:1px 4px;font-weight:800}
.system{align-self:center;color:var(--muted);font-size:12px;text-align:center}
.composer{position:relative;border-top:1px solid var(--line);padding:15px;display:flex;gap:10px}
.composer input{min-width:0;flex:1;background:#1b2739;border:1px solid #35445c;border-radius:11px;padding:13px;color:white;font:inherit;outline:none}
.composer input:focus{border-color:#5689ff}
.composer button,.join button{border:0;background:var(--blue);color:white;font:inherit;font-weight:700;border-radius:10px;padding:0 18px;cursor:pointer}
.composer button:disabled{opacity:.5;cursor:wait}
#mention-list{display:none;position:absolute;bottom:calc(100% - 5px);left:15px;right:100px;background:#202d40;border:1px solid #35445c;border-radius:10px;max-height:190px;overflow-y:auto;z-index:20;box-shadow:0 8px 24px #0008;padding:4px}
.mention-option{padding:9px 10px;border-radius:7px;cursor:pointer;color:#eef4ff;font-size:14px}
.mention-option:hover,.mention-option:focus{background:#294b7d;outline:none}
.mention-empty{padding:10px;color:var(--muted);font-size:12px}
.join{position:fixed;inset:0;background:#070b13ef;display:grid;place-items:center;padding:20px;z-index:30}
.joinbox{width:min(390px,100%);padding:25px;background:var(--panel);border:1px solid var(--line);border-radius:17px}
.joinbox h2{margin:0 0 8px}.joinbox p{color:var(--muted);font-size:13px;line-height:1.5}
.joinbox input{width:100%;padding:13px;margin:8px 0 12px;border:1px solid var(--line);border-radius:10px;background:#1b2739;color:white;font:inherit}
.join button{width:100%;padding:12px}.small{font-size:11px;color:var(--muted);margin-top:12px}.err{color:#ff9292;font-size:13px;line-height:1.5}
.admin-btn{border:1px solid var(--line);background:#1b2739;color:white;border-radius:9px;padding:8px 10px;cursor:pointer}
.delete-message{margin-left:8px;border:1px solid #744;background:transparent;color:#ff9b9b;border-radius:7px;padding:5px 8px;cursor:pointer;flex:none}
@media(max-width:560px){.app{border:0}.head{padding:16px}.messages{padding:15px}.composer{padding:10px}.composer button{padding:0 13px}#mention-list{left:10px;right:85px}}
</style>
</head>
<body>
<div class="app">
<header class="head">
  <div><h1>Axion</h1><p>같은 채팅방에 접속한 친구들과 실시간으로 대화해요.</p></div>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
    <span class="status" id="status">연결 준비 중</span>
    <button type="button" class="admin-btn" id="admin-open">관리자</button>
    <button type="button" class="admin-btn" id="admin-logout" style="display:none">로그아웃</button>
    <button type="button" id="clear-all" style="display:none;border:0;background:#c33;color:white;border-radius:9px;padding:8px 10px;cursor:pointer">전체 삭제</button>
  </div>
</header>

<section class="messages" id="messages" aria-live="polite">
  <div class="system">Firebase 연결 후 실시간 채팅을 사용할 수 있어요.</div>
</section>

<form class="composer" id="form">
  <input id="message" maxlength="1000" placeholder="메시지를 입력하세요... (@를 입력해 친구를 멘션)" autocomplete="off" disabled>
  <div id="mention-list" role="listbox" aria-label="멘션할 친구"></div>
  <button id="send" disabled>보내기</button>
</form>
</div>

<div class="join" id="join">
  <div class="joinbox">
    <h2>채팅방 입장</h2>
    <p>친구들과 같은 사이트 주소를 열고, 각자 사용할 닉네임을 입력하세요.</p>
    <input id="nickname" maxlength="20" placeholder="닉네임 (최대 20자)" autocomplete="nickname">
    <button id="enter" type="button">채팅 시작하기</button>
    <div class="small">메시지는 Firebase 실시간 데이터베이스를 통해 다른 접속자에게 전달됩니다.</div>
    <div class="err" id="error"></div>
  </div>
</div>

<div class="join" id="admin-modal" style="display:none">
  <div class="joinbox">
    <h2>Axion 관리자 로그인</h2>
    <p>관리자 계정으로 로그인하세요.</p>
    <form id="admin-form">
      <input id="admin-email" type="email" placeholder="관리자 이메일" autocomplete="username" required>
      <input id="admin-password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
      <button type="submit" id="admin-submit">로그인</button>
    </form>
    <button type="button" id="admin-cancel" style="margin-top:8px;background:#35445c">취소</button>
    <div class="err" id="admin-error"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getDatabase, ref, push, query, limitToLast,
  onChildAdded, onChildRemoved, serverTimestamp, remove
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import {
  getAuth, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAf-nM5PJRUo2q7TvX2LeZNKxh8A021bck",
  authDomain: "chat-27c50.firebaseapp.com",
  databaseURL: "https://chat-27c50-default-rtdb.firebaseio.com",
  projectId: "chat-27c50",
  storageBucket: "chat-27c50.firebasestorage.app",
  messagingSenderId: "811770063187",
  appId: "1:811770063187:web:ba17f4f49ebb682c9cd9a6"
};

const $ = id => document.getElementById(id);
let nickname = "";
let db, auth;
let isAdmin = false;
const rendered = new Map();
const colors = ["#3479f6","#8a5cf6","#ed5c9b","#18ad8c","#e99a21","#e0644c"];

function hash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return h;
}

function appendHighlightedText(container, text) {
  const parts = text.split(/(@[^\s@]+)/g);
  for (const part of parts) {
    if (part.startsWith("@") && part.length > 1) {
      const tag = document.createElement("span");
      tag.className = "mention-highlight";
      tag.textContent = part;
      container.appendChild(tag);
    } else {
      container.appendChild(document.createTextNode(part));
    }
  }
}

function addDeleteButton(row, id) {
  if (!isAdmin || row.querySelector(".delete-message")) return;

  const del = document.createElement("button");
  del.type = "button";
  del.className = "delete-message";
  del.textContent = "삭제";
  del.addEventListener("click", async () => {
    if (!isAdmin) return;
    if (!confirm("이 메시지를 삭제할까요?")) return;
    try {
      await remove(ref(db, "messages/" + id));
    } catch (e) {
      alert("삭제 실패: " + e.message);
    }
  });
  row.appendChild(del);
}

function showMessage(data, id) {
  if (rendered.has(id)) return;

  const empty = $("messages").querySelector(".system");
  if (empty) empty.remove();

  const row = document.createElement("div");
  row.className = "msg";
  row.dataset.messageId = id;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.style.background = colors[Math.abs(hash(data.name || "?")) % colors.length];
  avatar.textContent = (data.name || "?").slice(0, 1);

  const body = document.createElement("div");
  const meta = document.createElement("div");
  meta.className = "meta";

  const name = document.createElement("span");
  name.className = "name";
  name.textContent = data.name || "익명";

  const time = document.createElement("span");
  time.className = "time";
  time.textContent = data.createdAt
    ? new Date(data.createdAt).toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit"})
    : "방금";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  appendHighlightedText(bubble, data.text || "");

  meta.append(name, time);
  body.append(meta, bubble);
  row.append(avatar, body);

  if (isAdmin) addDeleteButton(row, id);
  rendered.set(id, row);
  $("messages").append(row);
  $("messages").scrollTop = $("messages").scrollHeight;
}

function showEmptyIfNeeded() {
  if (!$("messages").querySelector(".msg")) {
    const empty = document.createElement("div");
    empty.className = "system";
    empty.textContent = "아직 메시지가 없습니다.";
    $("messages").replaceChildren(empty);
  }
}

$("enter").addEventListener("click", async () => {
  const name = $("nickname").value.trim();
  if (!name) {
    $("error").textContent = "닉네임을 입력해 주세요.";
    return;
  }

  nickname = name;
  $("enter").disabled = true;
  $("error").textContent = "";

  try {
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    auth = getAuth(app);

    onAuthStateChanged(auth, user => {
      isAdmin = !!user;
      $("admin-logout").style.display = isAdmin ? "inline-block" : "none";
      $("clear-all").style.display = isAdmin ? "inline-block" : "none";

      document.querySelectorAll("#messages .msg").forEach(row => {
        const old = row.querySelector(".delete-message");
        if (isAdmin) addDeleteButton(row, row.dataset.messageId);
        else if (old) old.remove();
      });
    });

    $("status").textContent = "연결 중...";
    const list = query(ref(db, "messages"), limitToLast(100));

    onChildAdded(list, snap => {
      const d = snap.val();
      if (d) showMessage(d, snap.key);
    }, err => {
      $("error").textContent = "메시지를 불러오지 못했어요: " + err.message;
      $("enter").disabled = false;
    });

    onChildRemoved(list, snap => {
      const row = rendered.get(snap.key);
      if (row) row.remove();
      rendered.delete(snap.key);
      showEmptyIfNeeded();
    });

    $("join").style.display = "none";
    $("message").disabled = false;
    $("send").disabled = false;
    $("message").focus();
    $("status").textContent = "● 실시간 연결";
  } catch (e) {
    $("error").textContent = "연결 실패: " + e.message;
    $("enter").disabled = false;
  }
});

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const input = $("message");
  const text = input.value.trim();
  if (!text || !db || !nickname) return;

  $("send").disabled = true;
  try {
    await push(ref(db, "messages"), {
      name: nickname,
      text,
      createdAt: serverTimestamp()
    });
    input.value = "";
    $("mention-list").style.display = "none";
    input.focus();
  } catch (err) {
    alert("메시지를 보내지 못했어요. Firebase 설정과 데이터베이스 규칙을 확인해 주세요.");
  } finally {
    $("send").disabled = false;
  }
});

$("nickname").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    $("enter").click();
  }
});

$("admin-open").addEventListener("click", () => {
  $("admin-modal").style.display = "grid";
  $("admin-error").textContent = "";
});

$("admin-cancel").addEventListener("click", () => {
  $("admin-modal").style.display = "none";
});

$("admin-form").addEventListener("submit", async e => {
  e.preventDefault();

  if (!auth) {
    $("admin-error").textContent = "먼저 채팅방에 입장해 주세요.";
    return;
  }

  $("admin-submit").disabled = true;
  try {
    await signInWithEmailAndPassword(
      auth,
      $("admin-email").value.trim(),
      $("admin-password").value
    );
    $("admin-modal").style.display = "none";
    $("admin-password").value = "";
  } catch (err) {
    $("admin-error").textContent = "로그인 실패: 이메일과 비밀번호를 확인하세요.";
  } finally {
    $("admin-submit").disabled = false;
  }
});

$("admin-logout").addEventListener("click", async () => {
  if (auth) await signOut(auth);
});

$("clear-all").addEventListener("click", async () => {
  if (!isAdmin || !db) return;
  if (!confirm("정말로 모든 채팅 메시지를 삭제할까요? 이 작업은 되돌릴 수 없습니다.")) return;

  try {
    await remove(ref(db, "messages"));
    rendered.clear();
    showEmptyIfNeeded();
  } catch (e) {
    alert("전체 삭제 실패: " + e.message);
  }
});

const mentionBox = $("mention-list");
const messageBox = $("message");

function getChatNames() {
  return [...new Set(
    [...document.querySelectorAll("#messages .meta .name")]
      .map(el => el.textContent.trim())
      .filter(Boolean)
  )].sort((a, b) => a.localeCompare(b, "ko"));
}

messageBox.addEventListener("input", () => {
  const match = messageBox.value.match(/@([^\s@]*)$/);
  mentionBox.replaceChildren();

  if (!match) {
    mentionBox.style.display = "none";
    return;
  }

  const keyword = match[1].toLocaleLowerCase();
  const names = getChatNames();
  const matches = names.filter(name => name.toLocaleLowerCase().includes(keyword));

  if (!matches.length) {
    const empty = document.createElement("div");
    empty.className = "mention-empty";
    empty.textContent = names.length
      ? "일치하는 친구가 없어요."
      : "친구가 채팅에 메시지를 보내면 여기에 표시돼요.";
    mentionBox.appendChild(empty);
    mentionBox.style.display = "block";
    return;
  }

  for (const name of matches) {
    const item = document.createElement("div");
    item.className = "mention-option";
    item.setAttribute("role", "option");
    item.textContent = "@" + name;
    item.addEventListener("mousedown", e => e.preventDefault());
    item.addEventListener("click", () => {
      messageBox.value = messageBox.value.replace(/@([^\s@]*)$/, "@" + name + " ");
      mentionBox.style.display = "none";
      messageBox.focus();
    });
    mentionBox.appendChild(item);
  }

  mentionBox.style.display = "block";
});

messageBox.addEventListener("keydown", e => {
  if (e.key === "Escape") mentionBox.style.display = "none";
});

document.addEventListener("click", e => {
  if (e.target !== messageBox && !mentionBox.contains(e.target)) {
    mentionBox.style.display = "none";
  }
});
</script>
</body>
</html>
