<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axion

<style>
:root {
  --bg: #f4f3fb;
  --panel: #ffffff;
  --text: #25243a;
  --muted: #85849b;
  --line: #e9e7f3;
  --accent: #7657ed;
  --accent2: #e66cb8;
  --bubble: #f0edff;
}

[data-theme="dark"] {
  --bg: #141326;
  --panel: #201e38;
  --text: #f3f1ff;
  --muted: #aaa6c5;
  --line: #37334f;
  --accent: #a28bff;
  --accent2: #ed8bc9;
  --bubble: #302b50;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, "Malgun Gothic", sans-serif;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  border: none;
}

.app {
  max-width: 1300px;
  min-height: 100vh;
  margin: auto;
  padding: 22px;
  display: grid;
  grid-template-columns: 270px 1fr;
  gap: 18px;
}

.sidebar, .chat {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 24px;
  min-height: calc(100vh - 44px);
}

.sidebar {
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 5px 7px 25px;
}

.logo {
  width: 43px;
  height: 43px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  font-weight: bold;
  font-size: 22px;
}

.brand h1 {
  margin: 0;
  font-size: 23px;
}

.sub {
  font-size: 12px;
  color: var(--muted);
}

.section-label {
  padding: 10px;
  color: var(--muted);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1.3px;
}

.channel-list {
  display: grid;
  gap: 6px;
}

.channel {
  padding: 11px 12px;
  border-radius: 12px;
  text-align: left;
  background: transparent;
  color: var(--muted);
}

.channel:hover,
.channel.active {
  background: var(--bubble);
  color: var(--accent);
}

.side-bottom {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding-top: 16px;
}

.profile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
}

.avatar {
  width: 37px;
  height: 37px;
  flex-shrink: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: white;
  font-weight: bold;
  background: linear-gradient(135deg, #b9a7ff, #f1a4d4);
}

.profile-actions {
  display: flex;
  gap: 5px;
  margin-left: auto;
}

.icon-btn {
  width: 35px;
  height: 35px;
  border-radius: 11px;
  background: var(--bg);
  color: var(--muted);
}

.icon-btn:hover {
  color: var(--accent);
}

.small-btn {
  background: var(--bubble);
  color: var(--accent);
  border-radius: 10px;
  padding: 9px 11px;
  font-size: 12px;
  font-weight: bold;
}

.chat {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  padding: 20px 25px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
}

.topbar h2 {
  margin: 0;
  font-size: 19px;
}

.live {
  margin-left: auto;
  padding: 6px 10px;
  border-radius: 20px;
  background: #22c55e18;
  color: #16a34a;
  font-size: 12px;
  font-weight: bold;
}

.messages {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 17px;
  flex: 1;
  overflow-y: auto;
  min-height: 250px;
}

.empty {
  margin: auto;
  text-align: center;
  color: var(--muted);
  padding: 40px 10px;
}

.message {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  max-width: 90%;
}

.message.mine {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.message .avatar {
  width: 34px;
  height: 34px;
  font-size: 12px;
}

.msgbody {
  min-width: 0;
}

.msgmeta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
  font-size: 12px;
  color: var(--muted);
}

.message.mine .msgmeta {
  justify-content: flex-end;
}

.msgname {
  font-weight: bold;
  color: var(--text);
}

.bubble {
  padding: 11px 14px;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 5px 17px 17px 17px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.message.mine .bubble {
  background: linear-gradient(135deg, var(--accent), #9278f3);
  color: white;
  border: none;
  border-radius: 17px 5px 17px 17px;
}

.replyquote {
  border-left: 3px solid var(--accent2);
  background: #8c73ed12;
  border-radius: 7px;
  padding: 7px 10px;
  margin-bottom: 7px;
  font-size: 12px;
  color: var(--muted);
}

.tools {
  display: flex;
  gap: 5px;
  margin-top: 5px;
}

.tools button {
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  padding: 3px 6px;
}

.tools button:hover {
  color: var(--accent);
}

.composer-wrap {
  border-top: 1px solid var(--line);
  padding: 18px 22px 22px;
}

.reply-preview {
  display: none;
  background: var(--bubble);
  border-radius: 10px;
  padding: 8px 12px;
  margin-bottom: 9px;
  font-size: 12px;
}

.reply-preview.show {
  display: flex;
  align-items: center;
  gap: 10px;
}

.reply-preview span {
  flex: 1;
}

.compose {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 9px;
}

.compose input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text);
  padding: 10px 4px;
}

.send, .primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  border-radius: 12px;
  padding: 11px 17px;
  font-weight: bold;
}

.hint {
  font-size: 11px;
  color: var(--muted);
  margin: 9px 5px 0;
}

.modal-back {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #100d26a8;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal-back.open {
  display: flex;
}

.modal {
  background: var(--panel);
  color: var(--text);
  width: min(420px, 100%);
  border-radius: 22px;
  padding: 25px;
  box-shadow: 0 25px 90px #0004;
}

.modal h3 {
  margin: 0 0 7px;
  font-size: 21px;
}

.modal p {
  color: var(--muted);
  font-size: 13px;
}

.field {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg);
  color: var(--text);
  padding: 12px;
  margin: 6px 0 12px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 10px;
}

.secondary {
  background: var(--bg);
  color: var(--text);
  border-radius: 11px;
  padding: 11px 15px;
}

.error {
  color: #ef4444;
  font-size: 12px;
  min-height: 17px;
}

.admin-badge {
  display: none;
  font-size: 10px;
  background: #f59e0b20;
  color: #d97706;
  border-radius: 8px;
  padding: 3px 6px;
  font-weight: bold;
}

body.admin .admin-badge {
  display: inline-block;
}

.admin-status {
  display: none;
  color: #16a34a;
  font-size: 11px;
  padding: 0 8px 8px;
}

body.admin .admin-status {
  display: block;
}

@media (max-width: 760px) {
  .app {
    display: flex;
    flex-direction: column;
    padding: 10px;
  }

  .sidebar {
    min-height: auto;
  }

  .chat {
    min-height: calc(100vh - 145px);
  }

  .topbar {
    padding: 15px;
  }

  .messages {
    padding: 16px;
  }

  .composer-wrap {
    padding: 12px;
  }

  .message {
    max-width: 98%;
  }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">A</div>
      <div>
        <h1>Axion</h1>
        <div class="sub">Your space to connect</div>
      </div>
    </div>

    <div class="section-label">CHANNELS</div>
    <div class="channel-list" id="channels"></div>

    <button class="small-btn" id="addChannel" style="margin-top:12px">
      ＋ 채널 추가
    </button>

    <div class="side-bottom">
      <div class="profile">
        <div class="avatar" id="profileAvatar">G</div>

        <div>
          <div id="profileName">Guest</div>
          <div class="sub" id="profileRole">온라인</div>
        </div>

        <div class="profile-actions">
          <button class="icon-btn" id="themeBtn" title="테마 변경">☾</button>
          <button class="icon-btn" id="adminBtn" title="관리자 로그인">⚙</button>
        </div>
      </div>

      <div class="admin-status">관리자 모드 활성화됨</div>

      <button class="small-btn" id="nameBtn" style="width:100%">
        이름 변경
      </button>

      <button class="small-btn" id="deleteAllBtn"
        style="width:100%;margin-top:8px;display:none">
        전체 메시지 삭제
      </button>
    </div>
  </aside>

  <main class="chat">
    <header class="topbar">
      <div class="logo" style="width:38px;height:38px;border-radius:12px">#</div>

      <div>
        <h2 id="channelTitle">일반</h2>
        <div class="sub" id="channelDesc">Axion 커뮤니티에 오신 것을 환영합니다.</div>
      </div>

      <span class="admin-badge">ADMIN</span>
      <span class="live">실시간 채팅</span>
    </header>

    <section class="messages" id="messages">
      <div class="empty">
        <div style="font-size:40px">✦</div>
        <b>Axion에 오신 것을 환영합니다</b>
        <div>첫 메시지를 보내 대화를 시작하세요.</div>
      </div>
    </section>

    <div class="composer-wrap">
      <div class="reply-preview" id="replyPreview">
        <span id="replyText"></span>
        <button class="icon-btn" id="cancelReply">×</button>
      </div>

      <form class="compose" id="sendForm">
        <input id="messageInput" autocomplete="off" maxlength="2000"
          placeholder="메시지를 입력하세요... (@멘션 가능)">
        <button class="send" type="submit">보내기 ↗</button>
      </form>

      <div class="hint">Enter로 전송 · 메시지의 답장 버튼으로 답장할 수 있어요</div>
    </div>
  </main>
</div>

<!-- 관리자 비밀번호 모달 -->
<div class="modal-back" id="adminModal">
  <form class="modal" id="adminForm">
    <h3>관리자 로그인</h3>
    <p>관리자 비밀번호를 입력하세요.</p>

    <input class="field" id="adminPassword" type="password"
      placeholder="관리자 비밀번호" required>

    <div class="error" id="adminError"></div>

    <div class="modal-actions">
      <button type="button" class="secondary" data-close="adminModal">취소</button>
      <button class="primary" type="submit">로그인</button>
    </div>
  </form>
</div>

<!-- 입력 모달 -->
<div class="modal-back" id="simpleModal">
  <form class="modal" id="simpleForm">
    <h3 id="simpleTitle">입력</h3>
    <p id="simpleDesc"></p>

    <input class="field" id="simpleInput" required>

    <div class="error" id="simpleError"></div>

    <div class="modal-actions">
      <button type="button" class="secondary" data-close="simpleModal">취소</button>
      <button class="primary" type="submit">확인</button>
    </div>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  remove
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

/* Firebase 설정 */
const firebaseConfig = {
  apiKey: "AIzaSyAf-nM5PJRUo2q7TvX2LeZNKxh8A021bck",
  authDomain: "chat-27c50.firebaseapp.com",
  databaseURL: "https://chat-27c50-default-rtdb.firebaseio.com",
  projectId: "chat-27c50",
  storageBucket: "chat-27c50.firebasestorage.app",
  messagingSenderId: "811770063187",
  appId: "1:811770063187:web:ba17f4f49ebb682c9cd9a6"
};

/*
  데모용 비밀번호.
  HTML에 들어 있는 비밀번호는 개발자 도구에서 확인할 수 있습니다.
  실제 서비스에서는 서버에서 비밀번호를 검증해야 합니다.
*/
const ADMIN_PASSWORD = "KB0328";

const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

const $ = id => document.getElementById(id);

const escapeHTML = value =>
  String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);

const initial = name =>
  (String(name || "?").trim()[0] || "?").toUpperCase();

let myName = localStorage.getItem("axion_name") || "Guest";
let currentChannel = "general";
let isAdmin = false;
let replyTo = null;
let messagesCache = {};
let channelMap = {
  general: {
    name: "일반",
    desc: "Axion 커뮤니티에 오신 것을 환영합니다."
  }
};

let unsubscribeMessages = null;

/* 모달 */
function openModal(id) {
  $(id).classList.add("open");
}

function closeModal(id) {
  $(id).classList.remove("open");
}

document.querySelectorAll("[data-close]").forEach(button => {
  button.addEventListener("click", () => {
    closeModal(button.dataset.close);
  });
});

/* 관리자 상태 */
function setAdmin(enabled) {
  isAdmin = enabled;
  document.body.classList.toggle("admin", enabled);

  $("profileRole").textContent = enabled ? "관리자" : "온라인";
  $("adminBtn").textContent = enabled ? "✓" : "⚙";
  $("deleteAllBtn").style.display = enabled ? "block" : "none";

  renderMessages();
}

/* 입력 모달 */
function showInputModal(title, description, placeholder, callback) {
  $("simpleTitle").textContent = title;
  $("simpleDesc").textContent = description;
  $("simpleInput").placeholder = placeholder;
  $("simpleInput").value = "";
  $("simpleError").textContent = "";

  openModal("simpleModal");

  $("simpleForm").onsubmit = event => {
    event.preventDefault();

    const value = $("simpleInput").value.trim();

    if (!value) return;

    const result = callback(value);

    if (result !== false) {
      closeModal("simpleModal");
    }
  };

  setTimeout(() => $("simpleInput").focus(), 50);
}

/* 채널 */
function renderChannels() {
  const container = $("channels");
  container.replaceChildren();

  Object.entries(channelMap).forEach(([id, channel]) => {
    const button = document.createElement("button");

    button.className =
      "channel" + (id === currentChannel ? " active" : "");

    button.textContent = "# " + channel.name;

    button.onclick = () => switchChannel(id);

    container.appendChild(button);
  });
}

function listenChannels() {
  onValue(ref(db, "channels"), snapshot => {
    const remoteChannels = snapshot.val() || {};

    channelMap = {
      general: {
        name: "일반",
        desc: "Axion 커뮤니티에 오신 것을 환영합니다."
      },
      ...remoteChannels
    };

    renderChannels();

    if (!channelMap[currentChannel]) {
      currentChannel = "general";
    }

    $("channelTitle").textContent =
      channelMap[currentChannel].name;

    $("channelDesc").textContent =
      channelMap[currentChannel].desc || "Axion 채널";
  }, error => {
    console.error("채널 불러오기 오류:", error);
  });
}

function switchChannel(id) {
  currentChannel = id;
  replyTo = null;

  updateReplyPreview();

  $("channelTitle").textContent =
    channelMap[id]?.name || id;

  $("channelDesc").textContent =
    channelMap[id]?.desc || "Axion 채널";

  renderChannels();
  listenMessages();
}

/* 메시지 */
function listenMessages() {
  if (unsubscribeMessages) {
    unsubscribeMessages();
  }

  unsubscribeMessages = onValue(
    ref(db, `channelMessages/${currentChannel}`),
    snapshot => {
      messagesCache = snapshot.val() || {};
      renderMessages();
    },
    error => {
      $("messages").textContent =
        "메시지를 불러오지 못했습니다: " + error.message;
    }
  );
}

function formatTime(timestamp) {
  if (!timestamp) return "방금";

  return new Date(timestamp).toLocaleTimeString("ko-KR", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function formatMessage(text) {
  return escapeHTML(text)
    .replace(
      /(^|\s)@([a-zA-Z0-9가-힣_]+)/g,
      '$1<span style="font-weight:bold;color:var(--accent)">@$2</span>'
    )
    .replace(/\n/g, "<br>");
}

function renderMessages() {
  const container = $("messages");
  container.replaceChildren();

  const entries = Object.entries(messagesCache)
    .sort((a, b) =>
      (a[1].timestamp || 0) - (b[1].timestamp || 0)
    );

  if (entries.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <div style="font-size:40px">✦</div>
        <b>아직 메시지가 없어요</b>
        <div>첫 메시지를 보내 대화를 시작하세요.</div>
      </div>
    `;
    return;
  }

  entries.forEach(([id, message]) => {
    const mine = message.name === myName;
    const article = document.createElement("article");

    article.className = "message" + (mine ? " mine" : "");

    const quote = message.replyText
      ? `<div class="replyquote">
          ↪ ${escapeHTML(message.replyName || "사용자")}:
          ${escapeHTML(message.replyText).slice(0, 180)}
        </div>`
      : "";

    const deleteButton = isAdmin
      ? `<button data-delete="${escapeHTML(id)}">삭제</button>`
      : "";

    article.innerHTML = `
      <div class="avatar">${escapeHTML(initial(message.name))}</div>

      <div class="msgbody">
        <div class="msgmeta">
          <span class="msgname">${escapeHTML(message.name || "Guest")}</span>
          <span>${formatTime(message.timestamp)}</span>
        </div>

        <div class="bubble">
          ${quote}
          ${formatMessage(message.text || "")}
        </div>

        <div class="tools">
          <button data-reply="${escapeHTML(id)}">답장</button>
          ${deleteButton}
        </div>
      </div>
    `;

    container.appendChild(article);
  });

  container.querySelectorAll("[data-reply]").forEach(button => {
    button.onclick = () => {
      const message = messagesCache[button.dataset.reply];

      if (!message) return;

      replyTo = {
        id: button.dataset.reply,
        name: message.name || "Guest",
        text: message.text || ""
      };

      updateReplyPreview();
      $("messageInput").focus();
    };
  });

  container.querySelectorAll("[data-delete]").forEach(button => {
    button.onclick = async () => {
      if (!isAdmin) return;

      if (!confirm("이 메시지를 삭제할까요?")) return;

      try {
        await remove(ref(
          db,
          `channelMessages/${currentChannel}/${button.dataset.delete}`
        ));
      } catch (error) {
        alert("메시지 삭제 실패: " + error.message);
      }
    };
  });

  container.scrollTop = container.scrollHeight;
}

/* 답장 */
function updateReplyPreview() {
  const preview = $("replyPreview");

  if (replyTo) {
    preview.classList.add("show");

    $("replyText").textContent =
      `${replyTo.name}에게 답장: ${replyTo.text.slice(0, 100)}`;
  } else {
    preview.classList.remove("show");
  }
}

$("cancelReply").onclick = () => {
  replyTo = null;
  updateReplyPreview();
};

/* 메시지 전송 */
$("sendForm").addEventListener("submit", async event => {
  event.preventDefault();

  const text = $("messageInput").value.trim();

  if (!text) return;

  const message = {
    name: myName,
    text,
    timestamp: Date.now()
  };

  if (replyTo) {
    message.replyId = replyTo.id;
    message.replyName = replyTo.name;
    message.replyText = replyTo.text;
  }

  try {
    await set(
      push(ref(db, `channelMessages/${currentChannel}`)),
      message
    );

    $("messageInput").value = "";
    replyTo = null;
    updateReplyPreview();
  } catch (error) {
    alert("메시지 전송 실패: " + error.message);
  }
});

/* 관리자 로그인 */
$("adminBtn").onclick = () => {
  if (isAdmin) {
    if (confirm("관리자 모드를 종료할까요?")) {
      setAdmin(false);
    }
    return;
  }

  $("adminPassword").value = "";
  $("adminError").textContent = "";

  openModal("adminModal");

  setTimeout(() => $("adminPassword").focus(), 50);
};

$("adminForm").addEventListener("submit", event => {
  event.preventDefault();

  const password = $("adminPassword").value;

  if (password === ADMIN_PASSWORD) {
    setAdmin(true);
    closeModal("adminModal");
    $("adminError").textContent = "";

    alert("관리자 모드가 활성화되었습니다.");
  } else {
    $("adminError").textContent =
      "비밀번호가 올바르지 않습니다.";

    $("adminPassword").select();
  }
});

/* 전체 메시지 삭제 */
$("deleteAllBtn").onclick = async () => {
  if (!isAdmin) return;

  const confirmed = confirm(
    `#${channelMap[currentChannel]?.name || currentChannel} 채널의 모든 메시지를 삭제할까요?`
  );

  if (!confirmed) return;

  try {
    await remove(
      ref(db, `channelMessages/${currentChannel}`)
    );

    alert("현재 채널의 메시지를 삭제했습니다.");
  } catch (error) {
    alert("전체 삭제 실패: " + error.message);
  }
};

/* 채널 추가 */
$("addChannel").onclick = () => {
  if (!isAdmin) {
    alert("채널 추가는 관리자 모드에서 사용할 수 있습니다.");
    return;
  }

  showInputModal(
    "채널 추가",
    "새 채널 이름을 입력하세요.",
    "예: 게임",
    name => {
      const id = name
        .toLowerCase()
        .replace(/\s+/g, "-")
        .replace(/[.#$\[\]/]/g, "")
        .slice(0, 35);

      if (!id) {
        $("simpleError").textContent =
          "올바른 이름을 입력하세요.";
        return false;
      }

      if (channelMap[id]) {
        $("simpleError").textContent =
          "이미 있는 채널입니다.";
        return false;
      }

      set(ref(db, `channels/${id}`), {
        name,
        desc: `${name} 채널`
      })
      .then(() => switchChannel(id))
      .catch(error => {
        alert("채널 추가 실패: " + error.message);
      });

      return true;
    }
  );
};

/* 닉네임 변경 */
$("nameBtn").onclick = () => {
  showInputModal(
    "이름 변경",
    "채팅에 표시할 이름을 입력하세요.",
    "닉네임",
    name => {
      if (name.length > 24) {
        $("simpleError").textContent =
          "24자 이하로 입력하세요.";
        return false;
      }

      myName = name;
      localStorage.setItem("axion_name", name);

      $("profileName").textContent = name;
      $("profileAvatar").textContent = initial(name);

      renderMessages();

      return true;
    }
  );
};

/* 테마 변경 */
$("themeBtn").onclick = () => {
  const dark =
    document.documentElement.dataset.theme !== "dark";

  document.documentElement.dataset.theme =
    dark ? "dark" : "light";

  localStorage.setItem(
    "axion_theme",
    dark ? "dark" : "light"
  );

  $("themeBtn").textContent = dark ? "☀" : "☾";
};

/* 초기 설정 */
if (localStorage.getItem("axion_theme") === "dark") {
  document.documentElement.dataset.theme = "dark";
  $("themeBtn").textContent = "☀";
}

$("profileName").textContent = myName;
$("profileAvatar").textContent = initial(myName);

listenChannels();
listenMessages();
</script>
</body>
</html>
