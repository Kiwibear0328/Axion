<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axion</title>

<style>
:root {
  --bg:#08090d;
  --panel:rgba(18,21,31,.90);
  --panel2:#111522;
  --line:#252d40;
  --text:#f4f6ff;
  --sub:#929bb0;
  --blue:#3978f6;
  --blue2:#245bd1;
  --danger:#ff5368;
}

body.light {
  --bg:#eef2fa;
  --panel:rgba(255,255,255,.93);
  --panel2:#fff;
  --line:#dce3ef;
  --text:#182033;
  --sub:#69758b;
  --blue:#3978f6;
  --blue2:#245bd1;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans KR",sans-serif;
  min-height:100vh;
  overflow:hidden;
}

body:before {
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(80,110,170,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(80,110,170,.055) 1px,transparent 1px);
  background-size:35px 35px;
  pointer-events:none;
}

#particles {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

button,input,textarea { font:inherit; }
button { cursor:pointer; }

.app {
  position:relative;
  z-index:1;
  display:flex;
  width:min(1450px,100%);
  height:100dvh;
  margin:auto;
  padding:18px;
  gap:15px;
}

.sidebar {
  width:260px;
  flex-shrink:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  display:flex;
  flex-direction:column;
  backdrop-filter:blur(18px);
  overflow-y:auto;
}

.logo {
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
  color:var(--blue);
  margin-bottom:25px;
}

.section-title {
  font-size:11px;
  color:var(--sub);
  letter-spacing:1px;
  margin:15px 0 10px;
}

.category-list {
  display:flex;
  flex-direction:column;
  gap:7px;
}

/* 둥글어진 카테고리 */
.category {
  display:flex;
  align-items:center;
  gap:8px;
  padding:11px 13px;
  border-radius:14px;
  color:var(--sub);
  cursor:pointer;
  transition:background .2s,color .2s;
}

.category:hover {
  background:rgba(57,120,246,.10);
  color:var(--text);
}

.category.active {
  background:rgba(57,120,246,.20);
  color:var(--text);
}

.category-name {
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
}

.category-actions {
  display:flex;
  gap:5px;
}

.category-actions button {
  border:0;
  background:transparent;
  color:var(--sub);
  padding:2px 4px;
}

.category-actions button:hover {
  color:var(--blue);
}

.sidebar-bottom {
  margin-top:auto;
  padding-top:15px;
}

.small-btn {
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:8px;
  padding:9px 11px;
}

.small-btn:hover {
  border-color:var(--blue);
}

.admin-panel {
  display:none;
  padding:12px;
  margin:5px 0 12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--panel2);
}

.admin-panel.open {
  display:block;
}

.admin-panel-title {
  font-size:12px;
  font-weight:bold;
  margin-bottom:10px;
}

.admin-panel input {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
  outline:none;
  margin-bottom:8px;
}

.admin-panel button {
  width:100%;
  margin-top:5px;
}

.admin-status {
  font-size:11px;
  color:var(--sub);
  margin:8px 0;
}

.profile {
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-top:1px solid var(--line);
  margin-top:10px;
}

.avatar {
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,#3978f6,#9259ed);
  display:grid;
  place-items:center;
  font-weight:bold;
  color:#fff !important;
  flex-shrink:0;
}

.profile-info {
  flex:1;
  min-width:0;
}

.profile-name {
  font-weight:bold;
  color:var(--text) !important;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.profile-status {
  font-size:11px;
  color:var(--sub);
  margin-top:4px;
}

.main {
  flex:1;
  min-width:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  backdrop-filter:blur(18px);
}

.topbar {
  height:70px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid var(--line);
  position:relative;
}

.room-title {
  font-size:17px;
  font-weight:bold;
}

.room-sub {
  font-size:11px;
  color:var(--sub);
  margin-top:5px;
}

/* 메뉴 */
.menu-area {
  position:relative;
}

.menu-button {
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:9px;
  padding:9px 15px;
  font-size:13px;
  font-weight:bold;
  transition:.2s;
}

.menu-button:hover {
  border-color:var(--blue);
  background:rgba(57,120,246,.12);
}

.menu-dropdown {
  display:none;
  position:absolute;
  top:48px;
  right:0;
  width:205px;
  padding:8px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 12px 35px #0005;
  z-index:15;
}

.menu-dropdown.open {
  display:block;
  animation:menuAppear .15s ease-out;
}

@keyframes menuAppear {
  from {
    opacity:0;
    transform:translateY(-5px);
  }
  to {
    opacity:1;
    transform:translateY(0);
  }
}

.menu-item {
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--text);
  text-align:left;
  font-size:13px;
}

.menu-item:hover {
  background:rgba(57,120,246,.15);
}

.menu-item-icon {
  width:20px;
  text-align:center;
  color:var(--blue);
}

.menu-divider {
  height:1px;
  background:var(--line);
  margin:5px 3px;
}

.messages {
  flex:1;
  overflow-y:auto;
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.message {
  display:flex;
  gap:10px;
  max-width:90%;
  align-items:flex-start;
  position:relative;
  padding:5px;
  border-radius:10px;
  touch-action:pan-y;
}

.message:hover {
  background:rgba(100,120,160,.06);
}

.message-content { min-width:0; }

.message-meta {
  display:flex;
  gap:9px;
  align-items:center;
  margin-bottom:5px;
}

/* 채팅 이름은 테마에 맞춰 변경 */
.message-name {
  font-size:13px;
  font-weight:bold;
  color:var(--text) !important;
}

.message-time {
  font-size:10px;
  color:var(--sub);
}

.message-text {
  font-size:14px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message-tools {
  display:none;
  gap:5px;
  margin-top:5px;
}

.message:hover .message-tools {
  display:flex;
}

.message-tools button {
  border:0;
  background:transparent;
  color:var(--sub);
  font-size:11px;
  padding:3px;
}

.message-tools button:hover {
  color:var(--blue);
}

.reply-preview {
  border-left:3px solid var(--blue);
  padding:6px 9px;
  margin-bottom:7px;
  background:rgba(57,120,246,.09);
  border-radius:4px;
  font-size:11px;
  color:var(--sub);
}

.mention {
  color:#72a4ff;
  background:rgba(57,120,246,.15);
  border-radius:4px;
  padding:1px 3px;
  font-weight:bold;
}

.ai-name {
  color:var(--text) !important;
}

.composer-wrap {
  padding:12px 18px 18px;
  border-top:1px solid var(--line);
  position:relative;
}

.replying {
  display:none;
  padding:8px 11px;
  margin-bottom:8px;
  border-left:3px solid var(--blue);
  background:rgba(57,120,246,.1);
  border-radius:5px;
  font-size:12px;
}

.composer {
  display:flex;
  align-items:flex-end;
  gap:10px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:13px;
  padding:10px;
}

.composer textarea {
  flex:1;
  resize:none;
  max-height:130px;
  min-height:25px;
  background:transparent;
  border:0;
  outline:0;
  color:var(--text);
  font-size:14px;
}

.send-btn {
  background:var(--blue);
  color:white;
  border:0;
  border-radius:9px;
  padding:10px 16px;
  font-weight:bold;
}

.send-btn:hover {
  background:var(--blue2);
}

#mention-list {
  display:none;
  position:absolute;
  bottom:90px;
  left:30px;
  z-index:10;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:10px;
  min-width:190px;
  max-height:180px;
  overflow:auto;
  box-shadow:0 8px 30px #0006;
}

.mention-option {
  padding:10px;
  cursor:pointer;
  font-size:13px;
}

.mention-option:hover {
  background:rgba(57,120,246,.18);
}

.online-list {
  display:flex;
  flex-direction:column;
  gap:8px;
}

.online-user {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--sub);
}

.dot {
  width:7px;
  height:7px;
  background:#35ce88;
  border-radius:50%;
}

.modal-bg {
  position:fixed;
  inset:0;
  z-index:20;
  background:rgba(0,0,0,.75);
  display:grid;
  place-items:center;
  padding:18px;
}

.modal {
  width:min(390px,100%);
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:17px;
  padding:25px;
}

.modal h2 { margin:0 0 8px; }

.modal p {
  font-size:12px;
  color:var(--sub);
  line-height:1.6;
}

.modal input {
  width:100%;
  padding:12px;
  margin:8px 0;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:9px;
  color:var(--text);
  outline:none;
}

.modal button.primary {
  width:100%;
  padding:12px;
  background:var(--blue);
  color:white;
  border:0;
  border-radius:9px;
  margin-top:10px;
}

.hidden { display:none !important; }

#toast {
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  z-index:50;
  background:#20283a;
  color:white;
  padding:11px 17px;
  border-radius:9px;
  font-size:12px;
  display:none;
}

@media(max-width:700px) {
  body {
    overflow:hidden;
  }

  .app {
    width:100%;
    height:100dvh;
    padding:0;
    gap:0;
    flex-direction:column;
  }

  .sidebar {
    width:100%;
    height:auto;
    max-height:180px;
    flex-shrink:0;
    padding:10px 12px;
    border-radius:0;
    border-left:0;
    border-right:0;
    border-top:0;
    overflow-y:auto;
  }

  .logo {
    font-size:18px;
    margin:0 0 8px;
    text-align:left;
  }

  .section-title {
    display:block;
    margin:5px 0 7px;
  }

  .category-list {
    display:flex;
    flex-direction:row;
    flex-wrap:wrap;
    gap:6px;
  }

  .category {
    width:auto;
    flex:0 1 auto;
    padding:8px 11px;
    border-radius:12px;
  }

  .category-name {
    display:block;
    white-space:nowrap;
  }

  .category-actions {
    display:flex;
  }

  #add-category {
    margin-top:7px !important;
    padding:7px 10px;
  }

  .sidebar-bottom {
    display:none;
  }

  .online-list {
    display:none;
  }

  .main {
    flex:1;
    width:100%;
    min-width:0;
    min-height:0;
    border-radius:0;
    border-left:0;
    border-right:0;
    border-bottom:0;
  }

  .topbar {
    height:60px;
    flex-shrink:0;
    padding:0 12px;
  }

  .messages {
    min-height:0;
    padding:12px;
    overflow-x:hidden;
  }

  .message {
    max-width:100%;
    min-width:0;
  }

  .message-content {
    min-width:0;
    overflow-wrap:anywhere;
  }

  .composer-wrap {
    flex-shrink:0;
    padding:9px;
  }

  .composer {
    width:100%;
    min-width:0;
  }

  .composer textarea {
    min-width:0;
  }

  .send-btn {
    padding:10px 12px;
  }

  #mention-list {
    left:12px;
    bottom:85px;
    max-width:calc(100% - 24px);
  }

  .menu-dropdown {
    right:0;
    width:190px;
  }
}

@media(max-width:380px) {
  .category {
    padding:7px 9px;
    font-size:12px;
  }

  .topbar {
    padding:0 9px;
  }

  .room-title {
    font-size:15px;
  }
}

  .sidebar {
    width:68px;
    padding:12px 7px;
    border-radius:0;
  }

  .logo {
    font-size:15px;
    text-align:center;
  }

  .section-title,
  .category-name,
  .category-actions,
  .profile-info,
  .online-list {
    display:none;
  }

  .category {
    justify-content:center;
    padding:13px 4px;
  }

  .profile { justify-content:center; }

  .profile .avatar {
    width:34px;
    height:34px;
  }

  .admin-panel {
    position:fixed;
    left:75px;
    bottom:15px;
    width:220px;
    z-index:30;
  }

  .main { border-radius:0; }
  .topbar { padding:0 12px; }
  .messages { padding:13px; }
  .composer-wrap { padding:10px; }
  .menu-dropdown { right:0; }
}
</style>
</head>

<body>
<canvas id="particles"></canvas>

<div class="app">

  <aside class="sidebar">

    <div class="logo">AXION</div>

    <div class="section-title">CHANNELS</div>
    <div id="category-list" class="category-list"></div>

    <button class="small-btn" id="add-category" style="margin-top:10px">
      ＋ 카테고리 추가
    </button>

    <div class="section-title">ONLINE</div>
    <div id="online-list" class="online-list"></div>

    <div class="sidebar-bottom">

      <div class="admin-panel" id="admin-panel">
        <div class="admin-panel-title">관리자 설정</div>

        <div id="admin-login-area">
          <input id="admin-password" type="password"
                 placeholder="관리자 비밀번호">
          <button class="small-btn" id="admin-login">로그인</button>
        </div>

        <div id="admin-controls" class="hidden">
          <div class="admin-status">관리자 모드 활성화</div>
          <button class="small-btn" id="admin-logout">
            관리자 로그아웃
          </button>
        </div>
      </div>

      <div class="profile">
        <div class="avatar" id="my-avatar">?</div>

        <div class="profile-info">
          <div class="profile-name" id="my-name">사용자</div>
          <div class="profile-status">온라인</div>
        </div>
      </div>

    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div>
        <div class="room-title" id="room-title">채팅방</div>
        <div class="room-sub">Axion 실시간 채팅</div>
      </div>

      <div class="menu-area">
        <button class="menu-button" id="menu-button">메뉴 ☰</button>

        <div class="menu-dropdown" id="menu-dropdown">
          <button class="menu-item" id="menu-admin">
            <span class="menu-item-icon">⚙</span>
            관리자 설정
          </button>

          <button class="menu-item" id="menu-profile">
            <span class="menu-item-icon">👤</span>
            프로필 설정
          </button>

          <div class="menu-divider"></div>

          <button class="menu-item" id="menu-theme">
            <span class="menu-item-icon" id="theme-icon">◐</span>
            <span id="theme-label">라이트 모드</span>
          </button>
        </div>
      </div>
    </header>

    <section class="messages" id="messages"></section>

    <div class="composer-wrap">
      <div id="replying" class="replying"></div>
      <div id="mention-list"></div>

      <div class="composer">
        <textarea id="message" rows="1"
                  placeholder="메시지를 입력하세요..."></textarea>
        <button class="send-btn" id="send">전송</button>
      </div>
    </div>

  </main>
</div>

<div class="modal-bg" id="join-modal">
  <div class="modal">
    <h2>AXION에 오신 것을 환영합니다</h2>
    <p>채팅방에서 사용할 닉네임을 입력해 주세요.</p>
    <input id="nickname" maxlength="20"
           placeholder="닉네임 (최대 20자)">
    <button class="primary" id="join-button">채팅 시작하기</button>
  </div>
</div>

<div class="modal-bg hidden" id="profile-modal">
  <div class="modal">
    <h2>프로필 설정</h2>
    <input id="profile-nickname" maxlength="20" placeholder="닉네임">
    <button class="primary" id="save-profile">저장</button>
    <button class="small-btn" id="close-profile"
            style="width:100%;margin-top:8px">닫기</button>
  </div>
</div>

<div class="modal-bg hidden" id="category-modal">
  <div class="modal">
    <h2 id="category-modal-title">카테고리 추가</h2>
    <input id="category-input" maxlength="30"
           placeholder="카테고리 이름">
    <button class="primary" id="save-category">저장</button>
    <button class="small-btn" id="close-category"
            style="width:100%;margin-top:8px">닫기</button>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase, ref, push, set, update, remove, onValue,
  serverTimestamp, onDisconnect
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyAf-nM5PJRU2o2q7TvX2LeZNKh8A021bck",
  authDomain: "chat-27c50.firebaseapp.com",
  databaseURL: "https://chat-27c50-default-rtdb.firebaseio.com",
  projectId: "chat-27c50",
  storageBucket: "chat-27c50.firebasestorage.app",
  messagingSenderId: "811770063187",
  appId: "1:811770063187:web:ba17f4f49ebb682c9cd9a6"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* Cloudflare Worker */
const AXION_AI_URL =
  "https://axion-ai.gimjaehyeong199.workers.dev";

const $ = id => document.getElementById(id);

const uid = localStorage.getItem("axion_uid") || crypto.randomUUID();
localStorage.setItem("axion_uid",uid);

let nickname = localStorage.getItem("axion_nickname") || "";
let currentCategory = "";
let isAdmin = false;
let editingCategory = null;
let replyingTo = null;
let messagesCache = [];
let onlineCache = {};
let categoryCache = {};

let stopMessages = null;
let stopCategories = null;
let stopPresence = null;
let presenceTimer = null;

function toast(message) {
  $("toast").textContent = message;
  $("toast").style.display = "block";
  setTimeout(() => $("toast").style.display = "none",3000);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g,c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function formatText(value) {
  return escapeHTML(value).replace(
    /@([^\s@]+)/g,
    '<span class="mention">@$1</span>'
  );
}

function timeText(timestamp) {
  if (!timestamp) return "";
  return new Date(timestamp).toLocaleTimeString("ko-KR",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

/* 메뉴 */
$("menu-button").onclick = e => {
  e.stopPropagation();
  $("menu-dropdown").classList.toggle("open");
};

document.addEventListener("click",e => {
  if (!e.target.closest(".menu-area")) {
    $("menu-dropdown").classList.remove("open");
  }
});

$("menu-admin").onclick = () => {
  $("menu-dropdown").classList.remove("open");
  $("admin-panel").classList.toggle("open");
};

$("menu-profile").onclick = () => {
  $("menu-dropdown").classList.remove("open");
  showProfile();
};

$("menu-theme").onclick = () => {
  $("menu-dropdown").classList.remove("open");
  toggleTheme();
};

/* 닉네임 */
if (nickname) {
  $("join-modal").classList.add("hidden");
  startApp();
}

$("join-button").onclick = () => {
  const value = $("nickname").value.trim();

  if (!value) {
    toast("먼저 닉네임을 입력해줘");
    return;
  }

  nickname = value;
  localStorage.setItem("axion_nickname",nickname);

$("nickname").addEventListener("keydown",e => {

});

/* 프로필 */
function showProfile() {
  $("profile-nickname").value = nickname;
  $("profile-modal").classList.remove("hidden");
}

$("close-profile").onclick = () => {
  $("profile-modal").classList.add("hidden");
};

$("save-profile").onclick = async () => {
  const next = $("profile-nickname").value.trim();

  if (!next) {
    toast("닉네임을 입력해줘");
    return;
  }

  nickname = next;

  $("my-avatar").textContent = nickname[0].toUpperCase();

      ref(db,`categoryMessages/${currentCategory}/_presence/${uid}`),

/* 관리자 */
$("admin-login").onclick = () => {
  if ($("admin-password").value === "KB0328") {
    isAdmin = true;

    $("admin-login-area").classList.add("hidden");
    $("admin-controls").classList.remove("hidden");

};

$("admin-logout").onclick = () => {
  isAdmin = false;

  $("admin-login-area").classList.remove("hidden");
  $("admin-controls").classList.add("hidden");

  renderCategories();
  toast("관리자 로그아웃");
};

/* 카테고리 */
function startCategoryListener() {
  stopCategories = onValue(
    ref(db,"categories"),
    snapshot => {
      const data = snapshot.val() || {};
      const entries = Object.entries(data);

      categoryCache = data;

      if (!entries.length) {
        const id = push(ref(db,"categories")).key;

        set(ref(db,`categories/${id}`),{
          name:"일반"
        }).catch(error => {
          toast("카테고리 생성 실패: " + error.message);
        });

        return;
      }

      renderCategories();

      if (!currentCategory || !data[currentCategory]) {
        switchCategory(entries[0][0]);
      }
    },
    error => {
      console.error(error);
      toast("Firebase 카테고리 오류: " + error.message);
    }
  );
}

function renderCategories() {
  const list = $("category-list");
  list.innerHTML = "";

  Object.entries(categoryCache).forEach(([id,category]) => {
    const row = document.createElement("div");

    row.className =
      "category" + (id === currentCategory ? " active" : "");

    const name = document.createElement("span");
    name.className = "category-name";
    name.textContent = "▣ " + (category.name || "이름 없음");
    name.onclick = () => switchCategory(id);

    row.appendChild(name);

    if (isAdmin) {
      const actions = document.createElement("div");
      actions.className = "category-actions";

      const edit = document.createElement("button");
      edit.textContent = "✎";

      edit.onclick = e => {
        e.stopPropagation();
        openCategoryModal(id,category.name);
      };

      const del = document.createElement("button");
      del.textContent = "×";

      del.onclick = async e => {
        e.stopPropagation();

        if (!confirm("이 카테고리와 메시지를 삭제할까?")) return;

        try {
          await remove(ref(db,`categories/${id}`));
          await remove(ref(db,`categoryMessages/${id}`));
          toast("카테고리를 삭제했어");
        } catch (error) {
          toast("삭제 실패: " + error.message);
        }
      };

      actions.append(edit,del);
      row.appendChild(actions);
    }

    list.appendChild(row);
  });
}

function openCategoryModal(id,name = "") {
  if (!isAdmin) {
    toast("관리자 로그인이 필요해");
    return;
  }

  editingCategory = id;

  $("category-modal-title").textContent =
    id ? "카테고리 수정" : "카테고리 추가";

  $("category-input").value = name;
  $("category-modal").classList.remove("hidden");
}

$("add-category").onclick = () => openCategoryModal(null);

$("close-category").onclick = () => {
  $("category-modal").classList.add("hidden");
};

$("save-category").onclick = async () => {
  if (!isAdmin) return;

  const name = $("category-input").value.trim();

  if (!name) {
    toast("카테고리 이름을 입력해줘");
    return;
  }

  try {
    if (editingCategory) {
      await update(
        ref(db,`categories/${editingCategory}`),
        {name}
      );
    } else {
      const newRef = push(ref(db,"categories"));
      await set(newRef,{name});
    }

    $("category-modal").classList.add("hidden");
    toast("저장했어");
  } catch (error) {
    toast("저장 실패: " + error.message);
  }
};

/* 채팅방 전환 */
function switchCategory(id) {
  if (!id) return;

  currentCategory = id;

  if (stopMessages) stopMessages();
  if (stopPresence) stopPresence();
  if (presenceTimer) clearInterval(presenceTimer);

  messagesCache = [];
  onlineCache = {};

  stopMessages = onValue(
    ref(db,`categoryMessages/${id}`),
    snapshot => {
      const data = snapshot.val() || {};

      messagesCache = Object.entries(data)
        .filter(([key,value]) =>
          key !== "_presence" &&
          value &&
          value.text !== undefined
        )
        .map(([key,value]) => ({
          id:key,
          ...value
        }))
        .sort((a,b) =>
          (a.createdAt || 0) - (b.createdAt || 0)
        );

      renderMessages();
    },
    error => {
      console.error(error);
      toast("메시지 불러오기 실패: " + error.message);
    }
  );

  const presenceRef = ref(
    db,`categoryMessages/${id}/_presence/${uid}`
  );

  const updatePresence = () => {
    update(presenceRef,{
      name:nickname,
      lastActive:serverTimestamp()
    }).catch(error => console.error(error));
  };

  updatePresence();
  onDisconnect(presenceRef).remove();

  presenceTimer = setInterval(updatePresence,30000);

  stopPresence = onValue(
    ref(db,`categoryMessages/${id}/_presence`),
    snapshot => {
      onlineCache = snapshot.val() || {};
      renderOnline();
    },
    error => console.error(error)
  );

  renderCategories();
}

function renderOnline() {
  const list = $("online-list");
  list.innerHTML = "";

  Object.entries(onlineCache).forEach(([id,user]) => {
    if (Date.now() - (user.lastActive || 0) > 90000) return;

    const row = document.createElement("div");
    row.className = "online-user";

    const dot = document.createElement("span");
    dot.className = "dot";

    const name = document.createElement("span");
    name.textContent = user.name || "사용자";

    row.append(dot,name);
    list.appendChild(row);
  });
}

function startApp() {
  $("my-name").textContent = nickname;
  $("my-avatar").textContent = nickname[0].toUpperCase();

  startCategoryListener();
}

/* 메시지 */
function renderMessages() {
  const box = $("messages");
  box.innerHTML = "";

  messagesCache.forEach(msg => {
    const row = document.createElement("div");
    row.className = "message";
    row.dataset.id = msg.id;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = (msg.name || "?")[0].toUpperCase();

    const content = document.createElement("div");
    content.className = "message-content";

    const meta = document.createElement("div");
    meta.className = "message-meta";

    const name = document.createElement("span");
    name.className = "message-name";

    if (msg.uid === "axion-ai") {
      name.classList.add("ai-name");
    }

    name.textContent = msg.name || "사용자";

    const time = document.createElement("span");
    time.className = "message-time";
    time.textContent = timeText(msg.createdAt);

    meta.append(name,time);
    content.appendChild(meta);

    if (msg.replyTo) {
      const original = messagesCache.find(
        m => m.id === msg.replyTo
      );

      if (original) {
        const preview = document.createElement("div");
        preview.className = "reply-preview";
        preview.textContent =
          `↳ ${original.name}: ${original.text}`;

        content.appendChild(preview);
      }
    }

    const text = document.createElement("div");
    text.className = "message-text";
    text.innerHTML = formatText(msg.text || "");

    content.appendChild(text);

    const tools = document.createElement("div");
    tools.className = "message-tools";

    const reply = document.createElement("button");
    reply.textContent = "답장";
    reply.onclick = () => setReply(msg);

    tools.appendChild(reply);

    if (msg.uid === uid || isAdmin) {
      const edit = document.createElement("button");
      edit.textContent = "수정";
      edit.onclick = () => editMessage(msg);

      const del = document.createElement("button");
      del.textContent = "삭제";
      del.onclick = () => deleteMessage(msg);

      tools.append(edit,del);
    }

    content.appendChild(tools);
    row.append(avatar,content);

    addSwipeReply(row,msg);

    box.appendChild(row);
  });

  box.scrollTop = box.scrollHeight;
}

/* 스와이프 답장 */
function addSwipeReply(element,msg) {
  let startX = 0;
  let startY = 0;

  element.addEventListener("touchstart",e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  },{passive:true});

  element.addEventListener("touchend",e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;

    if (dx > 65 && Math.abs(dy) < 45) {
      setReply(msg);
    }
  },{passive:true});
}

function setReply(msg) {
  replyingTo = msg;

  $("replying").style.display = "block";
  $("replying").textContent =
    `답장 중: ${msg.name} - ${msg.text.slice(0,70)}`;

  $("message").focus();
}

async function editMessage(msg) {
  const next = prompt("메시지를 수정해줘",msg.text);

  if (next === null || !next.trim()) return;

  try {
    await update(
      ref(db,`categoryMessages/${currentCategory}/${msg.id}`),
      {
        text:next.trim(),
        edited:true
      }
    );
  } catch (error) {
    toast("수정 실패: " + error.message);
  }
}

async function deleteMessage(msg) {
  if (!confirm("이 메시지를 삭제할까?")) return;

  try {
    await remove(
      ref(db,`categoryMessages/${currentCategory}/${msg.id}`)
    );
  } catch (error) {
    toast("삭제 실패: " + error.message);
  }
}

/* 멘션 */
const messageBox = $("message");
const mentionBox = $("mention-list");

messageBox.addEventListener("input",() => {
  const match = messageBox.value.match(/@([^\s@]*)$/);

  if (!match) {
    mentionBox.style.display = "none";
    return;
  }

  const query = match[1].toLowerCase();

  const names = [
    "Axion",
    ...Object.values(onlineCache)
      .map(user => user.name)
      .filter(Boolean)
  ];

  const users = names
    .filter((name,index,array) =>
      array.findIndex(item =>
        item.toLowerCase() === name.toLowerCase()
      ) === index
    )
    .filter(name =>
      name.toLowerCase().includes(query)
    );

  mentionBox.innerHTML = "";

  users.forEach(name => {
    const option = document.createElement("div");
    option.className = "mention-option";
    option.textContent = "@" + name;

    option.onclick = () => {
      messageBox.value = messageBox.value.replace(
        /@([^\s@]*)$/,
        "@" + name + " "
      );

      mentionBox.style.display = "none";
      messageBox.focus();
    };

    mentionBox.appendChild(option);
  });

  mentionBox.style.display =
    users.length ? "block" : "none";
});

/* 메시지 전송 */
async function sendMessage() {
  const text = messageBox.value.trim();

  if (!text || !currentCategory) return;

  messageBox.value = "";
  messageBox.style.height = "auto";
  mentionBox.style.display = "none";

  const replyTo = replyingTo?.id || null;

  replyingTo = null;
  $("replying").style.display = "none";

  try {
    await push(
      ref(db,`categoryMessages/${currentCategory}`),
      {
        name:nickname,
        uid,
        text,
        createdAt:serverTimestamp(),
        replyTo
      }
    );
  } catch (error) {
    toast("메시지 전송 실패: " + error.message);
    return;
  }

  const aiMatch = text.match(
    /^@Axion(?:\s+|$)([\s\S]*)$/i
  );

  if (aiMatch) {
    const question = aiMatch[1].trim();

    if (!question) {
      toast("@Axion 뒤에 질문을 입력해줘");
      return;
    }

    await askAxion(question);
  }
}

$("send").onclick = sendMessage;

messageBox.addEventListener("keydown",e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

messageBox.addEventListener("input",() => {
  messageBox.style.height = "auto";

  messageBox.style.height =
    Math.min(messageBox.scrollHeight,130) + "px";
});

/* Axion AI */
async function askAxion(question) {
  const aiRef = push(
    ref(db,`categoryMessages/${currentCategory}`)
  );

  await set(aiRef,{
    name:"Axion",
    uid:"axion-ai",
    text:"생각 중...",
    createdAt:serverTimestamp()
  });

  try {
    const recent = messagesCache.slice(-15);

    const history = recent
      .filter(m => m.uid !== "axion-ai")
      .map(m => ({
        role:"user",
        content:`${m.name || "사용자"}: ${m.text || ""}`
      }));

    const messages = [
      {
        role:"system",
        content:
          "너는 Axion이라는 이름의 친근한 한국어 그룹 채팅 AI야. " +
          "친구들과 대화하듯 자연스럽고 편하게 답해. " +
          "답변은 지나치게 길지 않게 작성해."
      },
      ...history,
      {
        role:"user",
        content:`${nickname}의 질문: ${question}`
      }
    ];

    const response = await fetch(AXION_AI_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({messages})
    });

    const responseText = await response.text();

    let result;

    try {
      result = JSON.parse(responseText);
    } catch {
      throw new Error(
        "Worker 응답 형식 오류: " + responseText.slice(0,200)
      );
    }

    if (!response.ok) {
      const errorMessage =
        typeof result.error === "string"
          ? result.error
          : result.error?.message || result.detail || responseText;

      throw new Error(
        `Worker 오류 (${response.status}): ${errorMessage}`
      );
    }

    const answer = result.choices?.[0]?.message?.content;

    if (!answer) {
      throw new Error("AI 답변이 비어 있어");
    }

    await update(aiRef,{
      text:answer,
      createdAt:serverTimestamp()
    });

  } catch (error) {
    console.error(error);

    await update(aiRef,{
      text:"AI 오류: " + error.message,
      createdAt:serverTimestamp()
    });

    toast("AI 오류: " + error.message);
  }
}

/* 테마 */
function updateThemeLabel() {
  const isLight = document.body.classList.contains("light");

  $("theme-label").textContent =
    isLight ? "다크 모드" : "라이트 모드";

  $("theme-icon").textContent =
    isLight ? "☾" : "☀";

function toggleTheme() {
  document.body.classList.toggle("light");

  localStorage.setItem(
    "axion_theme",
    document.body.classList.contains("light")
      ? "light"
      : "dark"
  );

  updateThemeLabel();
}

if (localStorage.getItem("axion_theme") === "light") {
  document.body.classList.add("light");
}

updateThemeLabel();

/* 배경 파티클 */
const canvas = $("particles");
const ctx = canvas.getContext("2d");

let particles = [];

function resizeCanvas() {
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;

  ctx.setTransform(
    devicePixelRatio,0,0,devicePixelRatio,0,0
  );

  particles = Array.from({length:45},() => ({
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    r:Math.random()*1.7+.4,
    speed:Math.random()*.25+.08
  }));
}

function animate() {
  ctx.clearRect(0,0,innerWidth,innerHeight);

  particles.forEach(p => {
    p.y -= p.speed;

    if (p.y < 0) p.y = innerHeight;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = "rgba(75,130,255,.45)";
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

addEventListener("resize",resizeCanvas);

resizeCanvas();
animate();
