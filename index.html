
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axion Chat</title>
<style>
:root{
  --bg:#191827;--panel:#1d1b2e;--panel2:#252239;
  --border:#37314e;--text:#f5f1ff;--muted:#a6a0bf;
  --accent:#a77bff;--bubble:#302b46;--green:#46d6a0;
}
*{box-sizing:border-box}
body{
  margin:0;height:100vh;overflow:hidden;
  font-family:Arial,"Malgun Gothic",sans-serif;
  background:linear-gradient(120deg,#191727,#202542);
  color:var(--text);font-size:13px
}
button,input{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:flex;gap:18px;padding:14px 24px}
.sidebar,.main{
  background:var(--panel);border:1px solid var(--border);
  border-radius:26px;min-height:0
}
.sidebar{
  width:297px;flex-shrink:0;padding:28px 17px 15px;
  display:flex;flex-direction:column
}
.brand{display:flex;align-items:center;gap:13px;padding:0 9px 30px}
.logo{
  width:49px;height:49px;border-radius:17px;
  background:linear-gradient(135deg,#8964ff,#ed79d8);
  display:grid;place-items:center;font-size:25px;font-weight:900;
  box-shadow:0 7px 20px #9b70ff30
}
.brand-name{font-size:25px;font-weight:800;letter-spacing:-1px}
.brand-sub{font-size:10px;color:var(--muted);margin-top:5px}
.section-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:0 10px 16px;color:#b9b2d2;font-weight:bold;
  letter-spacing:1px;font-size:12px
}
.add-channel{
  width:38px;height:38px;border:0;border-radius:13px;
  color:#e7ddff;background:#393252;font-size:22px
}
.channel-list{display:flex;flex-direction:column;gap:7px}
.channel{
  width:100%;padding:12px 13px;border:0;border-radius:16px;
  background:transparent;color:var(--muted);display:flex;
  align-items:center;gap:12px;text-align:left;font-size:14px
}
.channel.active{background:#40304d;color:#f4eaff;font-weight:bold}
.channel-icon{
  width:39px;height:39px;border-radius:13px;background:#39304b;
  display:grid;place-items:center;color:#c9a9ff;font-size:18px
}
.channel-name{flex:1}
.channel-dot{width:10px;height:10px;background:#b4acc9;border-radius:50%}
.profile{
  margin-top:auto;padding:17px 9px 4px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:11px
}
.avatar{
  width:43px;height:43px;border-radius:14px;display:grid;
  place-items:center;background:linear-gradient(135deg,#63c4ff,#8968ff);
  font-size:19px;font-weight:bold;flex-shrink:0
}
.profile-info{min-width:0;flex:1}
.profile-name{font-size:13px;font-weight:bold}
.online{font-size:11px;color:var(--green);margin-top:5px}
.profile-actions{display:flex;gap:6px;align-items:center}
.profile-button{
  width:40px;height:40px;border:0;border-radius:13px;
  background:#393252;color:#d7c9ff;font-size:17px
}
.profile-button:hover,.add-channel:hover{filter:brightness(1.2)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:92px;flex-shrink:0;padding:0 24px;display:flex;
  align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border)
}
.room{display:flex;align-items:center;gap:14px}
.room-icon{
  width:40px;height:40px;border-radius:14px;background:#40334e;
  display:grid;place-items:center;font-size:18px
}
.room-title{font-size:19px;font-weight:800}
.room-subtitle{font-size:12px;color:var(--muted);margin-top:6px}
.top-actions{display:flex;gap:12px;align-items:center}
.theme-button{
  width:46px;height:46px;border:2px solid #b5a0ff;border-radius:16px;
  background:#302944;font-size:19px
}
.live{
  background:#e7fff4;color:#209d76;border-radius:24px;
  padding:10px 14px;font-size:12px;font-weight:bold
}
.messages{
  flex:1;min-height:0;overflow-y:auto;padding:33px 30px;
  display:flex;flex-direction:column;gap:17px
}
.start-line{
  display:flex;align-items:center;justify-content:center;gap:13px;
  color:var(--muted);font-size:11px;margin:0 0 8px
}
.start-line:before,.start-line:after{
  content:"";width:60px;height:1px;background:var(--border)
}
.message-row{display:flex;align-items:flex-start;gap:12px}
.message-row.mine{align-self:flex-end;flex-direction:row-reverse}
.message-avatar{
  width:38px;height:38px;border-radius:13px;display:grid;
  place-items:center;background:linear-gradient(135deg,#62c5ff,#8670ff);
  font-weight:bold;flex-shrink:0;font-size:14px
}
.message-body{max-width:min(75%,650px);min-width:0}
.message-meta{display:flex;gap:9px;align-items:center;margin:2px 0 8px}
.message-author{font-size:12px;font-weight:bold}
.message-time{font-size:10px;color:var(--muted)}
.bubble{
  display:inline-block;max-width:100%;overflow-wrap:anywhere;
  white-space:pre-wrap;background:#302d48;border-radius:5px 16px 16px 16px;
  padding:12px 15px;font-size:12px;line-height:1.55;color:#f0edff
}
.mine .bubble{background:#554078;border-radius:16px 5px 16px 16px}
.reply-quote{
  font-size:10px;color:#c5b6ec;background:#29263d;
  padding:7px 9px;border-left:2px solid var(--accent);
  margin-bottom:5px;border-radius:4px
}
.message-actions{display:flex;gap:6px;margin-top:5px}
.message-actions button{
  background:#39334f;color:#c9bee8;border:1px solid #4a4164;
  border-radius:8px;padding:5px 8px;font-size:10px
}
.composer-area{padding:13px 30px 20px;border-top:1px solid var(--border)}
.reply-preview{
  display:none;align-items:center;justify-content:space-between;
  background:var(--panel2);padding:8px 12px;border-radius:9px;
  color:var(--muted);font-size:11px;margin-bottom:8px
}
.reply-preview.show{display:flex}
.reply-preview button{border:0;background:transparent;color:var(--text)}
.composer{
  min-height:72px;border:1px solid #b7aecb;border-radius:22px;
  display:flex;align-items:center;padding:10px 11px 10px 15px;gap:10px
}
.composer input{
  flex:1;min-width:0;background:transparent;border:0;outline:0;
  color:var(--text);font-size:12px;padding:10px 0
}
.composer input::placeholder{color:#a7a0bc}
.send{
  width:48px;height:48px;border:0;border-radius:16px;
  color:white;font-size:22px;
  background:linear-gradient(135deg,#9768ff,#d46ce5)
}
.footer-note{
  display:flex;justify-content:space-between;color:var(--muted);
  font-size:10px;padding:14px 6px 0
}
.status{color:var(--muted)}
.modal-backdrop{
  position:fixed;inset:0;display:none;align-items:center;
  justify-content:center;background:#080713bb;z-index:10;padding:15px
}
.modal-backdrop.show{display:flex}
.modal{
  width:100%;max-width:360px;background:#211f33;border:1px solid #413857;
  border-radius:19px;padding:23px;color:#f5f1ff
}
.modal h3{margin:0 0 17px;font-size:17px}
.modal p{font-size:12px;line-height:1.6;color:#c0b8d6}
.modal input{
  display:block;width:100%;margin-top:8px;padding:12px;
  background:#171625;color:white;border:1px solid #49415f;
  border-radius:10px;outline-color:#a77bff
}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal-actions button{
  border:0;border-radius:9px;padding:10px 14px;font-size:12px
}
.primary{background:#a17aff;color:white}
.secondary{background:#39334f;color:white}
.danger{background:#dc5274;color:white}
body.light{
  --bg:#f5f2ff;--panel:#fff;--panel2:#f0ecff;--border:#e6dff3;
  --text:#302743;--muted:#8b829f;--bubble:#eee8ff
}
body.light .main,body.light .sidebar{background:var(--panel)}
body.light .bubble{background:#eee8ff;color:#352a4b}
body.light .mine .bubble{background:#dfd2ff}
body.light .composer{border-color:#d3c7e9}
body.light .modal{background:white;color:#302743}
body.light .modal input{background:#faf8ff;color:#302743}
@media(max-width:700px){
  .app{padding:6px;gap:6px}
  .sidebar{width:155px;padding:15px 8px;border-radius:18px}
  .brand{padding:0 2px 22px;gap:8px}
  .logo{width:35px;height:35px;border-radius:12px;font-size:19px}
  .brand-name{font-size:19px}.brand-sub{font-size:8px}
  .channel{padding:9px 6px;gap:6px;font-size:12px}
  .channel-icon{width:30px;height:30px}
  .profile{padding:12px 0;gap:6px;flex-wrap:wrap}
  .avatar{width:33px;height:33px;font-size:14px}
  .profile-name{font-size:11px}
  .profile-button{width:32px;height:32px;font-size:14px}
  .topbar{height:72px;padding:0 12px}
  .room-title{font-size:16px}.room-subtitle{font-size:10px}
  .messages{padding:20px 12px}
  .composer-area{padding:10px}
  .composer{min-height:58px;border-radius:17px}
  .send{width:39px;height:39px;border-radius:13px}
  .live{padding:8px;font-size:10px}
  .theme-button{width:36px;height:36px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">A</div>
      <div><div class="brand-name">Axion</div><div class="brand-sub">YOUR SPACE, YOUR PEOPLE</div></div>
    </div>
    <div class="section-head">
      <span>CHANNELS</span>
      <button class="add-channel" id="addChannel" title="채널 추가">+</button>
    </div>
    <div class="channel-list" id="channelList"></div>
    <div class="profile">
      <div class="avatar" id="profileAvatar">김</div>
      <div class="profile-info">
        <div class="profile-name" id="profileName">사용자</div>
        <div class="online">● 온라인</div>
      </div>
      <div class="profile-actions">
        <button class="profile-button" id="profileEdit" title="프로필 수정">✎</button>
        <button class="profile-button" id="adminButton" title="관리자">⚙</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="room">
        <div class="room-icon">✦</div>
        <div>
          <div class="room-title" id="roomTitle">잡담</div>
          <div class="room-subtitle">편하게 이야기를 나눠 보세요.</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="theme-button" id="themeButton" title="테마 변경">🌞</button>
        <span class="live">● 실시간</span>
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="start-line">대화 시작</div>
      <div class="status">메시지를 불러오는 중...</div>
    </section>

    <div class="composer-area">
      <div class="reply-preview" id="replyPreview">
        <span id="replyText"></span><button id="cancelReply">✕</button>
      </div>
      <form class="composer" id="messageForm">
        <input id="messageInput" placeholder="메시지를 입력하세요... (@로 멘션)" maxlength="2000" autocomplete="off">
        <button class="send" type="submit" title="전송">➤</button>
      </form>
      <div class="footer-note">
        <span id="status">Enter 전송 · Shift + Enter 줄바꿈</span>
        <span>Axion Chat</span>
      </div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">Axion</h3>
    <div id="modalContent"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getDatabase,ref,push,set,onValue,remove} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAf-nM5PJRUo2q7TvX2LeZNKxh8A021bck",
  authDomain: "chat-27c50.firebaseapp.com",
  databaseURL: "https://chat-27c50-default-rtdb.firebaseio.com",
  projectId: "chat-27c50",
  storageBucket: "chat-27c50.firebasestorage.app",
  messagingSenderId: "811770063187",
  appId: "1:811770063187:web:ba17f4f49ebb682c9cd9a6"
};
const ADMIN_PASSWORD = "AxionAdmin2026!";
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const $ = id => document.getElementById(id);

let currentChannel = "general";
let channels = {general:{name:"잡담"}};
let allMessages = {};
let replyTo = null;
let isAdmin = false;
let unsubscribeMessages = null;

let username = localStorage.getItem("axionName");
if(!username){
  username = prompt("Axion에서 사용할 이름을 입력하세요.") || "사용자";
  username = username.trim().slice(0,30) || "사용자";
  localStorage.setItem("axionName",username);
}
updateProfile();

function updateProfile(){
  $("profileName").textContent = username;
  $("profileAvatar").textContent = username.charAt(0).toUpperCase();
}
function escapeHTML(s=""){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function modal(title,content,buttons){
  $("modalTitle").textContent=title;
  $("modalContent").innerHTML=content;
  $("modalActions").innerHTML="";
  buttons.forEach(b=>{
    const el=document.createElement("button");
    el.className=b.className||"secondary";
    el.textContent=b.label;
    el.onclick=async()=>{
      try{await b.action?.()}catch(e){alert(e.message)}
      if(b.close!==false)$("modalBackdrop").classList.remove("show");
    };
    $("modalActions").appendChild(el);
  });
  $("modalBackdrop").classList.add("show");
}
function renderChannels(){
  $("channelList").innerHTML="";
  Object.entries(channels).forEach(([id,c])=>{
    const button=document.createElement("button");
    button.className="channel"+(id===currentChannel?" active":"");
    button.innerHTML=`<span class="channel-icon">✦</span><span class="channel-name">${escapeHTML(c.name||id)}</span>${id===currentChannel?'<span class="channel-dot"></span>':""}`;
    button.onclick=()=>switchChannel(id);
    $("channelList").appendChild(button);
  });
}
function listenChannels(){
  onValue(ref(db,"channels"),snap=>{
    channels={general:{name:"잡담"},...(snap.val()||{})};
    renderChannels();
    $("status").textContent="실시간 연결됨";
  },err=>$("status").textContent="채널 오류: "+err.message);
}
function switchChannel(id){
  currentChannel=id;
  $("roomTitle").textContent=channels[id]?.name||id;
  replyTo=null;updateReplyPreview();renderChannels();
  if(unsubscribeMessages)unsubscribeMessages();
  unsubscribeMessages=onValue(ref(db,"channelMessages/"+id),snap=>{
    allMessages=snap.val()||{};
    renderMessages();
  },err=>$("status").textContent="메시지 읽기 실패: "+err.message);
}
function renderMessages(){
  const box=$("messages");
  const entries=Object.entries(allMessages).sort((a,b)=>(a[1].timestamp||0)-(b[1].timestamp||0));
  let html='<div class="start-line">대화 시작</div>';
  if(!entries.length)html+='<div class="status" style="text-align:center;margin-top:20px">아직 메시지가 없습니다.</div>';
  entries.forEach(([id,m])=>{
    const mine=m.name===username;
    const time=m.timestamp?new Date(m.timestamp).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false}):"";
    const parent=m.replyTo?allMessages[m.replyTo]:null;
    html+=`<div class="message-row ${mine?"mine":""}" data-id="${escapeHTML(id)}">
      <div class="message-avatar">${escapeHTML((m.name||"?").charAt(0))}</div>
      <div class="message-body">
        <div class="message-meta"><span class="message-author">${escapeHTML(m.name||"사용자")}</span><span class="message-time">${time}</span></div>
        ${parent?`<div class="reply-quote">↳ ${escapeHTML(parent.name)}: ${escapeHTML(parent.text)}</div>`:""}
        <div class="bubble">${escapeHTML(m.text||"").replace(/(^|\s)(@[a-zA-Z0-9가-힣_]+)/g,'$1<span style="color:#c7a6ff;font-weight:bold">$2</span>')}</div>
        <div class="message-actions"><button data-reply="${escapeHTML(id)}">↩ 답장</button>${isAdmin?`<button data-delete="${escapeHTML(id)}">삭제</button>`:""}</div>
      </div>
    </div>`;
  });
  box.innerHTML=html;
  box.querySelectorAll("[data-reply]").forEach(b=>b.onclick=()=>startReply(b.dataset.reply));
  box.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteMessage(b.dataset.delete));
  box.scrollTop=box.scrollHeight;

  box.querySelectorAll(".message-row").forEach(row=>{
    let x=0,y=0;
    row.addEventListener("touchstart",e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});
    row.addEventListener("touchend",e=>{
      const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;
      if(dx>65&&Math.abs(dy)<45)startReply(row.dataset.id);
    },{passive:true});
  });
}
function startReply(id){
  const m=allMessages[id];if(!m)return;
  replyTo=id;
  $("replyText").textContent="답장: "+m.name+" — "+m.text;
  updateReplyPreview();$("messageInput").focus();
}
function updateReplyPreview(){$("replyPreview").classList.toggle("show",!!replyTo)}
$("cancelReply").onclick=()=>{replyTo=null;updateReplyPreview()};

$("messageForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const input=$("messageInput"),text=input.value.trim();
  if(!text)return;
  const message={name:username,text,timestamp:Date.now()};
  if(replyTo)message.replyTo=replyTo;
  $("status").textContent="전송 중...";
  try{
    await set(push(ref(db,"channelMessages/"+currentChannel)),message);
    input.value="";replyTo=null;updateReplyPreview();
    $("status").textContent="Enter 전송 · Shift + Enter 줄바꿈";
  }catch(err){
    console.error(err);
    modal("메시지 전송 실패",`<p>${escapeHTML(err.message)}</p>`,[{label:"확인",className:"primary"}]);
  }
});
$("messageInput").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("messageForm").requestSubmit()}
});

$("addChannel").onclick=()=>modal("채널 추가",
  '<label>채널 이름</label><input id="newChannelName" maxlength="30" placeholder="예: 게임">',
  [{label:"만들기",className:"primary",action:async()=>{
    const name=$("newChannelName").value.trim();
    if(!name)return;
    const id=name.toLowerCase().replace(/\s+/g,"-").replace(/[.#$/\[\]]/g,"");
    if(!id)return;
    await set(ref(db,"channels/"+id),{name});
    switchChannel(id);
  }},{label:"취소"}]);

$("profileEdit").onclick=()=>modal("프로필 수정",
  `<label>표시 이름</label><input id="newUsername" maxlength="30" value="${escapeHTML(username)}">`,
  [{label:"저장",className:"primary",action:()=>{
    const value=$("newUsername").value.trim();
    if(!value)return;
    username=value;localStorage.setItem("axionName",username);updateProfile();renderMessages();
  }},{label:"취소"}]);

$("adminButton").onclick=()=>{
  if(isAdmin){
    isAdmin=false;
    $("adminButton").textContent="⚙";
    renderMessages();
    alert("관리자 모드가 해제되었습니다.");
    return;
  }
  modal("관리자 로그인",
    '<label>관리자 비밀번호</label><input id="adminPassword" type="password" placeholder="비밀번호 입력">',
    [{label:"로그인",className:"primary",action:()=>{
      if($("adminPassword").value!==ADMIN_PASSWORD){alert("비밀번호가 올바르지 않습니다.");return}
      isAdmin=true;$("adminButton").textContent="✓";renderMessages();
      alert("관리자 모드가 활성화되었습니다.");
    }},{label:"취소"}]);
};

async function deleteMessage(id){
  if(!isAdmin)return;
  if(!confirm("이 메시지를 삭제할까요?"))return;
  await remove(ref(db,"channelMessages/"+currentChannel+"/"+id));
}

$("themeButton").onclick=()=>{
  document.body.classList.toggle("light");
  const light=document.body.classList.contains("light");
  $("themeButton").textContent=light?"🌙":"🌞";
  localStorage.setItem("axionTheme",light?"light":"dark");
};
if(localStorage.getItem("axionTheme")==="light"){
  document.body.classList.add("light");$("themeButton").textContent="🌙";
}

listenChannels();
switchChannel("general");
</script>
</body>
</html>
