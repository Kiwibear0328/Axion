<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Axion</title>
<style>
:root{--panel:#fff;--text:#302943;--muted:#9189a6;--line:#e9e1f4;--accent:#8967ef;--bubble:#f0ebfa;--mine:#e8ddff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,"Malgun Gothic",sans-serif;color:var(--text);background:linear-gradient(135deg,#f8eaff,#f8f7ff 55%,#e4eaff)}button,input{font:inherit}button{cursor:pointer}
.app{height:100dvh;display:flex;gap:14px;padding:14px;min-height:0}.sidebar,.main{background:var(--panel);border:1px solid #ffffffc9;border-radius:20px;box-shadow:0 10px 30px #60468a18;min-height:0}.sidebar{width:260px;flex:0 0 260px;padding:16px 12px;display:flex;flex-direction:column;gap:14px}.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#8964ff,#ed79d8);display:grid;place-items:center;color:white;font-weight:900;font-size:23px}.brand-name{font-size:22px;font-weight:800}.section-head{display:flex;justify-content:space-between;align-items:center;padding:0 6px;color:var(--muted);font-size:12px;font-weight:bold}.icon-btn{border:0;border-radius:10px;background:#f0ebff;color:#7958dc;width:34px;height:34px;font-size:17px}.channel-list{display:flex;flex-direction:column;gap:5px;overflow:auto;min-height:50px}.channel{display:flex;align-items:center;gap:9px;padding:9px;border:0;border-radius:12px;background:transparent;color:#817995;text-align:left;width:100%;min-width:0}.channel.active{background:#eee5ff;color:#7854ed;font-weight:bold}.channel-icon{width:34px;height:34px;border-radius:10px;background:#eee8ff;display:grid;place-items:center;color:#8c6aff;flex:none}.channel-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.profile{margin-top:auto;padding:12px 4px 2px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}.avatar,.msg-avatar{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#63c4ff,#8968ff);color:white;font-weight:bold;flex:none}.profile-info{min-width:0;flex:1}.profile-name{font-size:12px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.online{font-size:10px;color:#35b98f;margin-top:4px}.profile-actions{display:flex;gap:4px}.profile-actions .icon-btn{width:30px;height:30px}.theme-btn{width:100%;border:1px solid var(--line);border-radius:11px;background:transparent;padding:10px;color:var(--text);text-align:left}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}.topbar{min-height:70px;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:9px}.room{display:flex;align-items:center;gap:10px;min-width:0}.room-icon{width:38px;height:38px;border-radius:12px;background:#f0e7fa;display:grid;place-items:center;color:#8967ef}.room-title{font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.room-subtitle{font-size:11px;color:var(--muted);margin-top:3px}.live{font-size:11px;color:#209e78;background:#e8fff5;padding:7px 10px;border-radius:20px;white-space:nowrap}
.messages{flex:1;min-height:0;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:13px}.empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}.message-row{display:flex;align-items:flex-start;gap:8px;max-width:100%}.message-row.mine{align-self:flex-end;flex-direction:row-reverse}.msg-avatar{font-size:12px}.message-body{max-width:min(78%,680px);min-width:0}.meta{display:flex;gap:7px;align-items:center;margin:2px 0 5px;font-size:11px}.author{font-weight:bold}.time,.edited{font-size:10px;color:var(--muted)}.bubble{display:inline-block;max-width:100%;overflow-wrap:anywhere;white-space:pre-wrap;background:var(--bubble);border-radius:5px 14px 14px 14px;padding:10px 12px;font-size:13px;line-height:1.55}.mine .bubble{background:var(--mine);border-radius:14px 5px 14px 14px}.reply-quote{font-size:11px;color:#8c7ba8;background:#f8f4ff;padding:7px 9px;border-left:2px solid var(--accent);margin-bottom:6px;border-radius:4px;overflow-wrap:anywhere}.mention{color:#7653dc;background:#e8ddff;border-radius:4px;padding:0 2px;font-weight:bold}.message-actions{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}.message-actions button{background:transparent;color:#8b80a7;border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:10px}
.composer-area{padding:10px 18px 14px;border-top:1px solid var(--line)}.reply-preview{display:none;align-items:center;justify-content:space-between;background:#f3efff;padding:8px 10px;border-radius:9px;color:#8d82aa;font-size:11px;margin-bottom:8px;gap:8px}.reply-preview.show{display:flex}.reply-preview-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.composer-wrap{position:relative}.composer{min-height:56px;border:1px solid #d9cdea;border-radius:16px;display:flex;align-items:center;padding:6px 7px 6px 13px;gap:8px;background:#ffffffc9}.composer input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:13px;padding:10px 0}.send{width:42px;height:42px;border:0;border-radius:13px;color:white;font-size:19px;background:linear-gradient(135deg,#9768ff,#d46ce5);flex:none}.mention-box{display:none;position:absolute;bottom:65px;left:0;right:0;max-height:190px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #60468a18;z-index:20;padding:6px}.mention-option{display:block;padding:9px;border:0;background:transparent;width:100%;text-align:left;border-radius:8px;color:var(--text)}.mention-option:hover{background:#f1ebff}
.modal-backdrop{position:fixed;inset:0;background:#21183377;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.modal-backdrop.show{display:flex}.modal{width:min(390px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 24px 80px #3e2a602b;color:var(--text)}.modal h2{font-size:17px;margin:0 0 13px}.modal-content{font-size:13px;line-height:1.6;color:var(--muted)}.modal input{width:100%;margin-top:9px;padding:12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}.modal-actions button{border:0;border-radius:9px;padding:10px 13px;font-size:12px}.primary{background:var(--accent);color:white}.secondary{background:#f0ecf8;color:#74668e}.danger{background:#ffedf1;color:#d84669}.toast-area{position:fixed;right:14px;top:14px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}.toast{background:var(--panel);color:var(--text);padding:12px 14px;border-radius:11px;box-shadow:0 10px 30px #60468a18;font-size:12px;max-width:calc(100vw - 28px)}
.join-backdrop{position:fixed;inset:0;z-index:300;background:#171322bb;display:flex;align-items:center;justify-content:center;padding:18px}.join-card{width:min(360px,100%);padding:25px;border-radius:19px;background:white;text-align:center;color:#302943}.join-card h1{margin:0 0 8px}.join-card p{font-size:12px;color:#9189a6}.join-card input{width:100%;padding:13px;border:1px solid #e9e1f4;border-radius:10px;margin:12px 0}.join-card button{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#8967ef,#c477df);color:white;font-weight:bold}
body.dark{--panel:#1c1c1c;--text:#f3f3f3;--muted:#aaa;--line:#383838;--bubble:#303030;--mine:#343b4d;background:#080808;color:var(--text)}.dark .sidebar,.dark .main{border-color:#333}.dark .channel.active{background:#29223c;color:#d8caff}.dark .channel-icon,.dark .icon-btn{background:#292929;color:#cbbaff}.dark .composer,.dark .reply-preview{background:#202020;border-color:#444}.dark .composer input{color:var(--text)}.dark .reply-quote{background:#292929;color:#c5b8df}.dark .message-actions button{border-color:#444;color:#c2b5dc}.dark .mention-option:hover{background:#292929}.dark .join-card{background:#202020;color:#f3f3f3}.dark .join-card input{background:#292929;color:white;border-color:#444}.dark .secondary{background:#333;color:#eee}
@media(max-width:760px){.app{padding:0;gap:0;height:100dvh}.sidebar{width:66px;flex-basis:66px;border-radius:0;padding:10px 5px;gap:10px;border-top:0;border-bottom:0;border-left:0}.brand{justify-content:center;padding:0 0 4px}.brand-name,.section-head span,.channel-name,.profile-info,.theme-label{display:none}.section-head{justify-content:center;padding:0}.channel{justify-content:center;padding:6px}.channel-icon{width:40px;height:40px}.profile{justify-content:center;flex-wrap:wrap;padding:9px 0}.profile-actions{width:100%;justify-content:center;flex-wrap:wrap}.profile-actions .icon-btn{width:27px;height:27px}.topbar{min-height:62px;padding:8px 10px}.room-title{font-size:15px}.messages{padding:12px 8px;gap:11px}.message-body{max-width:calc(100vw - 130px)}.composer-area{padding:8px 8px max(9px,env(safe-area-inset-bottom))}.live{font-size:10px;padding:6px 8px}}
@media(max-width:420px){.sidebar{width:52px;flex-basis:52px;padding:8px 3px}.channel-icon{width:36px;height:36px}.profile-actions{gap:2px}.profile-actions .icon-btn{width:23px;height:23px;font-size:12px}.avatar{width:31px;height:31px}.messages{padding:9px 5px}.message-body{max-width:calc(100vw - 100px)}.topbar{padding:7px}.room-icon{width:32px;height:32px}.room-title{font-size:14px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar">
  <div class="brand"><div class="logo">A</div><div class="brand-name">Axion</div></div>
  <div class="section-head"><span>카테고리</span><button class="icon-btn" id="addCategory" title="카테고리 추가">＋</button></div>
  <div class="channel-list" id="categoryList"><div class="empty">불러오는 중...</div></div>
  <div class="profile"><div class="avatar" id="profileAvatar">A</div><div class="profile-info"><div class="profile-name" id="profileName">사용자</div><div class="online">온라인</div></div><div class="profile-actions"><button class="icon-btn" id="profileEdit" title="프로필 수정">✎</button><button class="icon-btn" id="adminButton" title="관리자 메뉴">⚙</button></div></div>
  <button class="theme-btn" id="themeButton">☾ <span class="theme-label">다크 모드</span></button>
 </aside>
 <main class="main">
  <header class="topbar"><div class="room"><div class="room-icon">#</div><div><div class="room-title" id="roomTitle">채널</div><div class="room-subtitle">Axion 실시간 채팅</div></div></div><div class="live" id="onlineCount">● 접속자 0명</div></header>
  <section class="messages" id="messages"><div class="empty">채널을 선택해 대화를 시작해 보세요.</div></section>
  <div class="composer-area">
   <div class="reply-preview" id="replyPreview"><span class="reply-preview-text" id="replyText"></span><button class="icon-btn" id="cancelReply">×</button></div>
   <div class="composer-wrap"><div class="mention-box" id="mentionBox"></div><form class="composer" id="messageForm"><input id="messageInput" maxlength="2000" autocomplete="off" placeholder="메시지를 입력하세요... (@로 멘션)" required><button class="send" type="submit">➤</button></form></div>
  </div>
 </main>
</div>
<div class="join-backdrop" id="joinBackdrop"><div class="join-card"><h1>Axion</h1><p>친구들과 함께 대화해 보세요.</p><input id="nicknameInput" maxlength="20" placeholder="닉네임 (최대 20자)"><button id="joinButton">채팅 시작하기</button></div></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h2 id="modalTitle">알림</h2><div class="modal-content" id="modalContent"></div><div class="modal-actions" id="modalActions"></div></div></div>
<div class="toast-area" id="toastArea"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getDatabase,ref,push,set,update,remove,onValue,onDisconnect,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyAf-nM5PJRUo2q7TvX2LeZNKxh8A021bck",
 authDomain:"chat-27c50.firebaseapp.com",
 databaseURL:"https://chat-27c50-default-rtdb.firebaseio.com",
 projectId:"chat-27c50",
 storageBucket:"chat-27c50.firebasestorage.app",
 messagingSenderId:"811770063187",
 appId:"1:811770063187:web:ba17f4f49ebb682c9cd9a6"
};
const db=getDatabase(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
const ADMIN_PASSWORD="KB0328";
const uid=sessionStorage.getItem("axionSession")||("u_"+Math.random().toString(36).slice(2)+Date.now().toString(36));
sessionStorage.setItem("axionSession",uid);
let nickname=localStorage.getItem("axionNickname")||"",activeCategory="",categories={},messages={},people={},replyTo=null,isAdmin=false;
let stopCategories=null,stopMessages=null,stopPeople=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const timeOf=t=>new Date(t||Date.now()).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});

function toast(message){
 const el=document.createElement("div");el.className="toast";el.textContent=message;$("toastArea").append(el);setTimeout(()=>el.remove(),2800);
}
function closeModal(){$("modalBackdrop").classList.remove("show");}
function showModal(title,html,buttons){
 $("modalTitle").textContent=title;$("modalContent").innerHTML=html;$("modalActions").replaceChildren();
 buttons.forEach(b=>{const btn=document.createElement("button");btn.className=b.kind||"secondary";btn.textContent=b.label;btn.onclick=b.run;$("modalActions").append(btn);});
 $("modalBackdrop").classList.add("show");
}
function askText(title,label,initial,callback){
 showModal(title,`<label>${esc(label)}<input id="modalInput" maxlength="40" value="${esc(initial||"")}" autocomplete="off"></label>`,[
  {label:"취소",kind:"secondary",run:closeModal},
  {label:"저장",kind:"primary",run:()=>{const value=$("modalInput").value.trim();if(!value){toast("내용을 입력해 줘.");return;}closeModal();callback(value);}}
 ]);
 setTimeout(()=>$("modalInput")?.focus(),40);
}
function confirmAction(title,message,callback){
 showModal(title,esc(message),[
  {label:"취소",kind:"secondary",run:closeModal},
  {label:"삭제",kind:"danger",run:()=>{closeModal();callback();}}
 ]);
}
$("modalBackdrop").addEventListener("click",e=>{if(e.target===$("modalBackdrop"))closeModal();});

function setNickname(name){
 nickname=name;localStorage.setItem("axionNickname",name);
 $("profileName").textContent=name;$("profileAvatar").textContent=name.slice(0,1).toUpperCase();
}
function join(){
 const name=$("nicknameInput").value.trim();
 if(!name){toast("먼저 닉네임을 입력해 줘.");return;}
 setNickname(name);$("joinBackdrop").hidden=true;startApp();
}
$("joinButton").addEventListener("click",join);
$("nicknameInput").addEventListener("keydown",e=>{if(e.key==="Enter")join();});
if(nickname){$("nicknameInput").value=nickname;setNickname(nickname);$("joinBackdrop").hidden=true;startApp();}

function startApp(){
 if(stopCategories)stopCategories();
 stopCategories=onValue(ref(db,"categories"),snapshot=>{
  categories=snapshot.val()||{};
  if(!activeCategory||!categories[activeCategory])activeCategory=Object.keys(categories)[0]||"";
  renderCategories();
  if(!Object.keys(categories).length){createFirstCategory();return;}
  if(activeCategory)switchCategory(activeCategory);
 },error=>toast("카테고리를 불러오지 못했어요: "+error.message));
}
let creatingFirst=false;
async function createFirstCategory(){
 if(creatingFirst)return;creatingFirst=true;
 try{const newRef=push(ref(db,"categories"));await set(newRef,{name:"일반",createdAt:serverTimestamp()});activeCategory=newRef.key;}
 catch(e){toast("기본 카테고리 생성 실패: "+e.message);}
 finally{creatingFirst=false;}
}

function renderCategories(){
 const list=$("categoryList");list.replaceChildren();
 Object.entries(categories).forEach(([id,category])=>{
  const button=document.createElement("button");
  button.className="channel"+(id===activeCategory?" active":"");
  button.innerHTML=`<span class="channel-icon">#</span><span class="channel-name">${esc(category.name||"이름 없음")}</span>`;
  button.onclick=()=>{if(activeCategory===id)return;activeCategory=id;renderCategories();switchCategory(id);};
  button.oncontextmenu=e=>{e.preventDefault();categoryMenu(id);};
  button.ondblclick=()=>categoryMenu(id);
  list.append(button);
 });
}
function categoryMenu(id){
 showModal("카테고리 관리",`<p>${esc(categories[id]?.name||"")}</p>`,[
  {label:"닫기",kind:"secondary",run:closeModal},
  {label:"이름 수정",kind:"primary",run:()=>editCategory(id)},
  {label:"삭제",kind:"danger",run:()=>deleteCategory(id)}
 ]);
}
function editCategory(id){
 askText("카테고리 이름 수정","새 카테고리 이름",categories[id]?.name||"",async name=>{
  try{await update(ref(db,"categories/"+id),{name,updatedAt:serverTimestamp()});toast("카테고리 이름을 수정했어요.");}
  catch(e){toast("카테고리 수정 실패: "+e.message);}
 });
}
function deleteCategory(id){
 if(Object.keys(categories).length<=1){toast("마지막 카테고리는 삭제할 수 없어요.");return;}
 confirmAction("카테고리 삭제","이 카테고리와 안에 있는 모든 메시지를 삭제할까요? 이 작업은 되돌릴 수 없어요.",async()=>{
  try{
   await remove(ref(db,"categoryMessages/"+id));
   await remove(ref(db,"presence/"+id));
   await remove(ref(db,"categories/"+id));
   if(activeCategory===id)activeCategory="";
   toast("카테고리와 메시지를 삭제했어요.");
  }catch(e){toast("카테고리 삭제 실패: "+e.message);}
 });
}
$("addCategory").onclick=()=>askText("카테고리 추가","카테고리 이름","",async name=>{
 try{const newRef=push(ref(db,"categories"));await set(newRef,{name,createdAt:serverTimestamp()});activeCategory=newRef.key;toast("카테고리를 추가했어요.");}
 catch(e){toast("카테고리 추가 실패: "+e.message);}
});

function switchCategory(id){
 if(!id)return;
 if(stopMessages)stopMessages();if(stopPeople)stopPeople();
 $("roomTitle").textContent=categories[id]?.name||"채널";
 messages={};people={};replyTo=null;renderReply();renderOnline();
 stopMessages=onValue(ref(db,"categoryMessages/"+id),snapshot=>{
  messages=snapshot.val()||{};renderMessages();
 },error=>toast("메시지 읽기 실패: "+error.message));
 const presenceRef=ref(db,`presence/${id}/${uid}`);
 set(presenceRef,{name:nickname,joinedAt:serverTimestamp()}).catch(e=>toast("접속자 등록 실패: "+e.message));
 onDisconnect(presenceRef).remove();
 stopPeople=onValue(ref(db,"presence/"+id),snapshot=>{
  people=snapshot.val()||{};renderOnline();
  if($("messageInput").value.includes("@"))showMentions();
 },error=>toast("접속자 목록 실패: "+error.message));
}
function renderOnline(){$("onlineCount").textContent=`● 접속자 ${Object.keys(people).length}명`;}
function formatMessage(text){
 return esc(text).replace(/(^|\s)@([\p{L}\p{N}_-]{1,20})/gu,'$1<span class="mention">@$2</span>');
}
function renderMessages(){
 const box=$("messages");box.replaceChildren();
 const entries=Object.entries(messages).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));
 if(!entries.length){box.innerHTML='<div class="empty">아직 메시지가 없어요.<br>첫 메시지를 보내 보세요!</div>';return;}
 entries.forEach(([id,message])=>{
  const mine=message.uid===uid,row=document.createElement("div");row.className="message-row"+(mine?" mine":"");
  const reply=message.replyText?`<div class="reply-quote">↳ ${esc(message.replyName||"")}: ${esc(message.replyText)}</div>`:"";
  row.innerHTML=`<div class="msg-avatar">${esc((message.name||"?").slice(0,1))}</div><div class="message-body"><div class="meta"><span class="author">${esc(message.name||"익명")}</span><span class="time">${timeOf(message.createdAt)}</span>${message.edited?'<span class="edited">수정됨</span>':""}</div>${reply}<div class="bubble">${formatMessage(message.text||"")}</div><div class="message-actions"><button data-action="reply">답장</button>${mine?'<button data-action="edit">수정</button>':""}${mine||isAdmin?'<button data-action="delete">삭제</button>':""}</div></div>`;
  row.querySelector('[data-action="reply"]').onclick=()=>setReply(id,message);
  row.querySelector('[data-action="edit"]')?.addEventListener("click",()=>editMessage(id,message));
  row.querySelector('[data-action="delete"]')?.addEventListener("click",()=>deleteMessage(id));
  let startX=0;
  row.addEventListener("touchstart",e=>{startX=e.touches[0].clientX;},{passive:true});
  row.addEventListener("touchend",e=>{if(e.changedTouches[0].clientX-startX>65)setReply(id,message);},{passive:true});
  box.append(row);
 });
 box.scrollTop=box.scrollHeight;
}
function setReply(id,message){replyTo={id,name:message.name||"익명",text:message.text||""};renderReply();$("messageInput").focus();}
function renderReply(){
 const preview=$("replyPreview");preview.classList.toggle("show",!!replyTo);
 $("replyText").textContent=replyTo?`${replyTo.name}: ${replyTo.text}`:"";
}
$("cancelReply").onclick=()=>{replyTo=null;renderReply();};
function editMessage(id,message){
 if(message.uid!==uid&&!isAdmin){toast("본인이 보낸 메시지만 수정할 수 있어요.");return;}
 askText("메시지 수정","메시지 내용",message.text||"",async text=>{
  try{await update(ref(db,`categoryMessages/${activeCategory}/${id}`),{text,edited:true,editedAt:serverTimestamp()});toast("메시지를 수정했어요.");}
  catch(e){toast("메시지 수정 실패: "+e.message);}
 });
}
function deleteMessage(id){
 confirmAction("메시지 삭제","이 메시지를 삭제할까요?",async()=>{
  try{await remove(ref(db,`categoryMessages/${activeCategory}/${id}`));toast("메시지를 삭제했어요.");}
  catch(e){toast("메시지 삭제 실패: "+e.message);}
 });
}

$("messageForm").addEventListener("submit",async e=>{
 e.preventDefault();const input=$("messageInput"),text=input.value.trim();
 if(!text||!activeCategory)return;
 const data={uid,name:nickname,text,createdAt:Date.now()};
 if(replyTo){data.replyTo=replyTo.id;data.replyName=replyTo.name;data.replyText=replyTo.text.slice(0,180);}
 try{await set(push(ref(db,`categoryMessages/${activeCategory}`)),data);input.value="";replyTo=null;renderReply();hideMentions();input.focus();}
 catch(error){toast("메시지 전송 실패: Firebase 데이터베이스 규칙을 확인해 주세요.");}
});
$("profileEdit").onclick=()=>askText("프로필 수정","새 닉네임",nickname,async name=>{
 setNickname(name);
 if(activeCategory){try{await set(ref(db,`presence/${activeCategory}/${uid}`),{name,joinedAt:serverTimestamp()});}catch(e){toast("프로필 변경은 됐지만 접속자 정보 갱신에 실패했어요.");}}
 toast("닉네임을 변경했어요.");
});
$("adminButton").onclick=()=>showModal("관리자 인증",'<label>관리자 비밀번호<input id="adminPassword" type="password" autocomplete="current-password"></label>',[
 {label:"취소",kind:"secondary",run:closeModal},
 {label:"확인",kind:"primary",run:()=>{if($("adminPassword").value===ADMIN_PASSWORD){isAdmin=true;closeModal();renderMessages();toast("관리자 모드가 활성화됐어요.");}else toast("비밀번호가 올바르지 않아요.");}}
]);
$("themeButton").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("axionDark",document.body.classList.contains("dark")?"1":"0");};
if(localStorage.getItem("axionDark")==="1")document.body.classList.add("dark");

const mentionBox=$("mentionBox"),messageInput=$("messageInput");
function hideMentions(){mentionBox.style.display="none";mentionBox.replaceChildren();}
function showMentions(){
 const cursor=messageInput.selectionStart;
 const before=messageInput.value.slice(0,cursor);
 const match=before.match(/(^|\s)@([^\s@]*)$/);
 if(!match){hideMentions();return;}
 const query=match[2].toLowerCase();
 const matches=Object.entries(people).filter(([id,p])=>(p.name||"").toLowerCase().includes(query));
 mentionBox.replaceChildren();
 if(!matches.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="현재 접속 중인 사용자가 없어요.";mentionBox.append(empty);}
 matches.forEach(([id,p])=>{
  const button=document.createElement("button");button.className="mention-option";button.textContent="● "+p.name;
  button.onclick=()=>{
   const start=cursor-match[2].length-1,value=messageInput.value;
   messageInput.value=value.slice(0,start)+"@"+p.name+" "+value.slice(cursor);
   const pos=start+p.name.length+2;messageInput.setSelectionRange(pos,pos);hideMentions();messageInput.focus();
  };
  mentionBox.append(button);
 });
 mentionBox.style.display="block";
}
messageInput.addEventListener("input",showMentions);
messageInput.addEventListener("click",showMentions);
messageInput.addEventListener("keyup",e=>{if(e.key==="Escape")hideMentions();else showMentions();});
document.addEventListener("click",e=>{if(!mentionBox.contains(e.target)&&e.target!==messageInput)hideMentions();});
window.addEventListener("beforeunload",()=>{if(activeCategory)remove(ref(db,`presence/${activeCategory}/${uid}`));});
</script>
</body>
</html>
