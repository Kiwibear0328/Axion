
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axion Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --bg: #08090c;
  --panel: rgba(20, 22, 28, .92);
  --card: #171920;
  --text: #f4f5f7;
  --muted: #9296a3;
  --border: #292c36;
  --blue: #4387ff;
  --mine: #1c3154;
}
body.light {
  color-scheme: light;
  --bg: #f3f5f9;
  --panel: rgba(255,255,255,.94);
  --card: #f0f2f7;
  --text: #171923;
  --muted: #747986;
  --border: #dfe3eb;
  --mine: #dce9ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  font-family: Pretendard, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background .2s, color .2s;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 38px 38px;
  opacity: .17;
}
#particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .45;
}
.app {
  position: relative;
  display: flex;
  flex-direction: column;
  width: min(900px, 100%);
  height: 100dvh;
  margin: auto;
  background: var(--panel);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  backdrop-filter: blur(16px);
}
header {
  min-height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  border-bottom: 1px solid var(--border);
}
.brand { font-size: 22px; font-weight: 800; letter-spacing: -.8px; }
.brand span { color: var(--blue); }
.header-right { display: flex; align-items: center; gap: 10px; }
.status { color: var(--muted); font-size: 12px; }
.icon-btn {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 10px;
  padding: 9px 12px;
  cursor: pointer;
}
#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px;
  scroll-behavior: smooth;
}
.empty {
  color: var(--muted);
  text-align: center;
  margin-top: 25vh;
  font-size: 14px;
}
.message {
  display: flex;
  gap: 10px;
  margin-bottom: 19px;
  align-items: flex-start;
}
.message.mine { flex-direction: row-reverse; }
.avatar {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: #263e67;
  color: #a9caff;
  font-weight: 800;
}
.message.mine .avatar { background: #194b96; color: white; }
.message-content { min-width: 0; max-width: 78%; }
.message.mine .message-content { text-align: right; }
.meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 12px;
}
.message.mine .meta { justify-content: flex-end; }
.author { font-weight: 700; }
.time { color: var(--muted); font-size: 11px; }
.bubble {
  display: inline-block;
  max-width: 100%;
  padding: 11px 13px;
  border: 1px solid var(--border);
  border-radius: 4px 14px 14px 14px;
  background: var(--card);
  text-align: left;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  line-height: 1.55;
}
.message.mine .bubble {
  background: var(--mine);
  border-color: #31588f;
  border-radius: 14px 4px 14px 14px;
}
.mention { color: #63a0ff; font-weight: 700; }
.reply-quote {
  display: block;
  width: 100%;
  margin-bottom: 7px;
  padding: 8px 10px;
  border: 0;
  border-left: 3px solid var(--blue);
  border-radius: 5px;
  background: rgba(120,130,150,.12);
  color: var(--muted);
  text-align: left;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  overflow: hidden;
}
.reply-quote strong { display: block; color: var(--blue); margin-bottom: 3px; }
.reply-quote span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.message-actions {
  display: flex;
  margin-top: 5px;
  gap: 5px;
  opacity: .8;
}
.message.mine .message-actions { justify-content: flex-end; }
.reply-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 32px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel);
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  touch-action: manipulation;
}
.reply-btn:hover, .reply-btn:focus-visible {
  color: var(--blue);
  border-color: var(--blue);
}
.composer {
  position: relative;
  padding: 12px 16px max(14px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  background: var(--panel);
}
.reply-preview {
  display: none;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  padding: 10px 12px;
  background: var(--card);
  border-left: 3px solid var(--blue);
  border-radius: 8px;
}
.reply-preview.show { display: flex; }
.reply-preview-text { flex: 1; min-width: 0; }
.reply-preview strong { display: block; color: var(--blue); font-size: 12px; margin-bottom: 4px; }
.reply-preview p {
  margin: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: 13px;
}
.cancel-reply {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 22px;
  cursor: pointer;
  padding: 4px 8px;
}
.input-row { display: flex; align-items: flex-end; gap: 10px; }
#message {
  flex: 1;
  min-width: 0;
  resize: none;
  max-height: 120px;
  border: 1px solid var(--border);
  outline: none;
  border-radius: 12px;
  padding: 13px 14px;
  background: var(--card);
  color: var(--text);
  font: inherit;
  font-size: 15px;
}
#message:focus { border-color: var(--blue); }
#send {
  border: 0;
  border-radius: 12px;
  padding: 0 18px;
  height: 46px;
  background: var(--blue);
  color: white;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}
#send:disabled { opacity: .5; cursor: wait; }
#mention-list {
  display: none;
  position: absolute;
  bottom: calc(100% - 4px);
  left: 16px;
  width: min(300px, calc(100% - 32px));
  max-height: 180px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  box-shadow: 0 10px 35px #0004;
  z-index: 5;
}
.mention-option {
  padding: 11px 13px;
  cursor: pointer;
  font-size: 14px;
}
.mention-option:hover { background: var(--card); color: var(--blue); }
#notice { color: var(--muted); font-size: 12px; padding: 0 2px 8px; }
.modal {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #0009;
  backdrop-filter: blur(8px);
}
.modal-card {
  width: min(360px, 100%);
  padding: 25px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--panel);
}
.modal-card h2 { margin: 0 0 8px; }
.modal-card p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
#nickname {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--text);
  font: inherit;
}
#join {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  background: var(--blue);
  color: white;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.flash { animation: flash 1.5s ease; }
@keyframes flash {
  0%,100% { outline: 0 solid transparent; }
  20%,70% { outline: 3px solid var(--blue); outline-offset: 3px; }
}
@media (hover:hover) and (pointer:fine) {
  .message-actions { opacity: 0; transition: opacity .15s; }
  .message:hover .message-actions,
  .message:focus-within .message-actions { opacity: 1; }
}
@media (max-width: 600px) {
  header { min-height: 60px; padding: 0 14px; }
  .brand { font-size: 20px; }
  #messages { padding: 16px 12px; }
  .message-content { max-width: 84%; }
  .avatar { width: 30px; height: 30px; border-radius: 9px; }
  .composer { padding: 10px 10px max(10px, env(safe-area-inset-bottom)); }
  .message-actions { opacity: 1; }
  .reply-btn { min-height: 36px; padding: 7px 11px; }
  #send { padding: 0 14px; }
  #message { font-size: 16px; }
  .status { display: none; }
}
</style>
</head>

<body>
<canvas id="particles"></canvas>

<div class="app">
  <header>
    <div class="brand">Axi<span>on</span></div>
    <div class="header-right">
      <span class="status" id="status">연결 중...</span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="테마 변경">☀/☾</button>
    </div>
  </header>

  <main id="messages" aria-live="polite">
    <div class="empty" id="empty">메시지를 기다리는 중...</div>
  </main>

  <form class="composer" id="form">
    <div id="notice"></div>
    <div id="reply-preview" class="reply-preview">
      <div class="reply-preview-text">
        <strong id="reply-author">답장</strong>
        <p id="reply-text"></p>
      </div>
      <button type="button" class="cancel-reply" id="cancel-reply" aria-label="답장 취소">×</button>
    </div>

    <div id="mention-list"></div>

    <div class="input-row">
      <textarea id="message" rows="1" placeholder="메시지를 입력하세요..." autocomplete="off"></textarea>
      <button id="send" type="submit">전송</button>
    </div>
  </form>
</div>

<div class="modal" id="nickname-modal">
  <div class="modal-card">
    <h2>Axion에 오신 것을 환영해요</h2>
    <p>채팅에서 사용할 닉네임을 입력하세요.</p>
    <form id="join-form">
      <input id="nickname" maxlength="20" placeholder="닉네임" required>
      <button id="join" type="submit">채팅 입장</button>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAf-nM5PJRUo2q7TvX2LeZNKxh8A021bck",
  authDomain: "chat-27c50.firebaseapp.com",
  databaseURL: "https://chat-27c50-default-rtdb.firebaseio.com",
  projectId: "chat-27c50",
  storageBucket: "chat-27c50.firebasestorage.app",
  messagingSenderId: "811770063187",
  appId: "1:811770063187:web:ba17f4f49ebb682c9cd9a6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const messagesRef = db.ref("messages");

const messagesEl = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("message");
const sendBtn = document.getElementById("send");
const notice = document.getElementById("notice");
const modal = document.getElementById("nickname-modal");
const nicknameInput = document.getElementById("nickname");
const replyPreview = document.getElementById("reply-preview");
const replyAuthor = document.getElementById("reply-author");
const replyText = document.getElementById("reply-text");
const mentionList = document.getElementById("mention-list");

let nickname = localStorage.getItem("axion_nickname") || "";
let selectedReply = null;
let knownMessages = new Map();
let knownNames = new Set();
let firstLoad = true;

if (nickname) {
  modal.style.display = "none";
  startChat();
} else {
  nicknameInput.focus();
}

document.getElementById("join-form").addEventListener("submit", e => {
  e.preventDefault();
  const value = nicknameInput.value.trim();
  if (!value) return;
  nickname = value;
  localStorage.setItem("axion_nickname", nickname);
  modal.style.display = "none";
  startChat();
});

function startChat() {
  document.getElementById("status").textContent = "실시간 채팅";
  messagesRef.on("child_added", snapshot => {
    const data = snapshot.val();
    if (!data || !data.text) return;
    renderMessage(snapshot.key, data);
    knownNames.add(data.name);
    updateMentionList();
  }, error => {
    notice.textContent = "메시지를 불러오지 못했습니다: " + error.message;
  });
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[ch]);
}

function formatText(value) {
  const safe = escapeHtml(value);
  return safe.replace(/(^|\s)@([\p{L}\p{N}_-]{1,20})/gu,
    (match, prefix, name) =>
      `${prefix}<span class="mention">@${name}</span>`
  );
}

function renderMessage(key, data) {
  const empty = document.getElementById("empty");
  if (empty) empty.remove();

  knownMessages.set(key, data);

  const row = document.createElement("article");
  row.className = "message" + (data.name === nickname ? " mine" : "");
  row.id = "msg-" + key;
  row.dataset.key = key;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = (data.name || "?").slice(0, 1).toUpperCase();

  const content = document.createElement("div");
  content.className = "message-content";

  const meta = document.createElement("div");
  meta.className = "meta";

  const author = document.createElement("span");
  author.className = "author";
  author.textContent = data.name || "익명";

  const time = document.createElement("span");
  time.className = "time";
  time.textContent = data.time || "";

  meta.append(author, time);
  content.append(meta);

  if (data.replyTo && data.replyTo.key) {
    const quote = document.createElement("button");
    quote.type = "button";
    quote.className = "reply-quote";
    quote.title = "원본 메시지로 이동";

    const quoteName = document.createElement("strong");
    quoteName.textContent = "↩ " + (data.replyTo.name || "메시지");

    const quoteBody = document.createElement("span");
    quoteBody.textContent = data.replyTo.text || "";

    quote.append(quoteName, quoteBody);
    quote.addEventListener("click", () => scrollToMessage(data.replyTo.key));
    content.append(quote);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = formatText(data.text);
  content.append(bubble);

  const actions = document.createElement("div");
  actions.className = "message-actions";

  const replyBtn = document.createElement("button");
  replyBtn.type = "button";
  replyBtn.className = "reply-btn";
  replyBtn.innerHTML = "↩ <span>답장</span>";
  replyBtn.setAttribute("aria-label", (data.name || "메시지") + "에게 답장");

  replyBtn.addEventListener("click", () => {
    setReply(key, data);
  });

  actions.append(replyBtn);
  content.append(actions);

  row.append(avatar, content);
  messagesEl.append(row);

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setReply(key, data) {
  selectedReply = {
    key,
    name: data.name || "익명",
    text: data.text || ""
  };

  replyAuthor.textContent = selectedReply.name + "에게 답장";
  replyText.textContent = selectedReply.text;
  replyPreview.classList.add("show");
  input.placeholder = selectedReply.name + "에게 답장...";
  input.focus();
}

function clearReply() {
  selectedReply = null;
  replyPreview.classList.remove("show");
  input.placeholder = "메시지를 입력하세요...";
}

document.getElementById("cancel-reply").addEventListener("click", clearReply);

function scrollToMessage(key) {
  const target = document.getElementById("msg-" + key);
  if (!target) {
    notice.textContent = "원본 메시지를 찾을 수 없습니다.";
    return;
  }
  target.scrollIntoView({ behavior: "smooth", block: "center" });
  target.classList.remove("flash");
  void target.offsetWidth;
  target.classList.add("flash");
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !nickname) return;

  sendBtn.disabled = true;
  notice.textContent = "";

  const now = new Date();
  const time = now.toLocaleTimeString("ko-KR", {
    hour: "2-digit", minute: "2-digit"
  });

  const messageData = {
    name: nickname,
    text,
    time,
    timestamp: firebase.database.ServerValue.TIMESTAMP,
    replyTo: selectedReply ? { ...selectedReply } : null
  };

  try {
    await messagesRef.push(messageData);
    input.value = "";
    input.style.height = "auto";
    clearReply();
    mentionList.style.display = "none";
  } catch (error) {
    notice.textContent = "전송 실패: " + error.message;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

// @멘션 자동완성
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
  updateMentionList();
});

function updateMentionList() {
  const cursor = input.selectionStart;
  const before = input.value.slice(0, cursor);
  const match = before.match(/@([\p{L}\p{N}_-]*)$/u);

  if (!match) {
    mentionList.style.display = "none";
    return;
  }

  const query = match[1].toLowerCase();
  const names = [...knownNames]
    .filter(name => name && name !== nickname && name.toLowerCase().includes(query))
    .slice(0, 6);

  mentionList.replaceChildren();

  if (!names.length) {
    mentionList.style.display = "none";
    return;
  }

  names.forEach(name => {
    const option = document.createElement("div");
    option.className = "mention-option";
    option.textContent = "@ " + name;
    option.addEventListener("click", () => {
      const start = cursor - match[0].length;
      const beforeText = input.value.slice(0, start);
      const afterText = input.value.slice(cursor);
      input.value = beforeText + "@" + name + " " + afterText;
      const nextCursor = (beforeText + "@" + name + " ").length;
      input.focus();
      input.setSelectionRange(nextCursor, nextCursor);
      mentionList.style.display = "none";
    });
    mentionList.append(option);
  });

  mentionList.style.display = "block";
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
  if (e.key === "Escape") {
    mentionList.style.display = "none";
    clearReply();
  }
});

document.addEventListener("click", e => {
  if (!mentionList.contains(e.target) && e.target !== input) {
    mentionList.style.display = "none";
  }
});

// 밝은 테마 / 어두운 테마
document.getElementById("theme-toggle").addEventListener("click", () => {
  document.body.classList.toggle("light");
  localStorage.setItem(
    "axion_theme",
    document.body.classList.contains("light") ? "light" : "dark"
  );
});

if (localStorage.getItem("axion_theme") === "light") {
  document.body.classList.add("light");
}

// 배경 입자 애니메이션
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let particles = [];

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  particles = Array.from({ length: Math.min(55, Math.floor(window.innerWidth / 18)) }, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    vx: (Math.random() - .5) * .35,
    vy: (Math.random() - .5) * .35,
    r: Math.random() * 1.5 + .5
  }));
}

function animateParticles() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#478bff";

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0 || p.x > w) p.vx *= -1;
    if (p.y < 0 || p.y > h) p.vy *= -1;

    ctx.globalAlpha = .45;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.globalAlpha = 1;
  requestAnimationFrame(animateParticles);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
animateParticles();
</script>
</body>
</html>
