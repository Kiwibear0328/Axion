
<!-- 아래 코드는 직전 Axion 전체 코드의 카테고리 관리 부분에 적용할 수정본이야. -->
<script type="module">
// 기존 Firebase 초기화 및 변수 선언은 그대로 유지해.

// 카테고리 목록 렌더링
function renderCategories() {
  const list = $("category-list");
  list.replaceChildren();

  Object.entries(categories).forEach(([id, category]) => {
    const row = document.createElement("div");
    row.className = "category-row";

    const select = document.createElement("button");
    select.className = "category-select" + (id === currentCategory ? " active" : "");

    const dot = document.createElement("span");
    dot.className = "category-dot";

    const label = document.createElement("span");
    label.textContent = category.name || "새 카테고리";

    select.append(dot, label);
    select.addEventListener("click", () => switchCategory(id));
    row.appendChild(select);

    // 관리자에게만 수정 및 삭제 버튼 표시
    if (isAdmin) {
      const actions = document.createElement("div");
      actions.className = "category-actions";

      const edit = document.createElement("button");
      edit.textContent = "✎";
      edit.title = "카테고리 수정";
      edit.addEventListener("click", () => editCategory(id));

      const del = document.createElement("button");
      del.textContent = "×";
      del.title = "카테고리 삭제";
      del.className = "delete-category";
      del.addEventListener("click", () => deleteCategory(id));

      actions.append(edit, del);
      row.appendChild(actions);
    }

    list.appendChild(row);
  });

  $("add-category").style.display = isAdmin ? "block" : "none";
}

// 카테고리 수정
async function editCategory(id) {
  if (!isAdmin) return;

  const oldName = categoryName(id);
  const name = prompt("변경할 카테고리 이름을 입력하세요.", oldName);

  if (!name || !name.trim()) return;

  try {
    await update(ref(db, "categories/" + id), {
      name: name.trim()
    });

    toast("카테고리 이름을 수정했어요.");
  } catch (error) {
    console.error(error);
    toast("카테고리 수정에 실패했어요.");
  }
}

// 카테고리 삭제
async function deleteCategory(id) {
  if (!isAdmin) return;

  if (Object.keys(categories).length <= 1) {
    toast("마지막 카테고리는 삭제할 수 없어요.");
    return;
  }

  if (!confirm(`'${categoryName(id)}' 카테고리를 삭제할까요?`)) return;

  try {
    await remove(ref(db, "categories/" + id));
    await remove(ref(db, "categoryMessages/" + id));

    toast("카테고리를 삭제했어요.");
  } catch (error) {
    console.error(error);
    toast("카테고리 삭제에 실패했어요.");
  }
}

// 관리자 로그인 성공 부분에도 이 코드를 포함해야 해.
isAdmin = true;
$("admin-modal").classList.remove("open");
$("admin-logout").style.display = "inline-grid";
renderCategories();
toast("관리자 모드가 활성화됐어요.");
</script>
