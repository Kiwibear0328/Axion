
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axion</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

:root {
  --bg:#080808;
  --panel:rgba(17,17,17,.88);
  --panel2:#151515;
  --text:#f5f5f5;
  --muted:#858585;
  --line:#292929;
  --accent:#8b6cff;
  --accent2:#477bff;
  --bubble:#202020;
  --mine:#29213e;
  --hover:#222;
  --shadow:0 15px 50px #0008;
}
body.light {
  --bg:#f4f4f8;
  --panel:rgba(255,255,255,.88);
  --panel2:#fff;
  --text:#171717;
  --muted:#777;
  --line:#dedee8;
  --accent:#7957e8;
  --accent2:#477bff;
  --bubble:#ededf4;
  --mine:#e9e2ff;
  --hover:#eeeef5;
  --shadow:0 15px 50px #3332;
}
*{box-sizing:border-box}
body{
  margin:0;
  height:100dvh;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Pretendard,Arial,sans-serif;
  transition:background .3s,color .3s;
}
button,input{font:inherit}
button{cursor:pointer}
#particles{
  position:fixed;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
}
.grid{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-size:40px 40px;
  background-image:
    linear-gradient(to right,rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(255,255,255,.035) 1px,transparent 1px);
}
body.light .grid{
  background-image:
    linear-gradient(to right,rgba(0,0,0,.045) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(0,0,0,.045) 1px,transparent 1px);
}
.app{
  position:relative;z-index:2;
  display:flex;gap:14px;
  height:100dvh;padding:16px;
  max-width:1600px;margin:auto;
}
.sidebar,.main{
  background:var(--panel);
  border:1px solid var(--line);
  backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
  border-radius:19px;
  min-height:0;
}
.sidebar{
  width:250px;flex:none;
  padding:15px;
  display:flex;flex-direction:column;gap:14px;
}
.brand{
  display:flex;align-items:center;gap:11px;
  padding:5px 3px 13px;
  border-bottom:1px solid var(--line);
}
.logo{
  width:39px;height:39px;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;font-size:22px;font-weight:900;
  box-shadow:0 0 25px #896cff44;
}
.brand-name{font-size:21px;font-weight:900;letter-spacing:1px}
.brand-sub{font-size:10px;color:var(--muted);margin-top:3px}
.section-head{
  display:flex;justify-content:space-between;align-items:center;
  color:var(--muted);font-size:11px;font-weight:700;
  letter-spacing:1px;padding:0 3px;
}
.icon-btn{
  width:33px;height:33px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel2);
  color:var(--text);font-size:16px;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.channel-list{display:flex;flex-direction:column;gap:5px;overflow:auto}
.channel{
  width:100%;display:flex;align-items:center;gap:9px;
  padding:9px;border:1px solid transparent;
  border-radius:10px;background:transparent;
  color:var(--muted);text-align:left;
}
.channel:hover{background:var(--hover);color:var(--text)}
.channel.active{
  color:var(--text);background:linear-gradient(90deg,#896cff24,transparent);
  border-color:#896cff44;
}
.channel-icon{
  width:29px;height:29px;border-radius:9px;
  display:grid;place-items:center;
  color:var(--accent);background:#896cff18;flex:none;
}
.channel-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:13px}
.channel-count{font-size:10px;color:var(--muted)}
.sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.theme-button{
  width:100%;padding:10px 12px;
  background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;color:var(--text);text-align:left;
}
.profile{
  border-top:1px solid var(--line);padding-top:12px;
  display:flex;align-items:center;gap:8px;
}
.avatar{
  width:35px;height:35px;flex:none;border-radius:11px;
  display:grid;place-items:center;color:white;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}
.profile-info{min-width:0;flex:1}
.profile-name{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.profile-status{font-size:10px;color:#43c99a;margin-top:4px}
.profile-actions{display:flex;gap:4px}
.profile-actions button{width:29px;height:29px;font-size:14px}
.main{
  flex:1;min-width:0;display:flex;flex-direction:column;
  overflow:hidden;position:relative;
}
.topbar{
  min-height:67px;padding:12px 18px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);gap:10px;
}
.room-info{display:flex;align-items:center;gap:11px;min-width:0}
.room-hash{
  width:38px;height:38px;border-radius:11px;
  background:#896cff19;color:var(--accent);
  display:grid;place-items:center;font-size:21px;
}
.room-title{font-size:15px;font-weight:800}
.room-subtitle{font-size:10px;color:var(--muted);margin-top:4px}
.online{
  color:#42c995;font-size:11px;
  border:1px solid #42c99533;background:#42c9950d;
  border-radius:30px;padding:8px 11px;white-space:nowrap;
}
.messages{
  flex:1;min-height:0;overflow-y:auto;
  padding:20px;display:flex;flex-direction:column;gap:16px;
  scroll-behavior:smooth;
}
.empty{
  margin:auto;text-align:center;color:var(--muted);
  font-size:13px;line-height:1.8;padding:20px;
}
.message-row{display:flex;gap:9px;max-width:100%;align-items:flex-start}
.message-row.mine{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{
  width:34px;height:34px;border-radius:11px;flex:none;
  display:grid;place-items:center;color:white;font-size:12px;font-weight:800;
  background:linear-gradient(135deg,#777,var(--accent));
}
.message-body{min-width:0;max-width:min(75%,650px)}
.message-row.mine .message-body{text-align:right}
.meta{display:flex;align-items:center;gap:7px;margin:2px 0 6px;font-size:11px}
.message-row.mine .meta{justify-content:flex-end}
.author{font-weight:800}
.time,.edited{font-size:10px;color:var(--muted)}
.bubble{
  display:inline-block;text-align:left;
  max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;
  padding:10px 13px;border-radius:4px 14px 14px 14px;
  background:var(--bubble);font-size:13px;line-height:1.6;
  border:1px solid var(--line);
}
.message-row.mine .bubble{
  background:var(--mine);border-radius:14px 4px 14px 14px;
  border-color:#896cff33;
}
.reply-quote{
  display:block;text-align:left;font-size:11px;
  color:var(--muted);padding:7px 9px;margin-bottom:6px;
  border-left:2px solid var(--accent);background:var(--hover);
  border-radius:5px;overflow-wrap:anywhere;
}
.mention{
  color:#b7a4ff;background:#896cff25;
  border-radius:4px;padding:1px 3px;font-weight:700;
}
.message-actions{
  display:flex;gap:5px;margin-top:5px;
  opacity:.7;flex-wrap:wrap;
}
.message-row.mine .message-actions{justify-content:flex-end}
.message-actions button{
  font-size:10px;color:var(--muted);
  border:1px solid var(--line);background:var(--panel2);
  padding:4px 8px;border-radius:7px;
}
.message-actions button:hover{color:var(--accent);border-color:var(--accent)}
.composer-area{padding:12px 18px 16px;border-top:1px solid var(--line)}
.reply-preview{
  display:none;align-items:center;gap:10px;
  background:var(--hover);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;margin-bottom:9px;
  font-size:11px;color:var(--muted);
}
.reply-preview.show{display:flex}
.reply-preview span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer-wrap{position:relative}
.composer{
  display:flex;align-items:center;gap:9px;
  padding:6px 7px 6px 14px;
  border:1px solid var(--line);border-radius:14px;
  background:var(--panel2);transition:border .2s;
}
.composer:focus-within{border-color:var(--accent)}
.composer input{
  flex:1;min-width:0;background:transparent;border:0;outline:0;
  color:var(--text);font-size:13px;padding:11px 0;
}
.send{
  width:40px;height:40px;border:0;border-radius:11px;
  color:white;font-size:18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}
.send:hover{filter:brightness(1.15)}
.mention-box{
  display:none;position:absolute;bottom:62px;left:0;right:0;
  max-height:190px;overflow:auto;z-index:10;
  background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:6px;box-shadow:var(--shadow);
}
.mention-option{
  width:100%;padding:9px;border:0;border-radius:8px;
  background:transparent;color:var(--text);text-align:left;
}
.mention-option:hover{background:var(--hover)}
/* Modal */
.modal-backdrop{
  display:none;position:fixed;inset:0;z-index:100;
  background:#0009;backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:16px;
}
.modal-backdrop.show{display:flex}
.modal{
  width:min(390px,100%);padding:21px;
  background:var(--panel2);border:1px solid var(--line);
  border-radius:17px;box-shadow:var(--shadow);
}
.modal h2{font-size:17px;margin:0 0 14px}
.modal-content{font-size:13px;color:var(--muted);line-height:1.6}
.modal-content input{
  width:100%;margin-top:8px;padding:12px;
  border-radius:9px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);outline:none;
}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal-actions button{
  border:1px solid var(--line);border-radius:9px;
  padding:9px 13px;background:var(--hover);color:var(--text);
}
.modal-actions .primary{background:var(--accent);color:white;border-color:var(--accent)}
.modal-actions .danger{background:#a8324a;color:white;border-color:#a8324a}
.toast-area{
  position:fixed;right:16px;top:16px;z-index:200;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:12px 15px;
  font-size:12px;box-shadow:var(--shadow);max-width:calc(100vw - 32px);
}
/* Nickname window */
.join-backdrop{
  position:fixed;inset:0;z-index:300;
  display:flex;align-items:center;justify-content:center;
  padding:18px;background:#000b;backdrop-filter:blur(10px);
}
.join-card{
  width:min(370px,100%);padding:30px;
  background:#111;border:1px solid #333;border-radius:19px;
  text-align:center;box-shadow:0 20px 80px #000;
}
.join-logo{
  width:54px;height:54px;border-radius:16px;
  display:grid;place-items:center;margin:0 auto 15px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;font-size:28px;font-weight:900;
}
.join-card h1{font-size:25px;margin:0}
.join-card p{font-size:12px;color:#888;margin:9px 0 20px}
.join-card input{
  width:100%;padding:13px;border:1px solid #383838;
  border-radius:10px;background:#1b1b1b;color:white;
  outline:none;margin-bottom:10px;
}
.join-card button{
  width:100%;padding:13px;border:0;border-radius:10px;
  color:white;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}
[hidden]{display:none!important}
@media(max-width:760px){
  .app{padding:7px;gap:7px}
  .sidebar{width:66px;padding:10px 5px}
  .brand{justify-content:center;padding:2px 0 12px}
  .brand-name,.brand-sub,.section-head span,.channel-name,.channel-count,
  .profile-info,.theme-label{display:none}
  .section-head{justify-content:center}
  .channel{justify-content:center;padding:6px}
  .channel-icon{width:39px;height:39px}
  .sidebar-bottom{gap:7px}
  .profile{justify-content:center;flex-wrap:wrap}
  .profile-actions{width:100%;justify-content:center;flex-wrap:wrap}
  .profile-actions button{width:25px;height:25px}
  .theme-button{text-align:center;padding:9px 2px}
  .topbar{min-height:60px;padding:9px 11px}
  .messages{padding:12px 8px;gap:13px}
  .message-body{max-width:calc(100vw - 125px)}
  .composer-area{padding:9px 8px max(10px,env(safe-area-inset-bottom))}
}
@media(max-width:420px){
  .app{padding:4px;gap:4px}
  .sidebar{width:52px;padding:8px 3px}
  .channel-icon{width:35px;height:35px}
  .profile-actions{gap:2px}
  .profile-actions button{width:22px;height:22px;font-size:12px}
  .avatar{width:30px;height:30px}
  .main{border-radius:13px}
  .messages{padding:9px 5px}
  .message-body{max-width:calc(100vw - 100px)}
  .online{font-size:9px;padding:6px 7px}
  .room-hash{width:32px;height:32px}
  .composer-area{padding-left:6px;padding-right:6px}
}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="grid"></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">A</div>
      <div>
        <div class="brand-name">AXION</div>
        <div class="brand-sub">REALTIME COMMUNITY</div>
      </div>
    </div>

    <div class="section-head">
      <span>CHANNELS</span>
      <button class="icon-btn" id="addCategory" title="카테고리 추가">＋</button>
    </div>

    <div class="channel-list" id="categoryList">
      <div class="empty">불러오는 중...</div>
    </div>

    <div class="sidebar-bottom">
      <button class="theme-button" id="themeButton">☀ <span class="theme-label">라이트 모드</span></button>
      <div class="profile">
        <div class="avatar" id="profileAvatar">A</div>
        <div class="profile-info">
          <div class="profile-name" id="profileName">사용자</div>
          <div class="profile-status">● 온라인</div>
        </div>
        <div class="profile-actions">
          <button class="icon-btn" id="profileEdit" title="프로필 수정">✎</button>
          <button class="icon-btn" id="adminButton" title="관리자">⚙</button>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="room-info">
        <div class="room-hash">#</div>
        <div>
          <div class="room-title" id="roomTitle">채널</div>
          <div class="room-subtitle">AXION COMMUNITY CHAT</div>
        </div>
      </div>
      <div class="online" id="onlineCount">● 접속자 0명</div>
    </header>

    <section class="messages" id="messages">
      <div class="empty">채널을 선택해 대화를 시작해 보세요.</div>
    </section>

    <div class="composer-area">
      <div class="reply-preview" id="replyPreview">
        <span id="replyText"></span>
        <button class="icon-btn" id="cancelReply">×</button>
      </div>
      <div class="composer-wrap">
        <div class="mention-box" id="mentionBox"></div>
        <form class="composer" id="messageForm">
          <input id="messageInput" maxlength="2000"
            placeholder="메시지를 입력하세요... (@로 멘션)"
            autocomplete="off" required>
          <button class="send" type="submit">➤</button>
        </form>
      </div>
    </div>
  </main>
</div>

<div class="join-backdrop" id="joinBackdrop">
  <div class="join-card">
    <div class="join-logo">A</div>
    <h1>AXION</h1>
    <p>친구들과 함께 대화를 시작해 보세요.</p>
    <input id="nicknameInput" maxlength="20" placeholder="닉네임 (최대 20자)">
    <button id="joinButton">채팅 시작하기</button>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">알림</h2>
    <div class="modal-content" id="modalContent"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<div class="toast-area" id="toastArea"></div>

<script>
/* Firebase 설정 */
const firebaseConfig = {
  apiKey: "AIzaSyAf-nM5PJRUo2q7TvX2LeZNKxh8A021bck",
  authDomain: "chat-27c50.firebaseapp.com",
  databaseURL: "https://chat-27c50-default-rtdb.firebaseio.com",
  projectId: "chat-27c50",
  storageBucket: "chat-27c50.firebasestorage.app",
  messagingSenderId: "811770063187",
  appId: "1:811770063187:web:ba17f4f49ebb682c9cd9a6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const $ = id => document.getElementById(id);

const ADMIN_PASSWORD = "KB0328";
const uid = sessionStorage.getItem("axionSession") ||
  ("u_" + Math.random().toString(36).slice(2) + Date.now().toString(36));
sessionStorage.setItem("axionSession", uid);

let nickname = localStorage.getItem("axionNickname") || "";
let activeCategory = "";
let categories = {};
let messages = {};
let people = {};
let replyTo = null;
let isAdmin = false;

let stopCategories = null;
let stopMessages = null;
let stopPeople = null;
let currentPresenceRef = null;

const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
}[c]));

function toast(message) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = message;
  $("toastArea").append(el);
  setTimeout(() => el.remove(), 2800);
}

function closeModal() {
  $("modalBackdrop").classList.remove("show");
}

function showModal(title, html, buttons) {
  $("modalTitle").textContent = title;
  $("modalContent").innerHTML = html;
  $("modalActions").replaceChildren();

  buttons.forEach(item => {
    const button = document.createElement("button");
    button.textContent = item.label;
    if (item.kind) button.classList.add(item.kind);
    button.onclick = item.run;
    $("modalActions").append(button);
  });

  $("modalBackdrop").classList.add("show");
}

function askText(title, label, initial, callback) {
  showModal(title,
    `<label>${esc(label)}<input id="modalInput" maxlength="200" value="${esc(initial || "")}"></label>`,
    [
      {label:"취소", run:closeModal},
      {label:"저장", kind:"primary", run:() => {
        const value = $("modalInput").value.trim();
        if (!value) return toast("내용을 입력해 줘.");
        closeModal();
        callback(value);
      }}
    ]
  );
  setTimeout(() => $("modalInput")?.focus(), 50);
}

function confirmAction(title, message, callback) {
  showModal(title, `<p>${esc(message)}</p>`, [
    {label:"취소", run:closeModal},
    {label:"삭제", kind:"danger", run:() => {
      closeModal();
      callback();
    }}
  ]);
}

$("modalBackdrop").addEventListener("click", e => {
  if (e.target === $("modalBackdrop")) closeModal();
});

/* 프로필 및 닉네임 */
function setNickname(name) {
  nickname = name;
  localStorage.setItem("axionNickname", name);
  $("profileName").textContent = name;
  $("profileAvatar").textContent = name.slice(0, 1).toUpperCase();
}

function join() {
  const name = $("nicknameInput").value.trim();
  if (!name) return toast("먼저 닉네임을 입력해 줘.");
  setNickname(name);
  $("joinBackdrop").hidden = true;
  startApp();
}

$("joinButton").onclick = join;
$("nicknameInput").addEventListener("keydown", e => {
  if (e.key === "Enter") join();
});

if (nickname) {
  $("nicknameInput").value = nickname;
  setNickname(nickname);
  $("joinBackdrop").hidden = true;
  startApp();
}

/* 카테고리 */
function startApp() {
  if (stopCategories) stopCategories();

  stopCategories = db.ref("categories").on("value", snapshot => {
    categories = snapshot.val() || {};

    if (!Object.keys(categories).length) {
      createFirstCategory();
      renderCategories();
      return;
    }

    if (!activeCategory || !categories[activeCategory]) {
      activeCategory = Object.keys(categories)[0];
    }

    renderCategories();
    switchCategory(activeCategory);
  }, error => {
    toast("카테고리를 불러오지 못했어요: " + error.message);
  });
}

let creatingFirst = false;

async function createFirstCategory() {
  if (creatingFirst) return;
  creatingFirst = true;

  try {
    const newRef = db.ref("categories").push();
    await newRef.set({
      name:"일반",
      createdAt:firebase.database.ServerValue.TIMESTAMP
    });
    activeCategory = newRef.key;
  } catch (error) {
    toast("기본 카테고리 생성 실패: " + error.message);
  } finally {
    creatingFirst = false;
  }
}

function renderCategories() {
  const list = $("categoryList");
  list.replaceChildren();

  Object.entries(categories).forEach(([id, category]) => {
    const button = document.createElement("button");
    button.className = "channel" + (id === activeCategory ? " active" : "");
    button.innerHTML =
      `<span class="channel-icon">#</span>
       <span class="channel-name">${esc(category.name || "이름 없음")}</span>`;

    button.onclick = () => {
      if (activeCategory === id) {
        categoryMenu(id);
        return;
      }
      activeCategory = id;
      renderCategories();
      switchCategory(id);
    };

    button.oncontextmenu = e => {
      e.preventDefault();
      categoryMenu(id);
    };

    list.append(button);
  });
}

function categoryMenu(id) {
  showModal("카테고리 관리",
    `<p>${esc(categories[id]?.name || "")}</p>`,
    [
      {label:"닫기", run:closeModal},
      {label:"이름 수정", kind:"primary", run:() => editCategory(id)},
      {label:"삭제", kind:"danger", run:() => deleteCategory(id)}
    ]
  );
}

function editCategory(id) {
  askText("카테고리 이름 수정", "새 카테고리 이름",
    categories[id]?.name || "", async name => {
      try {
        await db.ref("categories/" + id).update({
          name,
          updatedAt:firebase.database.ServerValue.TIMESTAMP
        });
        toast("카테고리 이름을 수정했어요.");
      } catch (error) {
        toast("수정 실패: " + error.message);
      }
    }
  );
}

function deleteCategory(id) {
  if (Object.keys(categories).length <= 1) {
    return toast("마지막 카테고리는 삭제할 수 없어요.");
  }

  confirmAction("카테고리 삭제",
    "이 카테고리와 안에 있는 모든 메시지를 삭제할까요?",
    async () => {
      try {
        await db.ref("categoryMessages/" + id).remove();
        await db.ref("presence/" + id).remove();
        await db.ref("categories/" + id).remove();

        if (activeCategory === id) activeCategory = "";
        toast("카테고리를 삭제했어요.");
      } catch (error) {
        toast("삭제 실패: " + error.message);
      }
    }
  );
}

$("addCategory").onclick = () => {
  askText("카테고리 추가", "카테고리 이름", "", async name => {
    try {
      const newRef = db.ref("categories").push();
      await newRef.set({
        name,
        createdAt:firebase.database.ServerValue.TIMESTAMP
      });
      activeCategory = newRef.key;
      toast("카테고리를 추가했어요.");
    } catch (error) {
      toast("추가 실패: " + error.message);
    }
  });
};

/* 채널 전환 및 접속자 */
async function switchCategory(id) {
  if (!id) return;

  if (stopMessages) stopMessages();
  if (stopPeople) stopPeople();

  if (currentPresenceRef) {
    await currentPresenceRef.remove().catch(() => {});
  }

  activeCategory = id;
  messages = {};
  people = {};
  replyTo = null;

  renderReply();
  renderOnline();

  $("roomTitle").textContent = categories[id]?.name || "채널";
  $("messages").innerHTML = '<div class="empty">메시지를 불러오는 중...</div>';

  stopMessages = db.ref("categoryMessages/" + id).on("value", snapshot => {
    messages = snapshot.val() || {};
    renderMessages();
  }, error => toast("메시지 읽기 실패: " + error.message));

  currentPresenceRef = db.ref(`presence/${id}/${uid}`);

  currentPresenceRef.onDisconnect().remove();
  currentPresenceRef.set({
    name:nickname,
    joinedAt:firebase.database.ServerValue.TIMESTAMP
  }).catch(error => {
    toast("접속자 등록 실패: " + error.message);
  });

  stopPeople = db.ref("presence/" + id).on("value", snapshot => {
    people = snapshot.val() || {};
    renderOnline();
    if ($("messageInput").value.includes("@")) showMentions();
  }, error => toast("접속자 목록 실패: " + error.message));
}

function renderOnline() {
  $("onlineCount").textContent = "● 접속자 " + Object.keys(people).length + "명";
}

/* 메시지 표시 */
function formatMessage(text) {
  return esc(text).replace(
    /(^|\s)@([\p{L}\p{N}_-]{1,20})/gu,
    '$1<span class="mention">@$2</span>'
  );
}

function renderMessages() {
  const box = $("messages");
  box.replaceChildren();

  const entries = Object.entries(messages).sort(
    (a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0)
  );

  if (!entries.length) {
    box.innerHTML = '<div class="empty">아직 메시지가 없어요.<br>첫 메시지를 보내 보세요!</div>';
    return;
  }

  entries.forEach(([id, message]) => {
    const mine = message.uid === uid;
    const row = document.createElement("div");
    row.className = "message-row" + (mine ? " mine" : "");

    const reply = message.replyText
      ? `<div class="reply-quote">↳ ${esc(message.replyName || "")}: ${esc(message.replyText)}</div>`
      : "";

    row.innerHTML = `
      <div class="msg-avatar">${esc((message.name || "?").slice(0, 1))}</div>
      <div class="message-body">
        <div class="meta">
          <span class="author">${esc(message.name || "익명")}</span>
          <span class="time">${new Date(message.createdAt || Date.now()).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</span>
          ${message.edited ? '<span class="edited">수정됨</span>' : ""}
        </div>
        ${reply}
        <div class="bubble">${formatMessage(message.text || "")}</div>
        <div class="message-actions">
          <button data-action="reply">답장</button>
          ${mine ? '<button data-action="edit">수정</button>' : ""}
          ${(mine || isAdmin) ? '<button data-action="delete">삭제</button>' : ""}
        </div>
      </div>
    `;

    row.querySelector('[data-action="reply"]').onclick = () => setReply(id, message);
    row.querySelector('[data-action="edit"]')?.addEventListener("click", () => editMessage(id, message));
    row.querySelector('[data-action="delete"]')?.addEventListener("click", () => deleteMessage(id));

    let startX = 0;
    row.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
    }, {passive:true});

    row.addEventListener("touchend", e => {
      if (e.changedTouches[0].clientX - startX > 65) {
        setReply(id, message);
      }
    }, {passive:true});

    box.append(row);
  });

  box.scrollTop = box.scrollHeight;
}

/* 답장 */
function setReply(id, message) {
  replyTo = {
    id,
    name:message.name || "익명",
    text:message.text || ""
  };
  renderReply();
  $("messageInput").focus();
}

function renderReply() {
  $("replyPreview").classList.toggle("show", !!replyTo);
  $("replyText").textContent = replyTo
    ? "답장 대상: " + replyTo.name + " - " + replyTo.text
    : "";
}

$("cancelReply").onclick = () => {
  replyTo = null;
  renderReply();
};

/* 메시지 수정 및 삭제 */
function editMessage(id, message) {
  if (message.uid !== uid && !isAdmin) {
    return toast("본인이 보낸 메시지만 수정할 수 있어요.");
  }

  askText("메시지 수정", "메시지 내용", message.text || "", async text => {
    try {
      await db.ref(`categoryMessages/${activeCategory}/${id}`).update({
        text,
        edited:true,
        editedAt:firebase.database.ServerValue.TIMESTAMP
      });
      toast("메시지를 수정했어요.");
    } catch (error) {
      toast("수정 실패: " + error.message);
    }
  });
}

function deleteMessage(id) {
  confirmAction("메시지 삭제", "이 메시지를 삭제할까요?", async () => {
    try {
      await db.ref(`categoryMessages/${activeCategory}/${id}`).remove();
      toast("메시지를 삭제했어요.");
    } catch (error) {
      toast("삭제 실패: " + error.message);
    }
  });
}

/* 메시지 전송 */
$("messageForm").addEventListener("submit", async e => {
  e.preventDefault();

  const input = $("messageInput");
  const text = input.value.trim();

  if (!text || !activeCategory) return;

  const data = {
    uid,
    name:nickname,
    text,
    createdAt:Date.now()
  };

  if (replyTo) {
    data.replyTo = replyTo.id;
    data.replyName = replyTo.name;
    data.replyText = replyTo.text.slice(0, 180);
  }

  try {
    await db.ref("categoryMessages/" + activeCategory).push(data);
    input.value = "";
    replyTo = null;
    renderReply();
    hideMentions();
    input.focus();
  } catch (error) {
    toast("전송 실패: Firebase 규칙을 확인해 주세요.");
  }
});

/* 프로필 수정 */
$("profileEdit").onclick = () => {
  askText("프로필 수정", "새 닉네임", nickname, async name => {
    setNickname(name);

    if (currentPresenceRef) {
      await currentPresenceRef.update({name}).catch(() => {});
    }

    toast("닉네임을 변경했어요.");
  });
};

/* 관리자 */
$("adminButton").onclick = () => {
  showModal("관리자 인증",
    '<label>관리자 비밀번호<input id="adminPassword" type="password"></label>',
    [
      {label:"취소", run:closeModal},
      {label:"확인", kind:"primary", run:() => {
        if ($("adminPassword").value === ADMIN_PASSWORD) {
          isAdmin = true;
          closeModal();
          renderMessages();
          toast("관리자 모드가 활성화됐어요.");
        } else {
          toast("비밀번호가 올바르지 않아요.");
        }
      }}
    ]
  );
};

/* 다크 모드 / 라이트 모드 */
function applyTheme(light) {
  document.body.classList.toggle("light", light);
  localStorage.setItem("axionTheme", light ? "light" : "dark");
  $("themeButton").innerHTML = light
    ? '☾ <span class="theme-label">다크 모드</span>'
    : '☀ <span class="theme-label">라이트 모드</span>';
}

applyTheme(localStorage.getItem("axionTheme") === "light");

$("themeButton").onclick = () => {
  applyTheme(!document.body.classList.contains("light"));
};

/* @멘션 */
const mentionBox = $("mentionBox");
const messageInput = $("messageInput");

function hideMentions() {
  mentionBox.style.display = "none";
  mentionBox.replaceChildren();
}

function showMentions() {
  const cursor = messageInput.selectionStart;
  const before = messageInput.value.slice(0, cursor);
  const match = before.match(/(^|\s)@([^\s@]*)$/);

  if (!match) {
    hideMentions();
    return;
  }

  const query = match[2].toLowerCase();
  const matches = Object.entries(people).filter(([id, person]) =>
    (person.name || "").toLowerCase().includes(query)
  );

  mentionBox.replaceChildren();

  if (!matches.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "현재 접속 중인 사용자가 없어요.";
    mentionBox.append(empty);
  }

  matches.forEach(([id, person]) => {
    const button = document.createElement("button");
    button.className = "mention-option";
    button.textContent = "● " + person.name;

    button.onclick = () => {
      const start = cursor - match[2].length - 1;
      const value = messageInput.value;

      messageInput.value =
        value.slice(0, start) + "@" + person.name + " " + value.slice(cursor);

      const position = start + person.name.length + 2;
      messageInput.setSelectionRange(position, position);

      hideMentions();
      messageInput.focus();
    };

    mentionBox.append(button);
  });

  mentionBox.style.display = "block";
}

messageInput.addEventListener("input", showMentions);
messageInput.addEventListener("click", showMentions);
messageInput.addEventListener("keyup", e => {
  if (e.key === "Escape") hideMentions();
  else showMentions();
});

document.addEventListener("click", e => {
  if (!mentionBox.contains(e.target) && e.target !== messageInput) {
    hideMentions();
  }
});

/* 배경 입자 효과 */
const canvas = $("particles");
const ctx = canvas.getContext("2d");
let particles = [];

function resizeCanvas() {
  const ratio = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * ratio;
  canvas.height = window.innerHeight * ratio;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}

class Particle {
  constructor() { this.reset(); }

  reset() {
    this.x = Math.random() * window.innerWidth;
    this.y = Math.random() * window.innerHeight;
    this.vx = (Math.random() - .5) * .35;
    this.vy = (Math.random() - .5) * .35;
    this.size = Math.random() * 1.5 + .5;
    this.alpha = Math.random() * .4 + .1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;

    if (this.x < 0 || this.x > window.innerWidth ||
        this.y < 0 || this.y > window.innerHeight) {
      this.reset();
    }
  }

  draw() {
    const light = document.body.classList.contains("light");
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = light
      ? `rgba(80,70,130,${this.alpha})`
      : `rgba(255,255,255,${this.alpha})`;
    ctx.fill();
  }
}

function initParticles() {
  particles = [];
  const count = Math.min(80, Math.floor(window.innerWidth / 15));
  for (let i = 0; i < count; i++) particles.push(new Particle());
}

function animateParticles() {
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  particles.forEach(particle => {
    particle.update();
    particle.draw();
  });
  requestAnimationFrame(animateParticles);
}

resizeCanvas();
initParticles();
animateParticles();
window.addEventListener("resize", () => {
  resizeCanvas();
  initParticles();
});

/* 접속 종료 처리 */
window.addEventListener("beforeunload", () => {
  if (currentPresenceRef) currentPresenceRef.remove();
});
</script>
