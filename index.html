
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axion</title>

<style>
:root {
  --bg: #f5f3ff;
  --panel: rgba(255,255,255,.88);
  --text: #28243a;
  --muted: #8b879d;
  --border: #e9e4f5;
  --accent: #8b72ef;
  --bubble: #f0edff;
}

body.dark {
  --bg: #141321;
  --panel: #201e31;
  --text: #f2efff;
  --muted: #aaa4c3;
  --border: #353149;
  --accent: #a28bff;
  --bubble: #302b48;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: linear-gradient(135deg, var(--bg), #eae5ff);
  color: var(--text);
  font-size: 13px;
}

body.dark {
  background: linear-gradient(135deg, #141321, #211b38);
}

button, input { font: inherit; }
button { cursor: pointer; }

.app {
  display: flex;
  height: 100vh;
  max-width: 1500px;
  margin: auto;
  padding: 14px;
  gap: 14px;
}

.sidebar {
  width: 220px;
  min-width: 190px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px 13px;
  display: flex;
  flex-direction: column;
}

.logo {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -1px;
  padding: 5px 9px 25px;
  background: linear-gradient(90deg,#9d78ff,#6a9aff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.section-label {
  font-size: 10px;
  color: var(--muted);
  font-weight: 700;
  padding: 8px 10px;
  letter-spacing: 1px;
}

.channel-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.channel {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 10px;
  text-align: left;
  border-radius: 9px;
  font-size: 12px;
}

.channel:hover, .channel.active {
  background: var(--bubble);
  color: var(--accent);
}

.sidebar-bottom {
  margin-top: auto;
  display: grid;
  gap: 8px;
}

.small-button {
  padding: 9px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel);
  color: var(--text);
  font-size: 11px;
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
}

.topbar {
  min-height: 65px;
  padding: 15px 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.room-title {
  font-size: 17px;
  font-weight: 750;
}

.room-subtitle {
  color: var(--muted);
  font-size: 10px;
  margin-top: 5px;
}

.top-actions {
  display: flex;
  gap: 7px;
}

.icon-button {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 9px;
  width: 34px;
  height: 34px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.empty {
  margin: auto;
  color: var(--muted);
  text-align: center;
  font-size: 12px;
}

.message {
  position: relative;
  max-width: 82%;
  align-self: flex-start;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 4px 13px 13px 13px;
  background: var(--panel);
  overflow-wrap: anywhere;
  touch-action: pan-y;
}

.message:hover { border-color: var(--accent); }

.message-head {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
}

.message-author {
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
}

.message-time {
  color: var(--muted);
  font-size: 9px;
}

.message-text {
  font-size: 12px;
  line-height: 1.55;
  white-space: pre-wrap;
}

.message-text .mention {
  color: var(--accent);
  font-weight: 700;
}

.reply-quote {
  border-left: 2px solid var(--accent);
  background: var(--bubble);
  padding: 6px 8px;
  margin-bottom: 7px;
  border-radius: 4px;
  color: var(--muted);
  font-size: 10px;
}

.message-actions {
  display: flex;
  justify-content: flex-end;
  gap: 5px;
  margin-top: 7px;
  opacity: .65;
}

.message-actions button {
  background: transparent;
  border: 0;
  color: var(--muted);
  font-size: 10px;
  padding: 2px;
}

.message-actions button:hover { color: var(--accent); }

.composer-area {
  padding: 12px 18px 16px;
  border-top: 1px solid var(--border);
}

.reply-preview {
  display: none;
  align-items: center;
  justify-content: space-between;
  background: var(--bubble);
  border-radius: 9px;
  padding: 8px 10px;
  margin-bottom: 9px;
  font-size: 10px;
  color: var(--muted);
}

.reply-preview.show { display: flex; }

.reply-preview button {
  background: none;
  border: 0;
  color: var(--text);
}

.composer {
  display: flex;
  gap: 9px;
  align-items: center;
  padding: 7px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--bg);
}

.composer input {
  min-width: 0;
  flex: 1;
  background: transparent;
  border: 0;
  outline: none;
  padding: 8px;
  color: var(--text);
  font-size: 12px;
}

.send-button {
  border: 0;
  border-radius: 9px;
  background: linear-gradient(135deg,#9c7bff,#758fff);
  color: white;
  padding: 9px 15px;
  font-size: 11px;
  font-weight: 700;
}

.status {
  padding: 7px 4px 0;
  color: var(--muted);
  font-size: 9px;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: #17132688;
  z-index: 10;
  padding: 15px;
}

.modal-backdrop.show { display: flex; }

.modal {
  width: 100%;
  max-width: 340px;
  background: var(--panel);
  color: var(--text);
  padding: 22px;
  border-radius: 16px;
  border: 1px solid var(--border);
}

.modal h3 { margin: 0 0 15px; font-size: 16px; }

.modal input {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  border-radius: 9px;
  margin: 6px 0 12px;
  outline-color: var(--accent);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 7px;
  margin-top: 14px;
}

.primary, .secondary, .danger {
  border: 0;
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 11px;
}

.primary { background: var(--accent); color: white; }
.secondary { background: var(--bubble); color: var(--text); }
.danger { background: #e74c68; color: white; }

@media (max-width: 600px) {
  .app { padding: 6px; gap: 6px; }
  .sidebar { width: 125px; min-width: 125px; padding: 12px 7px; }
  .logo { font-size: 20px; padding: 5px 4px 18px; }
  .topbar { padding: 12px; }
  .messages { padding: 12px; }
  .message { max-width: 95%; }
  .composer-area { padding: 9px; }
}
</style>
</head>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">Axion</div>
    <div class="section-label">WORKSPACE</div>
    <div class="channel-list" id="channelList"></div>

    <div class="sidebar-bottom">
      <button class="small-button" id="addChannel">＋ 채널 추가</button>
      <button class="small-button" id="themeButton">☾ 테마 변경</button>
      <button class="small-button" id="adminButton">⚙ 관리자</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="room-title" id="roomTitle"># general</div>
        <div class="room-subtitle">Axion 실시간 채팅</div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="clearButton" title="채널 메시지 전체 삭제" style="display:none">⌫</button>
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="empty">메시지를 불러오는 중...</div>
    </section>

    <div class="composer-area">
      <div class="reply-preview" id="replyPreview">
        <span id="replyText">답장</span>
        <button id="cancelReply">✕</button>
      </div>
      <form class="composer" id="messageForm">
        <input id="messageInput" maxlength="2000"
          placeholder="메시지를 입력하세요... (@이름으로 멘션)" autocomplete="off">
        <button class="send-button" type="submit">보내기</button>
      </form>
      <div class="status" id="status">Firebase 연결 중...</div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">Axion</h3>
    <div id="modalContent"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getDatabase, ref, push, set, onValue, remove
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAf-nM5PJRUo2q7TvX2LeZNKxh8A021bck",
  authDomain: "chat-27c50.firebaseapp.com",
  databaseURL: "https://chat-27c50-default-rtdb.firebaseio.com",
  projectId: "chat-27c50",
  storageBucket: "chat-27c50.firebasestorage.app",
  messagingSenderId: "811770063187",
  appId: "1:811770063187:web:ba17f4f49ebb682c9cd9a6"
};

const ADMIN_PASSWORD = "AxionAdmin2026!";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const $ = id => document.getElementById(id);

let currentChannel = "general";
let channels = { general: { name: "general" } };
let replyTo = null;
let isAdmin = false;
let messagesUnsubscribe = null;
let allMessages = {};

function escapeHTML(value = "") {
  return String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[c]);
}

function showModal(title, content, buttons) {
  $("modalTitle").textContent = title;
  $("modalContent").innerHTML = content;
  $("modalActions").innerHTML = "";

  buttons.forEach(item => {
    const button = document.createElement("button");
    button.className = item.className || "secondary";
    button.textContent = item.label;
    button.onclick = () => {
      if (item.action) item.action();
      if (item.close !== false) $("modalBackdrop").classList.remove("show");
    };
    $("modalActions").appendChild(button);
  });

  $("modalBackdrop").classList.add("show");
}

function closeModal() {
  $("modalBackdrop").classList.remove("show");
}

function renderChannels() {
  const list = $("channelList");
  list.innerHTML = "";

  Object.entries(channels).forEach(([id, channel]) => {
    const button = document.createElement("button");
    button.className = "channel" + (id === currentChannel ? " active" : "");
    button.textContent = "# " + (channel.name || id);
    button.onclick = () => switchChannel(id);
    list.appendChild(button);
  });
}

function listenChannels() {
  onValue(ref(db, "channels"), snapshot => {
    const remote = snapshot.val() || {};
    channels = { general: { name: "general" }, ...remote };
    renderChannels();
    $("status").textContent = "채널 연결됨";
  }, error => {
    $("status").textContent = "채널 오류: " + error.message;
  });
}

function switchChannel(id) {
  currentChannel = id;
  $("roomTitle").textContent = "# " + (channels[id]?.name || id);
  replyTo = null;
  updateReplyPreview();
  renderChannels();

  if (messagesUnsubscribe) messagesUnsubscribe();

  $("messages").innerHTML =
    '<div class="empty">메시지를 불러오는 중...</div>';

  messagesUnsubscribe = onValue(
    ref(db, "channelMessages/" + id),
    snapshot => {
      allMessages = snapshot.val() || {};
      renderMessages();
      $("status").textContent = "실시간 연결됨";
    },
    error => {
      $("status").textContent = "메시지 읽기 실패: " + error.message;
    }
  );
}

function renderMessageText(text) {
  return escapeHTML(text).replace(
    /(^|\s)@([a-zA-Z0-9가-힣_]+)/g,
    '$1<span class="mention">@$2</span>'
  );
}

function renderMessages() {
  const container = $("messages");
  const entries = Object.entries(allMessages)
    .sort((a, b) => (a[1].timestamp || 0) - (b[1].timestamp || 0));

  if (!entries.length) {
    container.innerHTML =
      '<div class="empty">아직 메시지가 없어.<br>첫 메시지를 보내 봐!</div>';
    return;
  }

  container.innerHTML = entries.map(([id, msg]) => {
    const time = msg.timestamp
      ? new Date(msg.timestamp).toLocaleTimeString("ko-KR", {
          hour: "2-digit", minute: "2-digit"
        })
      : "";

    let replyHTML = "";
    if (msg.replyTo) {
      const parent = allMessages[msg.replyTo];
      replyHTML = `
        <div class="reply-quote">
          ↳ ${escapeHTML(parent?.name || "메시지")}:
          ${escapeHTML(parent?.text || "원본 메시지")}
        </div>`;
    }

    return `
      <article class="message" data-id="${escapeHTML(id)}">
        <div class="message-head">
          <span class="message-author">${escapeHTML(msg.name || "사용자")}</span>
          <span class="message-time">${time}</span>
        </div>
        ${replyHTML}
        <div class="message-text">${renderMessageText(msg.text || "")}</div>
        <div class="message-actions">
          <button data-reply="${escapeHTML(id)}">↩ 답장</button>
          ${isAdmin
            ? `<button data-delete="${escapeHTML(id)}">삭제</button>`
            : ""}
        </div>
      </article>`;
  }).join("");

  container.querySelectorAll("[data-reply]").forEach(button => {
    button.onclick = () => {
      const id = button.dataset.reply;
      const msg = allMessages[id];
      if (!msg) return;
      replyTo = id;
      $("replyText").textContent =
        "답장: " + (msg.name || "사용자") + " — " + (msg.text || "");
      updateReplyPreview();
      $("messageInput").focus();
    };
  });

  container.querySelectorAll("[data-delete]").forEach(button => {
    button.onclick = () => deleteMessage(button.dataset.delete);
  });

  container.querySelectorAll(".message").forEach(element => {
    let startX = 0, startY = 0;
    element.addEventListener("touchstart", event => {
      startX = event.touches[0].clientX;
      startY = event.touches[0].clientY;
    }, { passive: true });

    element.addEventListener("touchend", event => {
      const dx = event.changedTouches[0].clientX - startX;
      const dy = event.changedTouches[0].clientY - startY;
      if (dx > 65 && Math.abs(dy) < 45) {
        const id = element.dataset.id;
        const msg = allMessages[id];
        if (!msg) return;
        replyTo = id;
        $("replyText").textContent =
          "답장: " + (msg.name || "사용자") + " — " + (msg.text || "");
        updateReplyPreview();
        $("messageInput").focus();
      }
    }, { passive: true });
  });

  container.scrollTop = container.scrollHeight;
}

function updateReplyPreview() {
  $("replyPreview").classList.toggle("show", !!replyTo);
}

$("cancelReply").onclick = () => {
  replyTo = null;
  updateReplyPreview();
};

$("messageForm").addEventListener("submit", async event => {
  event.preventDefault();

  const input = $("messageInput");
  const text = input.value.trim();
  if (!text) return;

  let name = localStorage.getItem("axionName");
  if (!name) {
    name = prompt("채팅에서 사용할 이름을 입력해 줘.")?.trim();
    if (!name) return;
    name = name.slice(0, 30);
    localStorage.setItem("axionName", name);
  }

  const message = {
    name,
    text,
    timestamp: Date.now()
  };

  if (replyTo) message.replyTo = replyTo;

  const sendButton = $("messageForm").querySelector("button");
  sendButton.disabled = true;
  sendButton.textContent = "...";
  $("status").textContent = "메시지 전송 중...";

  try {
    await set(
      push(ref(db, "channelMessages/" + currentChannel)),
      message
    );
    input.value = "";
    replyTo = null;
    updateReplyPreview();
    $("status").textContent = "메시지 전송 완료";
  } catch (error) {
    console.error("Axion message send error:", error);
    showModal(
      "메시지 전송 실패",
      `<p>${escapeHTML(error.message)}</p>
       <p style="font-size:11px;color:var(--muted)">
       Firebase 규칙과 데이터베이스 연결을 확인해 줘.</p>`,
      [{ label: "확인", className: "primary" }]
    );
  } finally {
    sendButton.disabled = false;
    sendButton.textContent = "보내기";
  }
});

$("addChannel").onclick = () => {
  showModal(
    "새 채널 만들기",
    '<label for="channelName">채널 이름</label><input id="channelName" maxlength="30" placeholder="예: gaming">',
    [{
      label: "만들기",
      className: "primary",
      action: async () => {
        const input = $("channelName");
        if (!input) return;
        const name = input.value.trim().replace(/\s+/g, "-");
        if (!name) return;

        const id = name.toLowerCase().replace(/[^a-z0-9가-힣_-]/g, "");
        if (!id) return;

        try {
          await set(ref(db, "channels/" + id), { name });
          switchChannel(id);
        } catch (error) {
          alert("채널 생성 실패: " + error.message);
        }
      }
    }, { label: "취소" }]
  );
};

$("themeButton").onclick = () => {
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "axionTheme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
};

if (localStorage.getItem("axionTheme") === "dark") {
  document.body.classList.add("dark");
}

$("adminButton").onclick = () => {
  if (isAdmin) {
    isAdmin = false;
    $("adminButton").textContent = "⚙ 관리자";
    $("clearButton").style.display = "none";
    renderMessages();
    return;
  }

  showModal(
    "관리자 로그인",
    '<label for="adminPassword">관리자 비밀번호</label><input id="adminPassword" type="password" placeholder="비밀번호 입력">',
    [{
      label: "로그인",
      className: "primary",
      action: () => {
        const input = $("adminPassword");
        if (input && input.value === ADMIN_PASSWORD) {
          isAdmin = true;
          $("adminButton").textContent = "관리자 로그아웃";
          $("clearButton").style.display = "inline-block";
          renderMessages();
        } else {
          alert("비밀번호가 올바르지 않아.");
        }
      }
    }, { label: "취소" }]
  );
};

async function deleteMessage(id) {
  if (!isAdmin) return;
  if (!confirm("이 메시지를 삭제할까?")) return;

  try {
    await remove(ref(db, "channelMessages/" + currentChannel + "/" + id));
  } catch (error) {
    alert("삭제 실패: " + error.message);
  }
}

$("clearButton").onclick = async () => {
  if (!isAdmin) return;
  if (!confirm("현재 채널의 모든 메시지를 삭제할까?")) return;

  try {
    await remove(ref(db, "channelMessages/" + currentChannel));
  } catch (error) {
    alert("전체 삭제 실패: " + error.message);
  }
};

$("modalBackdrop").addEventListener("click", event => {
  if (event.target === $("modalBackdrop")) closeModal();
});

listenChannels();
switchChannel("general");
</script>
</body>
</html>
